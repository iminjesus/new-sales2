<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Potential customers · Hankook</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f3f4f6;color:#111827;font-size:13px}
header{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;
       align-items:center;gap:14px;justify-content:space-between}
header .brand{font-size:14px;font-weight:700}
header .nav a{color:#cbd5e1;text-decoration:none;font-size:12px;margin-left:14px}
header .nav a:hover{color:#fff}
.wrap{max-width:1500px;margin:0 auto;padding:14px;display:grid;
      grid-template-columns:300px 1fr;gap:14px}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);
       padding:12px}
h2{font-size:13px;font-weight:700;color:#1e3a5f;margin:0 0 10px}
h3{font-size:12px;font-weight:700;color:#9a3412;margin:0 0 6px;
   text-transform:uppercase;letter-spacing:.3px}
.kpi{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.kpi .item{padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;
           border-radius:6px;display:flex;justify-content:space-between;
           align-items:center}
.kpi .item b{font-size:20px;color:#9a3412}
.kpi .lbl{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11px;padding:3px 9px;border-radius:12px;background:#f3f4f6;
      color:#374151;border:1px solid #e5e7eb}
.chip b{margin-left:4px;color:#1e3a5f}
.filters{display:flex;flex-direction:column;gap:8px}
.filters .lbl{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;
              letter-spacing:.4px}
.filters select,.filters input{padding:7px 9px;border:1px solid #d1d5db;
                                border-radius:6px;font-size:12px;width:100%}
.seg{display:flex;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;color:#374151;padding:5px 8px;
            font-size:11px;cursor:pointer;border-right:1px solid #e5e7eb;font-weight:500}
.seg button:last-child{border-right:none}
.seg button.active{background:#ea580c;color:#fff}
.btn{padding:7px 14px;border-radius:6px;border:none;background:#ea580c;color:#fff;
     font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{background:#c2410c}
.btn.sec{background:#fff;color:#374151;border:1px solid #d1d5db}
.region-hdr{margin-top:12px;padding:8px 12px;background:#1e3a5f;color:#fff;
            border-radius:6px;font-weight:700;display:flex;justify-content:space-between;
            font-size:12px}
.region-hdr .ct{font-weight:400;font-size:11px;opacity:.85}
.bde-hdr{margin-top:6px;padding:6px 12px;background:#fff7ed;color:#9a3412;
         border-left:3px solid #ea580c;font-weight:600;font-size:12px;
         display:flex;justify-content:space-between;align-items:center}
.bde-hdr .ct{font-weight:400;color:#6b7280;font-size:11px}
.card{margin:4px 0 4px 12px;padding:10px 12px;background:#fff;
      border:1px solid #e5e7eb;border-radius:6px;display:grid;
      grid-template-columns:1fr auto;gap:8px;align-items:start}
.card:hover{background:#fafafa}
.card .nm{font-weight:700;color:#1e3a5f;font-size:13px}
.card .sub{font-size:11px;color:#6b7280;margin-top:2px}
.card .meta{font-size:11px;color:#374151;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.card .meta span{color:#6b7280}
.card .meta b{color:#111827;font-weight:600}
.card .right{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
        text-transform:uppercase;letter-spacing:.3px}
.status.Lead{background:#fef3c7;color:#92400e}
.status.Visited{background:#dbeafe;color:#1e40af}
.status.Negotiating{background:#fde68a;color:#92400e}
.status.Converted{background:#dcfce7;color:#166534}
.status.Lost{background:#fee2e2;color:#991b1b}
.card .actions{display:flex;gap:6px;font-size:11px}
.card .actions a{color:#7c3aed;text-decoration:none;cursor:pointer}
.card .actions a:hover{text-decoration:underline}
.card .actions a.danger{color:#dc2626}
.empty{padding:30px;text-align:center;color:#9ca3af;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
       align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:10px;width:90%;max-width:460px;
            padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal .box h3{margin:0 0 12px;font-size:14px;color:#1e3a5f;text-transform:none;
               letter-spacing:0}
.modal .field{margin-bottom:10px}
.modal .field label{display:block;font-size:11px;font-weight:600;color:#374151;
                    margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.modal .field input,.modal .field select,.modal .field textarea{
  width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:5px;font-size:12px
}
.modal .field textarea{min-height:60px;resize:vertical;font-family:inherit}
.modal .actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.modal .msg{font-size:11px}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">🌱 Potential customers</div>
  <div class="nav">
    <a href="/">Sales Dashboard</a>
    <a href="/meeting">Visit Log</a>
    <a href="/claims">Claims</a>
    <a href="/potentials">Potentials</a>
  </div>
</header>

<div class="wrap">
  <!-- LEFT: filters + stats -->
  <div class="panel">
    <h2>Pipeline overview</h2>
    <div class="kpi">
      <div class="item">
        <div>
          <div class="lbl">Total</div>
          <b id="kpiTotal">0</b>
        </div>
        <div style="font-size:24px;">🌱</div>
      </div>
    </div>
    <h3>By status</h3>
    <div class="chip-row" id="statusChips"></div>
    <h3>Filters</h3>
    <div class="filters">
      <div>
        <div class="lbl">State</div>
        <div class="seg" id="stateSeg">
          <button data-st="" class="active">All</button>
          <button data-st="NSW">NSW</button>
          <button data-st="QLD">QLD</button>
          <button data-st="VIC">VIC</button>
          <button data-st="WA">WA</button>
        </div>
      </div>
      <div>
        <div class="lbl">BDE</div>
        <select id="bdeSel"><option value="">All</option></select>
      </div>
      <div>
        <div class="lbl">Status</div>
        <select id="statusSel">
          <option value="">All</option>
        </select>
      </div>
      <div>
        <div class="lbl">Search</div>
        <input id="q" type="text" placeholder="Name / sold-to / phone…">
      </div>
      <button class="btn" id="addBtn">+ Add new prospect</button>
    </div>
  </div>

  <!-- RIGHT: hierarchical list -->
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <h2 style="margin:0;">Prospects</h2>
      <div id="resultsCount" style="font-size:11px;color:#6b7280;"></div>
    </div>
    <div id="list" class="empty">Loading…</div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal" id="modal">
  <div class="box">
    <h3 id="modalTitle">Add prospect</h3>
    <div class="field">
      <label>Ship-to name *</label>
      <input id="mName" type="text" maxlength="160" placeholder="e.g. ABC Tyres Brisbane">
    </div>
    <div class="field">
      <label>Sold-to name (parent customer)</label>
      <input id="mSold" type="text" maxlength="160" placeholder="Leave blank if same as ship-to">
    </div>
    <div class="field" style="display:flex;gap:8px;">
      <div style="flex:1;">
        <label>State</label>
        <select id="mState">
          <option value="">—</option>
          <option>NSW</option><option>QLD</option><option>VIC</option>
          <option>WA</option><option>SA</option><option>TAS</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>BDE</label>
        <select id="mBde"><option value="">—</option></select>
      </div>
    </div>
    <div class="field" style="display:flex;gap:8px;">
      <div style="flex:1;">
        <label>Status</label>
        <select id="mStatus"></select>
      </div>
      <div style="flex:1;">
        <label>Phone</label>
        <input id="mPhone" type="tel" maxlength="40">
      </div>
    </div>
    <div class="field">
      <label>Address</label>
      <input id="mAddress" type="text" maxlength="255">
    </div>
    <div class="field">
      <label>Contact person</label>
      <input id="mContact" type="text" maxlength="120">
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="mNotes" placeholder="What you've learned, next steps…"></textarea>
    </div>
    <div class="actions">
      <span class="msg" id="modalMsg"></span>
      <div style="display:flex;gap:6px;">
        <button class="btn sec" id="modalCancel">Cancel</button>
        <button class="btn" id="modalSave">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
const state = { items: [], stats: null, editingId: null,
                filters: { state: "", bde: "", status: "", q: "" } };
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
async function fetchJSON(url, opts){
  const r = await fetch(url, opts || {});
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j || {};
}
function stateRemap(s){
  return (s === "SA" || s === "TAS") ? "VIC" : (s || "—");
}

async function loadStats(){
  try {
    state.stats = await fetchJSON("/api/potential_customers/stats");
  } catch { state.stats = { total: 0, by_state: {}, by_status: {}, by_bde: [], statuses: [] }; }
  document.getElementById("kpiTotal").textContent = state.stats.total || 0;
  // Status chips + dropdown
  const sChips = state.stats.statuses.map(s =>
    `<span class="chip">${esc(s)}<b>${state.stats.by_status[s] || 0}</b></span>`
  ).join("");
  document.getElementById("statusChips").innerHTML = sChips;
  const sSel = document.getElementById("statusSel");
  sSel.innerHTML = `<option value="">All</option>` +
    state.stats.statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  // Status options in the modal
  const mSel = document.getElementById("mStatus");
  mSel.innerHTML = state.stats.statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  // BDE dropdown
  const bSel = document.getElementById("bdeSel");
  bSel.innerHTML = `<option value="">All</option>` +
    state.stats.by_bde.map(b => `<option value="${esc(b.bde_name)}">${esc(b.bde_name)} (${b.n})</option>`).join("");
}

async function loadBdesFromDirectory(){
  // The modal's BDE dropdown comes from the people directory so the
  // user can assign a prospect to any active BDE (not just ones who
  // already have a prospect).
  try {
    const list = await fetchJSON("/api/bdes_active");
    const sel = document.getElementById("mBde");
    sel.innerHTML = `<option value="">—</option>` +
      (list || []).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  } catch {}
}

async function load(){
  const list = document.getElementById("list");
  list.className = "empty";
  list.textContent = "Loading…";
  try {
    const qs = new URLSearchParams();
    if (state.filters.state) qs.set("state", state.filters.state);
    if (state.filters.bde)   qs.set("bde",   state.filters.bde);
    const r = await fetchJSON("/api/potential_customers?" + qs.toString());
    state.items = (r && r.potentials) || [];
    render();
  } catch (e){
    list.textContent = e.message;
    list.style.color = "#dc2626";
  }
}

function render(){
  const list = document.getElementById("list");
  // Apply status + search filters client-side
  const status = state.filters.status;
  const q = (state.filters.q || "").toLowerCase();
  const items = state.items.filter(p => {
    if (status && (p.status || "Lead") !== status) return false;
    if (q){
      const hay = [p.name, p.sold_to_name, p.bde_name, p.phone, p.address,
                   p.contact_person].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById("resultsCount").textContent =
    `${items.length} of ${state.items.length}`;
  if (!items.length){
    list.className = "empty";
    list.innerHTML = "No prospects match the current filters.<br>" +
      "Add one via the “+ Add new prospect” button or from the meeting page palette.";
    return;
  }
  list.className = "";
  // Group: state → bde
  const tree = new Map();
  for (const p of items){
    const st = stateRemap(p.state);
    if (!tree.has(st)) tree.set(st, new Map());
    const byBde = tree.get(st);
    const bk = p.bde_name || "—";
    if (!byBde.has(bk)) byBde.set(bk, []);
    byBde.get(bk).push(p);
  }
  // Render
  let html = "";
  // Order: NSW, QLD, VIC, WA, then others
  const stOrder = ["NSW","QLD","VIC","WA"];
  const sortedStates = [...tree.entries()].sort((a, b) => {
    const ai = stOrder.indexOf(a[0]), bi = stOrder.indexOf(b[0]);
    if (ai >= 0 && bi >= 0) return ai - bi;
    if (ai >= 0) return -1;
    if (bi >= 0) return 1;
    return a[0].localeCompare(b[0]);
  });
  for (const [st, byBde] of sortedStates){
    const totalSt = [...byBde.values()].reduce((s, arr) => s + arr.length, 0);
    html += `<div class="region-hdr">
      <span>${esc(st)}</span>
      <span class="ct">${totalSt} prospect${totalSt === 1 ? "" : "s"}</span>
    </div>`;
    const sortedBdes = [...byBde.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    for (const [bde, arr] of sortedBdes){
      html += `<div class="bde-hdr">
        <span>${esc(bde)}</span>
        <span class="ct">${arr.length}</span>
      </div>`;
      const sortedProspects = arr.slice().sort((a, b) => a.name.localeCompare(b.name));
      for (const p of sortedProspects){
        const meta = [];
        if (p.sold_to_name && p.sold_to_name !== p.name)
          meta.push(`<span>Sold-to</span><b>${esc(p.sold_to_name)}</b>`);
        if (p.phone)          meta.push(`<span>📞</span><b>${esc(p.phone)}</b>`);
        if (p.contact_person) meta.push(`<span>👤</span><b>${esc(p.contact_person)}</b>`);
        if (p.address)        meta.push(`<span>📍</span><b>${esc(p.address)}</b>`);
        html += `<div class="card">
          <div>
            <div class="nm">${esc(p.name)}</div>
            <div class="sub">${esc(p.pseudo_ship_to)} · added ${esc(p.created_at || "")}</div>
            ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
            ${p.notes ? `<div class="sub" style="margin-top:4px;white-space:pre-wrap;">${esc(p.notes)}</div>` : ""}
          </div>
          <div class="right">
            <span class="status ${esc(p.status || 'Lead')}">${esc(p.status || 'Lead')}</span>
            <div class="actions">
              <a data-edit="${p.id}">Edit</a>
              <a class="danger" data-del="${p.id}">Delete</a>
            </div>
          </div>
        </div>`;
      }
    }
  }
  list.innerHTML = html;
  list.querySelectorAll("[data-edit]").forEach(el => {
    el.addEventListener("click", () => openModal(parseInt(el.dataset.edit, 10)));
  });
  list.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", () => deletePotential(parseInt(el.dataset.del, 10)));
  });
}

function openModal(id){
  state.editingId = id || null;
  const m = document.getElementById("modal");
  const msg = document.getElementById("modalMsg");
  msg.textContent = ""; msg.style.color = "";
  document.getElementById("modalTitle").textContent = id ? "Edit prospect" : "Add prospect";
  const get = (k) => document.getElementById(k);
  if (id){
    const p = state.items.find(x => x.id === id);
    if (!p) return;
    get("mName").value    = p.name || "";
    get("mSold").value    = p.sold_to_name || "";
    get("mState").value   = p.state || "";
    get("mBde").value     = p.bde_name || "";
    get("mStatus").value  = p.status || "Lead";
    get("mPhone").value   = p.phone || "";
    get("mAddress").value = p.address || "";
    get("mContact").value = p.contact_person || "";
    get("mNotes").value   = p.notes || "";
  } else {
    ["mName","mSold","mPhone","mAddress","mContact","mNotes"].forEach(k => get(k).value = "");
    get("mState").value = state.filters.state || "";
    get("mBde").value = state.filters.bde || "";
    get("mStatus").value = "Lead";
  }
  m.classList.add("open");
  setTimeout(() => get("mName").focus(), 50);
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  state.editingId = null;
}
async function saveFromModal(){
  const msg = document.getElementById("modalMsg");
  const get = (k) => document.getElementById(k).value;
  const payload = {
    name:           get("mName").trim(),
    sold_to_name:   get("mSold").trim(),
    state:          get("mState"),
    bde_name:       get("mBde"),
    status:         get("mStatus"),
    phone:          get("mPhone").trim(),
    address:        get("mAddress").trim(),
    contact_person: get("mContact").trim(),
    notes:          get("mNotes"),
  };
  if (!payload.name){
    msg.textContent = "Ship-to name is required."; msg.style.color = "#dc2626"; return;
  }
  if (!payload.sold_to_name) payload.sold_to_name = payload.name;
  const btn = document.getElementById("modalSave");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const url = state.editingId ? `/api/potential_customer/${state.editingId}` : "/api/potential_customer";
    const method = state.editingId ? "PATCH" : "POST";
    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!r.ok){
      msg.textContent = j.error || ("HTTP " + r.status); msg.style.color = "#dc2626";
    } else {
      closeModal();
      await Promise.all([load(), loadStats()]);
    }
  } catch (err){
    msg.textContent = err.message; msg.style.color = "#dc2626";
  }
  btn.disabled = false; btn.textContent = "Save";
}
async function deletePotential(id){
  const p = state.items.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`Remove "${p.name}"?\n\nAny meeting plans/logs already attached to this prospect will keep referencing it.`)) return;
  try {
    await fetch("/api/potential_customer/" + id, { method: "DELETE" });
    await Promise.all([load(), loadStats()]);
  } catch (err){ alert("Delete failed: " + err.message); }
}

// Filter wiring
document.getElementById("stateSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.filters.state = b.dataset.st;
  [...e.currentTarget.children].forEach(x => x.classList.toggle("active", x === b));
  load();
});
document.getElementById("bdeSel").addEventListener("change", (e) => {
  state.filters.bde = e.target.value; load();
});
document.getElementById("statusSel").addEventListener("change", (e) => {
  state.filters.status = e.target.value; render();
});
let _qt = null;
document.getElementById("q").addEventListener("input", (e) => {
  state.filters.q = e.target.value; clearTimeout(_qt);
  _qt = setTimeout(render, 200);
});
document.getElementById("addBtn").addEventListener("click", () => openModal(null));
document.getElementById("modalCancel").addEventListener("click", closeModal);
document.getElementById("modalSave").addEventListener("click", saveFromModal);
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

// Boot
(async () => {
  await loadBdesFromDirectory();
  await loadStats();
  await load();
})();
</script>
</body>
</html>
