<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop briefing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.toolbar{padding:12px 16px;background:#1e3a5f;color:#fff;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.toolbar h1{font-size:14px;font-weight:700;margin:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar a{color:#cbd5e1;font-size:12px;text-decoration:none}
.toolbar a:hover{color:#fff}
.wrap{padding:16px;max-width:780px;margin:0 auto}
/* When loaded inside the slide-in side panel (?embed=1) we hide the
   toolbar and trim the side padding so it sits flush in the popup. */
body.embed .toolbar{display:none}
body.embed .wrap{padding:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;
  padding:14px 16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:11px;font-weight:700;color:#1e3a5f;margin:0 0 10px;
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:6px;border-bottom:1px solid #e5e7eb}
.shop-head{display:flex;flex-direction:column;gap:2px}
.shop-name{font-size:18px;font-weight:700;color:#1e3a5f;line-height:1.2}
.shop-meta{font-size:11px;color:#6b7280;
  font-family:ui-monospace,Menlo,monospace}

/* One-tap communication row */
.comm-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.comm-btn{flex:1 1 calc(33% - 6px);min-width:90px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 8px;border:1px solid #d1d5db;border-radius:8px;
  background:#fff;color:#1e3a5f;font-size:11px;font-weight:600;
  text-decoration:none;cursor:pointer}
.comm-btn:hover{background:#f0f9ff;border-color:#2563eb;color:#2563eb}
.comm-btn:active{background:#dbeafe}
.comm-btn .ico{font-size:18px;line-height:1}
.comm-btn.disabled{opacity:.4;pointer-events:none;background:#fafafa}

/* Contacts table */
.contacts{font-size:12px}
.contacts .person{font-weight:600;color:#111827}
.contacts .ctc{font-family:ui-monospace,Menlo,monospace;color:#2563eb;font-size:11px}
.contacts .ago{font-size:10px;color:#9ca3af}
.contacts table{width:100%;border-collapse:collapse}
.contacts td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:top}

/* Last meeting block */
.lm-row{display:flex;gap:8px;font-size:12px;margin-bottom:5px}
.lm-row .lm-key{flex:0 0 90px;font-size:10px;font-weight:700;color:#6b7280;
  text-transform:uppercase;letter-spacing:.3px;padding-top:1px}
.lm-row .lm-val{flex:1;color:#111827;word-break:break-word}
.lm-notes{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;
  padding:8px 10px;font-size:12px;color:#374151;white-space:pre-wrap;
  line-height:1.45;margin-top:6px}
.lm-purpose{display:inline-block;font-size:10px;font-weight:700;color:#1e3a5f;
  background:#e0e7ff;padding:2px 8px;border-radius:8px;letter-spacing:.2px}

/* 6-month sales trend */
/* Y-axis labels sit just above the chart so you can read the actual
   value range the bars are scaled against (otherwise a zoomed-in
   chart can look like big swings when it's really a 5 % wobble). */
.trend-yaxis{display:flex;justify-content:space-between;
  font-size:9px;color:#9ca3af;font-family:ui-monospace,Menlo,monospace;
  padding:2px 4px 0;height:14px}
.trend-yaxis .y-top{color:#374151;font-weight:700}
.trend-chart{display:flex;align-items:stretch;gap:6px;height:120px;padding:6px 0;
  border-bottom:1px solid #e5e7eb;margin-bottom:6px}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;min-width:30px;height:100%}
.trend-bar{width:100%;max-width:50px;background:#2563eb;border-radius:3px 3px 0 0;
  min-height:3px;position:relative}
.trend-bar:hover{background:#1d4ed8}
.trend-bar span{display:none;position:absolute;bottom:100%;left:50%;
  transform:translateX(-50%);background:#1e3a5f;color:#fff;padding:3px 7px;
  border-radius:3px;font-size:10px;white-space:nowrap;margin-bottom:4px}
.trend-bar:hover span{display:block}
.trend-label{font-size:10px;font-weight:700;color:#6b7280;
  text-transform:uppercase;letter-spacing:.4px}
.trend-axis{display:flex;gap:6px;font-size:10px;color:#6b7280;
  font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.trend-axis .ax{flex:1;text-align:center}
.trend-toggle{font-size:10px;color:#2563eb;cursor:pointer;
  text-decoration:underline;float:right;margin-top:-22px;margin-bottom:8px}

/* Rebate progress (fetched separately) */
.reb-row{display:flex;gap:8px;font-size:12px;align-items:center;padding:6px 0;
  border-bottom:1px solid #f1f5f9}
.reb-row:last-child{border:none}
.reb-row .reb-struct{flex:0 0 130px;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;color:#374151}
.reb-row .reb-prog{flex:1;min-width:120px}
.reb-bar-outer{height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;
  border:1px solid #e5e7eb}
.reb-bar-inner{height:100%;background:#16a34a;transition:width .3s}
.reb-row .reb-need{flex:0 0 160px;font-size:11px;color:#374151;text-align:right}
.reb-need .need-num{font-weight:700;color:#dc2626;font-family:ui-monospace,Menlo,monospace}
.reb-need .need-rate{font-size:10px;color:#16a34a;font-weight:700}
.reb-row.reb-max .reb-need{color:#16a34a;font-weight:700}

.status-msg{padding:14px;color:#6b7280;font-size:12px;text-align:center}
.error-msg{padding:14px;color:#dc2626;font-size:12px;text-align:center;font-weight:600}

/* Meeting-focus voice button sits at the very bottom of the briefing
   so it's the last thing under the rebate card.  Click → speaks a
   paraphrased summary of the last visit / next action / 6-month
   trend / rebate progress via the Web Speech API.  Click again while
   speaking to stop. */
.focus-btn-wrap{position:sticky;bottom:8px;padding:12px 0 4px}
.focus-btn{width:100%;padding:14px 16px;border:none;border-radius:10px;
  background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer;
  box-shadow:0 3px 12px rgba(37,99,235,.35);display:flex;align-items:center;
  justify-content:center;gap:10px}
.focus-btn:hover{background:linear-gradient(180deg,#1d4ed8,#1e40af)}
.focus-btn:active{transform:translateY(1px)}
.focus-btn.speaking{background:linear-gradient(180deg,#dc2626,#b91c1c);
  box-shadow:0 3px 12px rgba(220,38,38,.35)}
.focus-btn .ico{font-size:18px;line-height:1}
.focus-hint{font-size:10px;color:#9ca3af;text-align:center;margin-top:6px;
  line-height:1.4}

@media (max-width:540px){
  .comm-btn{flex:1 1 calc(50% - 4px);min-width:auto}
  .lm-row .lm-key{flex:0 0 70px}
  .reb-row{flex-wrap:wrap}
  .reb-row .reb-struct{flex:1 0 100%}
  .reb-row .reb-need{flex:0 0 auto;text-align:left}
}
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="topTitle">Shop briefing</h1>
  <a href="/meeting" style="margin-left:auto;">← Meeting</a>
  <a href="/">Home</a>
</div>

<div class="wrap" id="wrap">
  <div class="status-msg" id="bootStatus">Loading shop briefing…</div>
</div>

<script>
// ?embed=1 → page was opened inside the right-side popup iframe;
// hide the toolbar so it sits flush in the panel.
if (new URLSearchParams(location.search).get("embed") === "1") {
  document.body.classList.add("embed");
}
const SHIP_TO = location.pathname.split("/").filter(Boolean).pop() || "";

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmtMoney(n){
  return "$" + Math.round(n || 0).toLocaleString();
}
function fmtNum(n){
  return Number(n || 0).toLocaleString();
}
function daysAgo(iso){
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  const ms = Date.now() - d.getTime();
  const days = Math.round(ms / 86400000);
  if (days < 1)  return "today";
  if (days < 2)  return "yesterday";
  if (days < 14) return days + " days ago";
  if (days < 60) return Math.round(days/7) + " weeks ago";
  return Math.round(days/30) + " months ago";
}

// One-tap communication.  A contact string is either a phone number or
// an email — pick the URL scheme by the @ sniff test, and disable
// any button we have no value for.
function makeCommBlock(contacts){
  // First valid phone + first valid email picked off the contact list.
  let phone = "", email = "";
  for (const c of contacts) {
    const v = (c.contact || "").trim();
    if (!v) continue;
    if (v.includes("@") && !email) email = v;
    else if (!phone) phone = v.replace(/[\s\-()]/g, "");
  }
  const phoneEl = phone
    ? `<a class="comm-btn" href="tel:${esc(phone)}">
         <span class="ico">📞</span><span>Call</span>
         <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#6b7280;">${esc(phone)}</span>
       </a>
       <a class="comm-btn" href="sms:${esc(phone)}">
         <span class="ico">💬</span><span>SMS</span>
         <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#6b7280;">${esc(phone)}</span>
       </a>`
    : `<span class="comm-btn disabled"><span class="ico">📞</span><span>No phone</span></span>
       <span class="comm-btn disabled"><span class="ico">💬</span><span>No phone</span></span>`;
  const emailEl = email
    ? `<a class="comm-btn" href="mailto:${esc(email)}">
         <span class="ico">📧</span><span>Email</span>
         <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;">${esc(email)}</span>
       </a>`
    : `<span class="comm-btn disabled"><span class="ico">📧</span><span>No email</span></span>`;
  return `<div class="comm-row">${phoneEl}${emailEl}</div>`;
}

function renderShop(j){
  const wrap = document.getElementById("wrap");
  const shop = j.shop || {};
  const lm   = j.last_meeting;
  const trend = j.sales_trend || [];
  document.getElementById("topTitle").textContent =
    `${shop.ship_to_name || shop.ship_to || "Shop"}`;

  // Shop header card
  const headHtml = `
    <div class="card">
      <div class="shop-head">
        <div class="shop-name">${esc(shop.ship_to_name || shop.ship_to || "(unknown)")}</div>
        <div class="shop-meta">
          #${esc(shop.ship_to || "")}
          ${shop.sold_to ? " · sold-to " + esc(shop.sold_to) : ""}
          ${shop.sold_to_name ? " (" + esc(shop.sold_to_name) + ")" : ""}
        </div>
        <div class="shop-meta">
          ${shop.bde_state ? esc(shop.bde_state) + " · " : ""}
          ${shop.salesman_name ? "BDE " + esc(shop.salesman_name) + " · " : ""}
          ${fmtNum(j.meeting_count_12m || 0)} visits past 12 months
        </div>
      </div>
      ${makeCommBlock(j.contacts || [])}
    </div>
  `;

  // Last meeting
  let meetingHtml = "";
  if (lm) {
    meetingHtml = `
      <div class="card">
        <h2>📅 Last visit — ${esc(lm.visit_date)} <span style="color:#9ca3af;font-weight:500;text-transform:none;letter-spacing:0;font-size:10px;">(${esc(daysAgo(lm.visit_date))})</span></h2>
        ${lm.visit_purpose ? `<div style="margin-bottom:8px;"><span class="lm-purpose">${esc(lm.visit_purpose)}</span></div>` : ""}
        <div class="lm-row"><div class="lm-key">BDE</div>          <div class="lm-val">${esc(lm.bde_name || "")}</div></div>
        ${lm.met_person ? `<div class="lm-row"><div class="lm-key">Met</div><div class="lm-val">${esc(lm.met_person)}${lm.met_person_contact ? ` <span style="color:#6b7280;font-family:ui-monospace,Menlo,monospace;font-size:11px;">· ${esc(lm.met_person_contact)}</span>` : ""}</div></div>` : ""}
        ${lm.next_action ? `<div class="lm-row"><div class="lm-key">Next action</div><div class="lm-val" style="color:#dc2626;">${esc(lm.next_action)}</div></div>` : ""}
        ${lm.notes ? `<div class="lm-notes">${esc(lm.notes)}</div>` : ""}
      </div>
    `;
  } else {
    meetingHtml = `
      <div class="card">
        <h2>📅 Last visit</h2>
        <div class="status-msg">No meeting log yet for this shop.</div>
      </div>
    `;
  }

  // Contacts (extra — beyond the 1 highlighted in one-tap row)
  const contacts = j.contacts || [];
  let contactsHtml = "";
  if (contacts.length > 1) {
    contactsHtml = `
      <div class="card">
        <h2>👥 All contacts on file</h2>
        <table class="contacts">
          ${contacts.map(c => `
            <tr>
              <td class="person">${esc(c.name || "—")}</td>
              <td>${c.contact
                ? (c.is_email
                    ? `<a href="mailto:${esc(c.contact)}" class="ctc">${esc(c.contact)}</a>`
                    : `<a href="tel:${esc(c.contact.replace(/[\s\-()]/g, ''))}" class="ctc">${esc(c.contact)}</a>`)
                : ""}</td>
              <td class="ago">${esc(daysAgo(c.last_seen))}</td>
            </tr>
          `).join("")}
        </table>
      </div>
    `;
  }

  // 6-month trend.  Qty by default — that's the unit BDEs and rebate
  // tiers actually care about.  Toggle flips to $ amount.
  const totalAmt = trend.reduce((a,b) => a + (b.amt || 0), 0);
  const totalQty = trend.reduce((a,b) => a + (b.qty || 0), 0);
  let trendHtml = `
    <div class="card">
      <h2>📈 6-month sales trend
        <span style="float:right;font-weight:500;text-transform:none;letter-spacing:0;color:#6b7280;font-size:10px;">
          Total: ${fmtNum(totalQty)} units · ${fmtMoney(totalAmt)}
        </span>
      </h2>
      <div style="text-align:right;">
        <span id="trendToggle" class="trend-toggle" data-mode="qty">switch to $ amount →</span>
      </div>
      <div class="trend-yaxis" id="trendYAxis"></div>
      <div class="trend-chart" id="trendChart"></div>
      <div class="trend-axis">
        ${trend.map(t => `<span class="ax">${esc(t.month)}</span>`).join("")}
      </div>
    </div>
  `;

  // Rebate placeholder (fetched separately below).
  const rebateHtml = `
    <div class="card" id="rebateCard">
      <h2>💰 Rebate progress (this month)</h2>
      <div class="status-msg" id="rebateStatus">Loading rebate progress…</div>
      <div id="rebateBody" style="display:none;"></div>
    </div>
  `;

  // Meeting-focus voice button pinned under everything.  Reads the
  // same data the cards above show, so the BDE can walk into a shop
  // holding the phone up to their ear and get a 30-second recap.
  const focusHtml = `
    <div class="focus-btn-wrap">
      <button id="meetingFocusBtn" class="focus-btn" type="button">
        <span class="ico">🔊</span>
        <span id="meetingFocusLabel">▶ Play voice briefing</span>
      </button>
      <div class="focus-hint">
        The phone speaks a summary — last visit, next action, 6-month
        trend, and rebate progress.  Tap again to stop.
      </div>
    </div>
  `;

  wrap.innerHTML = headHtml + meetingHtml + contactsHtml + trendHtml + rebateHtml + focusHtml;
  drawTrend(trend, "qty");

  // Stash the state the focus script paraphrases so it doesn't have
  // to reach back into the DOM.  rebateRows fills in when loadRebate
  // finishes; the button waits for that or speaks with the parts it
  // has if the user is fast.
  window._focusState = {
    shop:         shop,
    lastMeeting:  lm,
    trend:        trend,
    totalQty:     totalQty,
    totalAmt:     totalAmt,
    rebateRows:   [],
    _speaking:    false,
    _utter:       null,
  };

  const focusBtn = document.getElementById("meetingFocusBtn");
  if (focusBtn) focusBtn.addEventListener("click", _toggleMeetingFocusSpeech);

  document.getElementById("trendToggle").addEventListener("click", (e) => {
    const cur = e.target.dataset.mode || "qty";
    const next = cur === "qty" ? "amt" : "qty";
    e.target.dataset.mode = next;
    e.target.textContent = next === "qty" ? "switch to $ amount →" : "switch to Qty →";
    drawTrend(trend, next);
  });
}

function drawTrend(trend, mode){
  const chart  = document.getElementById("trendChart");
  const yaxis  = document.getElementById("trendYAxis");
  if (!chart) return;
  // Pick out the values for this mode (qty or amt).
  const vals = trend.map(t => mode === "qty" ? (t.qty || 0) : (t.amt || 0));
  const vmax = Math.max(...vals, 1);
  const vmin = Math.min(...vals);
  // Compress the Y axis around the actual data range so a 95–105 unit
  // month-over-month wobble doesn't render as six identical bars.
  // Floor sits at max(0, vmin - 30 % of the range) so trends stay
  // honest (bars never go below zero) and the variation is visible.
  const range = vmax - vmin;
  const floor = Math.max(0, vmin - range * 0.30);
  const ceil  = vmax + range * 0.05;
  const span  = Math.max(1, ceil - floor);
  const fmtLabel = (v) => mode === "qty" ? fmtNum(v) + " units" : fmtMoney(v);
  if (yaxis) {
    yaxis.innerHTML = `
      <span class="y-top">${esc(fmtLabel(ceil))}</span>
      <span class="y-bot">${floor > 0 ? esc(fmtLabel(floor)) : (mode === "qty" ? "0 units" : "$0")}</span>
    `;
  }
  chart.innerHTML = trend.map(t => {
    const v = mode === "qty" ? (t.qty || 0) : (t.amt || 0);
    // Floor stub = 3 px so a zero-month is visible without misleading;
    // everything else scales between 4 % and 100 % of the wrap height.
    const h = v <= floor ? 0 : Math.max(4, Math.round(((v - floor) / span) * 100));
    const isStub = (h === 0);
    return `
      <div class="trend-bar-wrap">
        <div class="trend-bar" style="height:${isStub ? '3px' : h + '%'};">
          <span>${esc(t.month)} · ${esc(fmtLabel(v))}</span>
        </div>
      </div>
    `;
  }).join("");
}

// ── Meeting-focus voice summary ─────────────────────────────────────
// Composes a spoken paraphrase of the briefing so a BDE can hear the
// last-visit / next-action / trend / rebate story on the way into the
// shop.  Uses the browser's Web Speech API — no extra dependency, no
// server round-trip.  Falls back to a printable div if TTS isn't
// available (rare on desktop, sometimes on Android WebView).

// Rebate structures usually look like "HK_ALL_ABJ_Q_SR", where the
// first token is the brand (HK / LF / HKLF), the second is the line
// (ALL / PCLT / TBR / …), the fourth is the unit (Q / A).  Parse
// what we can; leave "" for whatever we can't and let the script
// gracefully skip those bits.
function _parseRebateStructure(name){
  const tokens = String(name || "").split("_").map(t => t.trim()).filter(Boolean);
  let brand = "", line = "";
  const brands = new Set(["HK", "LF", "HKLF", "LFH", "HANKOOK", "LAUFENN"]);
  const lines  = new Set(["ALL", "PCLT", "TBR", "18PLUS", "SUV", "HM", "HK", "LF"]);
  for (const t of tokens) {
    const up = t.toUpperCase();
    if (!brand && brands.has(up)) brand = up;
    else if (!line && lines.has(up)) line = up;
  }
  // Nicer spoken forms
  const brandSpoken = ({
    "HK": "Hankook", "LF": "Laufenn", "HKLF": "Hankook and Laufenn",
    "HANKOOK": "Hankook", "LAUFENN": "Laufenn",
  })[brand] || brand;
  const lineSpoken = ({
    "ALL": "all lines", "PCLT": "P C L T", "TBR": "T B R",
    "18PLUS": "18 inch plus", "SUV": "S U V", "HM": "heavy machinery",
  })[line] || line;
  return { brand, line, brandSpoken, lineSpoken };
}

function _monthLabelToSpoken(m){
  // API returns tokens like "Feb" — spoken form is fine as-is.
  return String(m || "").trim();
}

// Composes the voice briefing as a *list of section chunks* instead
// of one flat string.  Each chunk becomes its own SpeechSynthesis
// utterance with a real pause between them (see _speakChunks below),
// so the reader gets a moment to catch up between "next action" and
// "sales trend" — that mash-up was the main "hard to listen to"
// complaint.
//
// Copy is intentionally conversational — contractions, transition
// phrases like "Alright" / "Now" / "One more thing", short sentences
// mixed with longer ones — so the OS voice sounds less like a menu
// prompt and more like a colleague briefing you before you walk in.
function _composeFocusChunks(state){
  const s = state || {};
  const chunks = [];

  // ── Intro ──────────────────────────────────────────────
  const shopName = (s.shop && (s.shop.ship_to_name || s.shop.ship_to)) || "this shop";
  const bde      = (s.shop && s.shop.salesman_name) || "";
  const introBits = [`Alright, quick brief on ${shopName}.`];
  if (bde) introBits.push(`Your BDE on this account is ${bde}.`);
  chunks.push(introBits.join(" "));

  // ── Last visit ────────────────────────────────────────
  const lm = s.lastMeeting;
  if (lm) {
    const when = lm.visit_date ? daysAgo(lm.visit_date) : "recently";
    const lead = /(day|week|month|year|ago|today|yesterday)/i.test(when)
      ? `The last visit was ${when}`
      : `Last visit was ${when}`;
    let sentence = lead;
    if (lm.bde_name)      sentence += `, by ${lm.bde_name}`;
    if (lm.met_person)    sentence += `, meeting with ${lm.met_person}`;
    if (lm.visit_purpose) sentence += `, and it was about ${lm.visit_purpose}`;
    chunks.push(sentence + ".");
    if (lm.notes) {
      let n = String(lm.notes).replace(/\s+/g, " ").trim();
      if (n.length > 260) {
        const cut = n.lastIndexOf(". ", 260);
        n = (cut > 60 ? n.slice(0, cut + 1) : n.slice(0, 250) + "…");
      }
      chunks.push(`Here's what happened: ${n}`);
    }
    if (lm.next_action) {
      chunks.push(`So the next action is to ${lm.next_action.replace(/^to\s+/i, "")}.`);
    }
  } else {
    chunks.push("There's no prior visit logged for this shop yet.");
  }

  // ── 6-month sales trend + last-3-month direction ─────
  const t = s.trend || [];
  if (t.length) {
    const totalQty = s.totalQty || 0;
    const avg = Math.round(totalQty / t.length);
    chunks.push(
      `Now on the numbers. Over the last six months they've bought ${totalQty.toLocaleString()} units in total, `
      + `so around ${avg.toLocaleString()} a month on average.`
    );

    if (t.length >= 3) {
      const last3 = t.slice(-3).map(x => +x.qty || 0);
      const prev3 = t.slice(-6, -3).map(x => +x.qty || 0);
      const avgLast3 = last3.reduce((a,b)=>a+b,0) / last3.length;
      const avgPrev3 = prev3.length ? prev3.reduce((a,b)=>a+b,0) / prev3.length : 0;
      const monotonicUp   = last3[0] < last3[1] && last3[1] < last3[2];
      const monotonicDown = last3[0] > last3[1] && last3[1] > last3[2];
      let sentence = "";
      if (avgPrev3 > 0) {
        const pct = Math.round((avgLast3 - avgPrev3) / avgPrev3 * 100);
        if (pct >= 10)          sentence = `The last three months are trending up — about ${pct} percent higher than the three months before.`;
        else if (pct <= -10)    sentence = `Heads up — the last three months are trending down, about ${Math.abs(pct)} percent lower than the three months before.`;
        else if (monotonicUp)   sentence = "The last three months are creeping up, slowly but consistently.";
        else if (monotonicDown) sentence = "The last three months are creeping down, slowly but consistently.";
        else                    sentence = "The last three months are pretty steady, no big swing.";
      } else if (avgLast3 > 0) {
        sentence = "The last three months are picking up from basically nothing — a fresh account starting to move.";
      }
      if (sentence) chunks.push(sentence);
    }
  }

  // ── Rebate progress ───────────────────────────────────
  const rebRows = s.rebateRows || [];
  if (rebRows.length) {
    chunks.push("One more thing — rebate progress for this month.");
    for (const r of rebRows) {
      const parsed = _parseRebateStructure(r.structure_name);
      const forWho = [parsed.brandSpoken, parsed.lineSpoken ? "for " + parsed.lineSpoken : ""]
        .filter(Boolean).join(" ").trim();
      const who = forWho || r.structure_name;
      if (!r.next_threshold) {
        chunks.push(`On ${who}, they've already hit the top tier at ${r.curr_rate} percent. Nice.`);
        continue;
      }
      const needed = (r.unit === "Q") ? r.needed_qty : r.needed_amt;
      const unit   = (r.unit === "Q") ? "units" : "dollars";
      const nRound = Math.round(needed || 0).toLocaleString();
      chunks.push(
        `On ${who}, they need ${nRound} more ${unit} to jump from ${r.curr_rate} to ${r.next_rate} percent.`
      );
    }
  }

  // ── Closer ────────────────────────────────────────────
  chunks.push("That's the brief. Good luck.");

  return chunks;
}

// Legacy compose helper — some UI paths (SSR alerts, tests) still
// expect a flat string.  Join the chunks with a period + space so it
// reads like one long sentence when TTS isn't available.
function _composeFocusScript(state){
  return _composeFocusChunks(state).join(" ");
}

function _toggleMeetingFocusSpeech(){
  const state = window._focusState;
  const btn   = document.getElementById("meetingFocusBtn");
  const lbl   = document.getElementById("meetingFocusLabel");
  if (!state || !btn || !lbl) return;

  // Already speaking? Cancel and reset.
  if (state._speaking) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
    state._speaking = false;
    state._utter = null;
    btn.classList.remove("speaking");
    lbl.textContent = "▶ Play voice briefing";
    return;
  }
  if (!("speechSynthesis" in window)) {
    // Fallback — dump the text into a div so at least the reader
    // can see what would have been said.
    alert(_composeFocusScript(state));
    return;
  }

  // Pick a natural-ish voice once so every chunk uses the same voice
  // (mixing voices between chunks reads as glitchy).  Prefer an
  // en-AU voice when the OS has one; otherwise fall back to a Google
  // / Microsoft "Natural" voice on Chromium / Edge, then en-GB / en-US.
  const voices = window.speechSynthesis.getVoices() || [];
  const pickVoice = (v) =>
       voices.find(vc => v.test(vc.name) && /en/i.test(vc.lang));
  const auVoice = voices.find(v => /en[-_]AU/i.test(v.lang))
              || pickVoice(/natural|neural|online/i)
              || voices.find(v => /en[-_](GB|US)/i.test(v.lang))
              || voices[0];

  const chunks = _composeFocusChunks(state);
  if (!chunks.length) return;

  // Between-section gap.  Each chunk becomes its own utterance and
  // we insert this many milliseconds of real silence before starting
  // the next one — enough for the listener to reset their attention
  // between "next action" and "sales trend" without feeling slow.
  const GAP_MS = 420;

  state._speaking = true;
  btn.classList.add("speaking");
  lbl.textContent = "⏸ Speaking — tap to stop";

  // Cancel any lingering utterance (Chrome sometimes leaves a stale
  // one queued after a previous stop) and reset before speaking.
  try { window.speechSynthesis.cancel(); } catch (_) {}

  let idx = 0;
  const done = () => {
    state._speaking = false;
    state._utter = null;
    btn.classList.remove("speaking");
    lbl.textContent = "▶ Play voice briefing";
  };
  const speakNext = () => {
    // User hit Stop midway → bail
    if (!state._speaking) return;
    if (idx >= chunks.length) { done(); return; }
    const text = chunks[idx++];
    const u = new SpeechSynthesisUtterance(text);
    // Slightly slower than default so it reads as measured, not
    // rushed.  Tiny pitch variation between chunks would sound more
    // natural still but breaks the "one voice" illusion — leave
    // pitch constant.
    u.rate   = 0.97;
    u.pitch  = 1.02;
    u.volume = 1.0;
    if (auVoice) u.voice = auVoice;
    u.onerror = () => { done(); };
    u.onend   = () => {
      if (!state._speaking) return;
      if (idx < chunks.length) setTimeout(speakNext, GAP_MS);
      else done();
    };
    state._utter = u;
    try { window.speechSynthesis.speak(u); }
    catch (e) {
      console.error("[meeting-focus] TTS failed:", e);
      done();
    }
  };
  speakNext();
}

// Rebate next-tier — uses the existing /api/rebate_data endpoint
// filtered to just this ship_to (server already supports this filter).
// The response is nested:
//   { groups: [ { brands: [ { items: [ {ship_to, ...}, ... ] } ] } ] }
// so we flatten across groups → brands → items, plus items that carry
// ship_details (per-Sold-To-grouped rebates show one tier basis with
// multiple ship_tos under it) — and keep only the entries that match
// THIS ship_to.
async function loadRebate(){
  const status = document.getElementById("rebateStatus");
  const body   = document.getElementById("rebateBody");
  if (!status || !body) return;
  try {
    const qs = new URLSearchParams({
      ship_to: SHIP_TO,
      show:    "ALL",
      sort:    "actual",
      dir:     "desc",
      page:    "0",
      page_size: "200",
    });
    const r = await fetch("/api/rebate_data?" + qs.toString());
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));

    const rows = [];
    for (const g of (j.groups || [])) {
      for (const b of (g.brands || [])) {
        for (const item of (b.items || [])) {
          if (String(item.ship_to) === String(SHIP_TO)) {
            rows.push(item);
          }
          // Per-Sold-To-tier rows expose individual ship_to actuals
          // under ship_details — merge those into the parent item so
          // the displayed actual is this ship's own contribution.
          for (const sd of (item.ship_details || [])) {
            if (String(sd.ship_to) === String(SHIP_TO)) {
              rows.push(Object.assign({}, item, {
                ship_to:     sd.ship_to,
                actual_qty:  sd.actual_qty,
                actual_amt:  sd.actual_amt,
                ship_detail: true,
              }));
            }
          }
        }
      }
    }

    if (!rows.length) {
      status.textContent = "No rebate structure mapped for this shop.";
      if (window._focusState) window._focusState.rebateRows = [];
      return;
    }
    // Feed the meeting-focus voice summary too.
    if (window._focusState) window._focusState.rebateRows = rows;
    body.innerHTML = rows.map(r => {
      const fmt = (n) => r.unit === "Q" ? fmtNum(n) + " units" : fmtMoney(n);
      const needed = r.unit === "Q" ? r.needed_qty : r.needed_amt;
      // Per-sold-to rebates: this row's own actual is its contribution
      // but the tier comparison uses the sold-to / group basis
      // (tier_actual on the parent).  Use tier_actual when present so
      // the progress bar reflects what actually qualifies for the tier.
      const basisActual = (r.tier_actual != null) ? r.tier_actual
        : (r.unit === "Q" ? r.actual_qty : r.actual_amt);
      const nextThr = r.next_threshold;
      const atMax = !nextThr;
      const pct = (nextThr && nextThr > 0)
        ? Math.min(100, Math.round((basisActual / nextThr) * 100))
        : 100;
      const detailNote = r.ship_detail
        ? `<span style="font-size:9px;color:#9ca3af;font-style:italic;margin-left:4px;">(per Sold-To)</span>`
        : "";
      return `
        <div class="reb-row ${atMax ? 'reb-max' : ''}">
          <div class="reb-struct">${esc(r.structure_name)}${detailNote}</div>
          <div class="reb-prog">
            <div style="display:flex;justify-content:space-between;font-size:10px;color:#6b7280;margin-bottom:2px;">
              <span>${fmt(basisActual)} / ${atMax ? "(top tier reached)" : fmt(nextThr)}</span>
              <span style="font-weight:700;color:#16a34a;">${r.curr_rate}%</span>
            </div>
            <div class="reb-bar-outer">
              <div class="reb-bar-inner" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="reb-need">
            ${atMax
              ? "🏆 Top tier"
              : `<span class="need-num">+${fmt(needed)}</span><br>
                 to <span class="need-rate">${r.next_rate}%</span> tier`}
          </div>
        </div>
      `;
    }).join("");
    status.style.display = "none";
    body.style.display = "";
  } catch (e) {
    status.textContent = "Rebate load failed: " + e.message;
  }
}

(async () => {
  const status = document.getElementById("bootStatus");
  try {
    const r = await fetch("/api/shop_briefing/" + encodeURIComponent(SHIP_TO));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    renderShop(j);
    loadRebate();
  } catch (e) {
    status.className = "error-msg";
    status.textContent = "Error: " + e.message;
  }
})();
</script>
