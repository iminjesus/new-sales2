<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim QR — Bulk print</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e5e7eb;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.toolbar{position:sticky;top:0;z-index:10;padding:10px 14px;background:#1e3a5f;color:#fff;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toolbar h1{font-size:13px;font-weight:700;margin:0;flex:1}
.toolbar a{color:#cbd5e1;font-size:12px;text-decoration:none}
.toolbar a:hover{color:#fff}
.toolbar select,.toolbar input{background:#fff;color:#111827;border:none;
  border-radius:5px;padding:5px 8px;font-size:12px}
.toolbar button{background:#2563eb;color:#fff;border:none;border-radius:5px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.toolbar button:hover{background:#1d4ed8}
.toolbar button:disabled{background:#9ca3af;cursor:not-allowed}
.status{padding:14px;color:#6b7280;font-size:12px}
/* A4 page: 210×297mm.  Per-page layout picked at runtime via .layout-N
   classes — 1 (full page), 2 (1×2 stack), or 12 (3×4 grid, the default).
   Per-page card dimensions in the .layout-N rules below tune QR / text
   sizes so each variant looks correct printed. */
.pages{padding:20px;display:flex;flex-direction:column;gap:20px;align-items:center}
.page{width:210mm;background:#fff;padding:8mm;display:grid;
  gap:4mm;page-break-after:always;min-height:297mm;
  box-shadow:0 2px 10px rgba(0,0,0,.1)}
.page.layout-12{grid-template-columns:repeat(3, 1fr);grid-template-rows:repeat(4, 1fr)}
.page.layout-2 {grid-template-columns:1fr;grid-template-rows:repeat(2, 1fr)}
.page.layout-1 {grid-template-columns:1fr;grid-template-rows:1fr}
.card{border:1px dashed #d1d5db;border-radius:2mm;padding:3mm;display:flex;
  flex-direction:column;align-items:center;text-align:center;font-size:8pt;
  background:#fff}
/* Larger-per-page layouts get larger QR + text */
.page.layout-2 .card{font-size:13pt;padding:8mm}
.page.layout-2 .card .qr{width:80mm;height:80mm}
.page.layout-2 .card .title{font-size:18pt;margin:3mm 0 5mm}
.page.layout-2 .card .brand{font-size:11pt}
.page.layout-2 .card .shop-name{font-size:14pt;margin-top:6mm}
.page.layout-2 .card .shop-code{font-size:11pt}
.page.layout-2 .card .url{font-size:10pt;margin-top:3mm}
.page.layout-1 .card{font-size:18pt;padding:14mm}
.page.layout-1 .card .qr{width:130mm;height:130mm}
.page.layout-1 .card .title{font-size:28pt;margin:6mm 0 10mm}
.page.layout-1 .card .brand{font-size:14pt}
.page.layout-1 .card .shop-name{font-size:20pt;margin-top:10mm}
.page.layout-1 .card .shop-code{font-size:14pt}
.page.layout-1 .card .url{font-size:13pt;margin-top:5mm}
.card .brand{font-size:7pt;font-weight:700;color:#1e3a5f;letter-spacing:.3px}
.card .title{font-size:9pt;font-weight:800;color:#111827;margin:1mm 0 2mm}
.card .qr{width:36mm;height:36mm;display:flex;align-items:center;justify-content:center;
  padding:1mm;border:1px solid #e5e7eb;border-radius:1mm}
.card .qr img{width:100%;height:100%;object-fit:contain}
.card .shop-name{font-size:8pt;font-weight:700;color:#1e3a5f;margin-top:2mm;
  line-height:1.15;word-break:break-word;padding:0 1mm}
.card .shop-code{font-size:7pt;color:#6b7280;font-family:ui-monospace,Menlo,monospace;
  margin-top:0.5mm}
.card .url{font-size:6pt;color:#1e3a5f;font-family:ui-monospace,Menlo,monospace;
  word-break:break-all;margin-top:1mm;padding:0 1mm;line-height:1.1}
@media print {
  body{background:#fff}
  .toolbar,.status{display:none}
  .pages{padding:0;gap:0}
  .page{box-shadow:none;page-break-after:always}
  @page { size: A4; margin: 0 }
}
</style>
</head>
<body>
<div class="toolbar">
  <h1>Hankook claim QR — bulk print</h1>
  <label>State
    <select id="stateSel">
      <option value="">All</option>
      <option value="NSW">NSW</option>
      <option value="QLD">QLD</option>
      <option value="VIC">VIC</option>
      <option value="WA">WA</option>
      <option value="SA">SA</option>
      <option value="TAS">TAS</option>
    </select>
  </label>
  <label>BDE
    <select id="bdeSel">
      <option value="">All</option>
    </select>
  </label>
  <label>Per page
    <select id="perPageSel">
      <option value="12" selected>12 (3×4)</option>
      <option value="2">2 (stacked)</option>
      <option value="1">1 (full page)</option>
    </select>
  </label>
  <label>Limit
    <input id="limitInput" type="number" value="60" min="1" max="300" style="width:64px;">
  </label>
  <button id="loadBtn">Load</button>
  <button id="printBtn" disabled>Print all pages</button>
  <a href="/claims" style="margin-left:auto;">← Back to claims</a>
</div>

<div class="status" id="status">Pick a state and click Load.</div>
<div class="pages" id="pages"></div>

<script>
// Per-page count is driven by the Per page dropdown — kept as a
// function so loadShops() always reads the current selection.
function currentPerPage(){
  return parseInt(document.getElementById("perPageSel").value, 10) || 12;
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function cardHtml(s, baseUrl){
  const url = `${baseUrl}/claim/${s.ship_to}`;
  return `
    <div class="card">
      <img src="/static/img/hankook_logo.png" alt=""
           style="max-height:6mm;max-width:25mm;object-fit:contain;margin-bottom:1mm;"
           onerror="this.style.display='none'">
      <div class="title">Tyre Claim Form</div>
      <div class="qr"><img src="/api/claim/qr/${encodeURIComponent(s.ship_to)}" alt=""></div>
      <div class="shop-name">${esc(s.ship_to_name || s.ship_to)}</div>
      <div class="shop-code">#${esc(s.ship_to)}</div>
      <div class="url">${esc(url)}</div>
    </div>`;
}
async function loadShops(){
  const status = document.getElementById("status");
  const pages  = document.getElementById("pages");
  const state  = document.getElementById("stateSel").value;
  const bde    = document.getElementById("bdeSel").value;
  const limit  = document.getElementById("limitInput").value || "60";
  status.textContent = "Loading…";
  pages.innerHTML = "";
  document.getElementById("printBtn").disabled = true;
  try {
    const qs = new URLSearchParams({ limit });
    if (state) qs.set("state", state);
    if (bde)   qs.set("bde",   bde);
    const r = await fetch("/api/claim/qr_shops?" + qs.toString());
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    refreshBdeOptions(j.bdes || [], bde);
    const shops = j.shops || [];
    if (!shops.length){
      status.textContent = "No shops match.";
      return;
    }
    const perPage = currentPerPage();
    let html = "";
    for (let i = 0; i < shops.length; i += perPage){
      const slice = shops.slice(i, i + perPage);
      // Pad only when the grid actually has fixed slots — the 1- and
      // 2-up layouts look cleaner if the last page just shows what's
      // left rather than empty placeholders.
      if (perPage >= 12) while (slice.length < perPage) slice.push(null);
      html += `<div class="page layout-${perPage}">` +
              slice.map(s => s ? cardHtml(s, j.base_url) : `<div class="card" style="visibility:hidden;"></div>`).join("") +
              `</div>`;
    }
    pages.innerHTML = html;
    const stateLabel = state ? state + " · " : "";
    const bdeLabel   = bde ? `${bde} · ` : "";
    status.textContent = `${bdeLabel}${stateLabel}${shops.length} shops · ${Math.ceil(shops.length / perPage)} A4 page${shops.length > perPage ? "s" : ""} · ${perPage}/page`;
    document.getElementById("printBtn").disabled = false;
  } catch (e){
    status.textContent = "Error: " + e.message;
  }
}
// Keep the BDE picker's options narrowed to the BDEs that actually
// exist within the current State filter (re-derived from the
// /qr_shops response so we don't pay a second round trip).
function refreshBdeOptions(bdes, currentVal){
  const sel = document.getElementById("bdeSel");
  if (!sel) return;
  const keep = currentVal && bdes.includes(currentVal) ? currentVal : "";
  sel.innerHTML = '<option value="">All</option>' +
    bdes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.value = keep;
}
// Reset BDE pick whenever the State changes (the next Load fetches the
// matching set), so the picker can't keep a BDE that's no longer in scope.
document.getElementById("stateSel").addEventListener("change", () => {
  document.getElementById("bdeSel").value = "";
});
document.getElementById("loadBtn").addEventListener("click", loadShops);
// Re-render with the new layout when the per-page picker changes —
// no need to re-hit the server; the shop set is the same.
document.getElementById("perPageSel").addEventListener("change", () => {
  if (document.getElementById("pages").children.length) loadShops();
});
document.getElementById("printBtn").addEventListener("click", () => window.print());
// Boot: populate the BDE list so the user can pick before the first Load.
loadShops();
</script>
</body>
</html>
