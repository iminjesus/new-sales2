<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Map</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="/static/style.css?v=20260319">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Chart.js + datalabels (for side charts) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script>
    Chart.register(ChartDataLabels);
  </script>

  <style>
    #salesMap{ height: 580px; min-height: 580px; }
  </style>
</head>
<body>
  <h2 style="margin:10px 0 8px; font-size:18px; color:#111827; font-weight:700; letter-spacing:-0.01em;">Sales Map</h2>

  <!-- Mobile: toggle button for filter panel -->
  <button id="filterToggleBtn" class="filter-toggle-btn">
    <span>&#9881; Filters</span><span class="filter-toggle-arrow">&#9660;</span>
  </button>

  <div id="filterPanel">

  <!-- ── Top filter bar ── -->
  <div id="topRow" class="filter-bar">
    <div id="catBtns" style="display:flex; gap:5px; flex-wrap:wrap;">
      <button class="btn active" data-val="ALL">All</button>
      <button class="btn" data-val="PCLT">PCLT</button>
      <button class="btn" data-val="TBR">TBR</button>
      <button class="btn" data-val="18PLUS">18+ Inch</button>
      <button class="btn" data-val="ISEG">EV/iSeg</button>
      <button class="btn" data-val="SUV">SUV</button>
      <button class="btn" data-val="LOWPROFILE">Low profile / Strategic TBR</button>
      <button class="btn" data-val="HM">HM</button>
    </div>

    <div class="filter-sep"></div>

    <div id="metricBtns" style="display:flex; gap:5px;">
      <button class="btn" data-metric="qty">Qty</button>
      <button class="btn" data-metric="amount">Amount</button>
    </div>

    <div class="filter-sep"></div>

    <div style="display:flex; align-items:center; gap:6px;">
      <label>Group By:</label>
      <select id="group_by">
        <option value="region" selected>Region</option>
        <option value="salesman">Salesman</option>
        <option value="sold_to_group">Sold-to Group</option>
        <option value="sold_to">Sold-to</option>
        <option value="product_group">Product Group</option>
      </select>
    </div>

    <div id="viewSwitch" style="margin-left:auto; display:flex; gap:6px;">
      <button class="btn" onclick="window.location.href='/'+ window.location.search">Graph View</button>
      <button class="btn active">Map View</button>
      <button class="btn" onclick="window.location.href='/stock'+ window.location.search">Stock</button>
      <button class="btn" onclick="window.location.href='/rebate'">Rebate</button>
    </div>
  </div>

  <!-- ── Second filter bar ── -->
  <div class="filter-bar">
    <div id="regionBtns" style="display:flex; gap:5px;">
      <button class="btn active" data-val="ALL">ALL</button>
      <button class="btn" data-val="NSW">NSW</button>
      <button class="btn" data-val="QLD">QLD</button>
      <button class="btn" data-val="VIC">VIC</button>
      <button class="btn" data-val="WA">WA</button>
    </div>

    <div class="filter-sep"></div>

    <div style="display:flex; align-items:center; gap:5px;">
      <label>Salesman:</label>
      <select id="salesman_name"><option value="ALL">ALL</option></select>
    </div>

    <div style="display:flex; align-items:center; gap:5px;">
      <label>Sold-to Group:</label>
      <select id="sold_to_group"><option value="ALL">ALL</option></select>
    </div>

    <div class="filter-sep"></div>

    <div id="topCustomerControls" style="display:flex; gap:5px;">
      <button class="btn active" data-limit="0">All</button>
      <button class="btn" data-limit="10">Top 10</button>
      <button class="btn" data-limit="20">Top 20</button>
      <button class="btn" data-limit="30">Top 30</button>
    </div>

    <div class="filter-sep"></div>

    <!-- Sold-to -->
    <div class="dd" id="ddSoldTo">
      <label for="sold_to">Sold-to</label>
      <div class="dd-wrap">
        <input id="sold_to" type="text" placeholder="Search Sold-to..." autocomplete="off">
        <button type="button" class="dd-btn" id="soldToBtn">▼</button>
        <button type="button" class="dd-btn dd-clear-btn" id="soldToClear">✕</button>
      </div>
      <div class="dd-menu" id="soldToMenu"></div>
    </div>

    <!-- Ship-to -->
    <div class="dd" id="ddShipTo">
      <label for="ship_to">Ship-to</label>
      <div class="dd-wrap">
        <input id="ship_to" type="text" placeholder="Search Ship-to..." autocomplete="off">
        <button type="button" class="dd-btn" id="shipToBtn">▼</button>
        <button type="button" class="dd-btn dd-clear-btn" id="shipToClear">✕</button>
      </div>
      <div class="dd-menu" id="shipToMenu"></div>
    </div>

    <!-- Product Group (no clear) -->
    <div class="dd" id="ddProductGroup">
      <label for="product_group">Product Group</label>
      <div class="dd-wrap">
        <input id="product_group" type="text" placeholder="All Groups" autocomplete="off">
        <button type="button" class="dd-btn" id="pgBtn">▼</button>
        <button type="button" class="dd-btn dd-clear-btn" id="pgClear">✕</button>
      </div>
      <div class="dd-menu" id="pgMenu"></div>
    </div>

    <!-- Pattern -->
    <div class="dd" id="ddPattern">
      <label for="pattern">Pattern</label>
      <div class="dd-wrap">
        <input id="pattern" type="text" placeholder="Search Pattern" autocomplete="off">
        <button type="button" class="dd-btn" id="patternBtn">▼</button>
        <button type="button" class="dd-btn dd-clear-btn" id="patternClear">✕</button>
      </div>
      <div class="dd-menu" id="patternMenu"></div>
    </div>

    <!-- Size -->
    <div class="dd" id="ddMaterial">
      <label for="material">Size</label>
      <div class="dd-wrap">
        <input id="material" type="text" placeholder="Search Size" autocomplete="off">
        <button type="button" class="dd-btn" id="materialBtn">▼</button>
        <button type="button" class="dd-btn dd-clear-btn" id="materialClear">✕</button>
      </div>
      <div class="dd-menu" id="materialMenu"></div>
    </div>
  </div>

  </div><!-- end #filterPanel -->

  <div id="mapLayout" class="chart-row" style="margin-top:4px;">
    <div id="mapWrapper" class="box" style="flex:2;">
      <div id="mapLegend" style="display:none;font-size:12px;padding:4px 6px 6px;color:#444;">
        <span style="margin-right:10px;font-weight:600;">BDE view:</span>
        <span style="display:inline-flex;align-items:center;margin-right:10px;">
          <span style="width:10px;height:10px;border-radius:50%;background:#16a34a;display:inline-block;margin-right:4px;"></span>own + visited
        </span>
        <span style="display:inline-flex;align-items:center;margin-right:10px;">
          <span style="width:10px;height:10px;border-radius:50%;background:#dc2626;display:inline-block;margin-right:4px;opacity:.6;"></span>own + not visited
        </span>
        <span style="display:inline-flex;align-items:center;">
          <span style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block;margin-right:4px;"></span>visited outside territory
        </span>
      </div>
      <div id="salesMap"></div>
    </div>

    <div id="mapSidePanel" class="box" style="flex:1;">
      <h3 id="shopTitle">Click a shop on the map</h3>
      <div class="chartPane">
        <canvas id="monthlyChart"></canvas>
      </div>
      <div class="chartPane">
        <canvas id="yearlyChart"></canvas>
      </div>
      <div id="bdeVisitTablePane" style="margin-top:8px;">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px;">
          <strong style="font-size:13px;">Number of Visits by BDE (2026, business days only)</strong>
          <span id="bdeVisitTotals" style="font-size:11px;color:#666;"></span>
        </div>
        <table id="bdeVisitTable"
               style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead>
            <tr style="background:#f0f0f0;">
              <th style="text-align:left;padding:4px 6px;border-bottom:1px solid #ccc;">State</th>
              <th style="text-align:left;padding:4px 6px;border-bottom:1px solid #ccc;">BDE</th>
              <th style="text-align:right;padding:4px 6px;border-bottom:1px solid #ccc;">Shops</th>
              <th style="text-align:right;padding:4px 6px;border-bottom:1px solid #ccc;">Visited Shop</th>
              <th style="text-align:right;padding:4px 6px;border-bottom:1px solid #ccc;">Visits</th>
              <th style="text-align:right;padding:4px 6px;border-bottom:1px solid #ccc;" title="Business days with no shop visit">No-Visit Days</th>
            </tr>
          </thead>
          <tbody><tr><td colspan="6" style="padding:6px;color:#999;">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="errbar" class="errbar" hidden></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
  (function () {
    var btn = document.getElementById("filterToggleBtn");
    var panel = document.getElementById("filterPanel");
    if (btn && panel) {
      btn.addEventListener("click", function () {
        var open = panel.classList.toggle("open");
        btn.querySelector(".filter-toggle-arrow").textContent = open ? "\u25b2" : "\u25bc";
      });
    }
  })();
  </script>

  <!-- shared dashboard logic -->
  <script src="/static/app.js?v=20260331" defer></script>
  <!-- small map-specific layer that reuses app.js -->
  <script src="/static/map.js?v=20260331" defer></script>
</body>
</html>
