    <span>&#9881; Filters</span><span class="filter-toggle-arrow">&#9660;</span>
  </button>

  <div id="filterPanel">

  <!-- ── Top filter bar ── -->

      <button class="btn active" data-val="ALL">All</button>

      <button class="btn" data-val="18PLUS">18+ Inch</button>
      <button class="btn" data-val="ISEG">EV/iSeg</button>
      <button class="btn" data-val="SUV">SUV</button>
      <button class="btn" data-val="LOWPROFILE">Low profile / Strategic TBR</button>
      <button class="btn" data-val="HM">HM</button>
      <button class="btn" data-val="HK">HK</button>
      <button class="btn" data-val="LF">LF</button>
    </div>

    <div class="filter-sep"></div>

    <div id="metricBtns" style="display:flex; gap:5px;">

      <button class="btn" data-metric="amount">Amount</button>
    </div>

    <div class="filter-sep"></div>

        <option value="sold_to_group">Sold-to Group</option>
        <option value="sold_to">Sold-to</option>
        <option value="product_group">Product Group</option>
      </select>
    </div>

    <div id="viewSwitch" style="margin-left:auto; display:flex; gap:6px;">
      <button class="btn" onclick="window.location.href='/'+ window.location.search">Graph View</button>
      <button class="btn active">Map View</button>
      <button class="btn" onclick="window.location.href='/stock'+ window.location.search">Stock</button>
      <button class="btn" onclick="window.location.href='/rebate'">Rebate</button>
      <button class="btn" onclick="window.location.href='/price'">Price</button>
      <button class="btn" onclick="window.location.href='/meeting'">Meeting</button>

  </div>

  <!-- ── Second filter bar ── -->
  <div class="filter-bar">
    <div id="regionBtns" style="display:flex; gap:5px;">

      <button class="btn" data-val="NSW">NSW</button>
      <button class="btn" data-val="QLD">QLD</button>
      <button class="btn" data-val="VIC">VIC</button>
      <button class="btn" data-val="WA">WA</button>
    </div>

    <div class="filter-sep"></div>

    <div style="display:flex; align-items:center; gap:5px;">
      <label>Salesman:</label>
      <select id="salesman_name"><option value="ALL">ALL</option></select>
    </div>

    <div style="display:flex; align-items:center; gap:5px;">
      <label>Sold-to Group:</label>

    <div id="topCustomerControls" style="display:flex; gap:5px;">

    <div class="filter-sep"></div>

  <!-- Fleet-by-rim panel removed — the chart now renders as a
       Leaflet popup on the postcode that gets clicked, small enough
       to sit on top of the map without stealing screen space.  See
       the click handler further down. -->

  <script>
  // Fleet-by-rim popup chart — on postcode-boundary click, fetch
  // /api/fleet_by_rim for that postcode and render a compact bar
  // chart (Fleet + HK + Penetration %) inside a Leaflet popup at the
  // clicked location.
  (function(){
    const RIM_COLORS = {
      "R13":"#a3a3a3","R14":"#94a3b8","R15":"#60a5fa","R16":"#38bdf8",
      "R17":"#22c55e","R18":"#eab308","R19":"#f97316","R20":"#ef4444",
      "R21":"#a855f7","R22+":"#6b7280",
      // TBR half-inch sizes — muted browns to visually read as "truck"
      // and stand apart from the passenger palette above.
      "R17.5 (TBR)":"#a16207","R19.5 (TBR)":"#78350f","R22.5 (TBR)":"#451a03",
      "R22+ (truck)":"#6b7280",   // legacy label, kept for cache-warm rows
      "MOTORCYCLE":"#78716c","UNKNOWN":"#d1d5db",
    };
    const fmt = n => Number(n||0).toLocaleString();
    let postcodeLayer = null;

    // Build a Chart.js config for the compact popup chart (~380 px
     // wide).  Keeps three axes — Fleet (left), HK sold (right), and
     // Penetration % (far right) — matching the previous panel chart.
    // Map a tyre size back to its rim-family colour so the chart still
    // reads visually as "R16 block · R17 block · R18 block" even
    // though every column is now a distinct full size string.
    function _sizeColor(size){
      const m = /R\s*(\d{2}(?:\.\d)?)/i.exec(size);
      if (!m) return "#94a3b8";
      const n = parseFloat(m[1]);
      if (n === 17.5) return RIM_COLORS["R17.5 (TBR)"];
      if (n === 19.5) return RIM_COLORS["R19.5 (TBR)"];
      if (n === 22.5) return RIM_COLORS["R22.5 (TBR)"];
      if (n >= 22)    return RIM_COLORS["R22+"];
      return RIM_COLORS["R" + Math.floor(n)] || "#94a3b8";
    }

    // Popup chart config — takes the /api/fleet_by_size response shape
    // (size_order + series with values/hk_sold/penetration parallel to
    // it) and renders three-axis bars/line just like the old rim
    // version, but with individual sizes as x-axis labels.
    function buildPopupConfig(data, postcode){
      const sizeOrder = (data.size_order||[]);
      const s = (data.series||[])[0] || {values:[], hk_sold:[], penetration:[]};

      // Same yHK cap logic as the rim version — small HK volumes stay
      // visible as real bars instead of sub-pixel lines.
      let fleetMax = 0, hkMax = 0;
      for (const v of (s.values || []))  if (v > fleetMax) fleetMax = v;
      for (const v of (s.hk_sold || [])) if (v > hkMax)    hkMax    = v;
      const yMax   = fleetMax > 0 ? Math.ceil(fleetMax * 1.20) : undefined;
      const yHKMax = hkMax    > 0 ? Math.max(Math.ceil(hkMax * 3), 10) : 10;

      const datasets = [{
        type: "bar",
        label: "Fleet",
        data:  s.values || [],
        backgroundColor: sizeOrder.map(_sizeColor),
        borderWidth: 0,
        yAxisID: "y",
        order: 2,
      }];
      if ((s.hk_sold || []).length) {
        datasets.push({
          type: "bar",
          label: "HK sold",
          data:  s.hk_sold || [],
          backgroundColor: "#e11d48",
          borderWidth: 0,
          yAxisID: "yHK",
          order: 2,
        });
        datasets.push({
          type: "line",
          label: "Penetration %",
          data:  (s.penetration || []).map(p => (p == null) ? null : p),
          borderColor: "#0f766e",
          backgroundColor: "#0f766e",
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.25,
          yAxisID: "yPct",
          order: 1,
          spanGaps: true,
        });
      }
      const hasHK = datasets.length > 1;
      return {
        type: "bar",
        data: {labels: sizeOrder, datasets},
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { top: 18 } },
          plugins: {
            legend: { display: hasHK, position: "top",
                      labels: { boxWidth: 10, font: { size: 10 } } },
            tooltip: { callbacks: {
              label: c => {
                const v = c.parsed.y;
                if (c.dataset.yAxisID === "yPct")
                  return `${c.dataset.label}: ${v == null ? "—" : v.toFixed(1) + " %"}`;
                return `${c.dataset.label}: ${fmt(v)}`;
              }
            }},
            datalabels: {
              anchor: "end", align: "top", offset: 1,
              font: { size: 9, weight: "600" },
              color: (ctx) => ctx.dataset.yAxisID === "yPct" ? "#0f766e"
                          : ctx.dataset.yAxisID === "yHK"  ? "#e11d48" : "#333",
              formatter: (v, ctx) => {
                if (v == null || v === 0) return "";
                if (ctx.dataset.yAxisID === "yPct") return v.toFixed(0) + "%";
                return fmt(v);
              },
              clip: false,
            },
          },
          // Tooltip on hover shows ALL datasets at the hovered x
          // column, not just the element under the cursor — so a
          // 1-pixel HK bar or a line point directly on top of a bar
          // both still surface their values.
          interaction: { mode: "index", intersect: false },
          // Click anywhere in a column → drill down into
          // (size × pattern × sold-to) for that rim family.
          // interaction.mode='index' returns EVERY dataset at that x,
          // so elements[0] would usually be the Fleet bar and the old
          // "elements[0] must be HK" check silently no-op'd.  Search
          // the array for the HK entry instead so a click anywhere in
          // the R17 column triggers the R17 breakdown.
          onClick: (evt, elements, chart) => {
            if (!elements.length) return;
            const hk = elements.find(el =>
              chart.data.datasets[el.datasetIndex].label === "HK sold");
            if (!hk) return;
            // Label is the full tyre size (e.g. "215/60R16"); drill
            // handler pulls the rim out and filters HK sales to it.
            const size = chart.data.labels[hk.index];
            if (typeof window._fleetPopupHKDrill === "function")
              window._fleetPopupHKDrill(size);
          },
          // Show a pointer cursor whenever the mouse is over a bar /
          // line point so it's obvious the chart is clickable.  Fall
          // back to default cursor in the empty parts of the plot.
          onHover: (evt, elements) => {
            const target = evt && evt.native && evt.native.target;
            if (target) target.style.cursor = elements.length ? "pointer" : "default";
          },
          scales: {
            // Auto-rotate labels — full tyre sizes (215/60R16) are
            // wider than rim families (R16), so at 30+ columns
            // horizontal labels overlap.  Rotation kicks in
            // automatically past a threshold; maxRotation cap keeps
            // them readable rather than fully vertical.
            x: { ticks: { font: { size: 9 },
                          autoSkip: false,
                          maxRotation: 60, minRotation: 45 } },
            y: { beginAtZero: true, max: yMax,
                 ticks: { callback: v => fmt(v), color: "#334155", font: { size: 9 } } },
            // HK axis — capped small (see yHKMax calc) so 1-2 unit
            // sales still show up as a real bar instead of a sub-
            // pixel line at the baseline.
            yHK: hasHK ? {
              position: "right", beginAtZero: true, max: yHKMax,
              ticks: { callback: v => fmt(v), color: "#e11d48", font: { size: 9 } },
              grid: { drawOnChartArea: false },
            } : undefined,
            // Penetration axis anchored at 50 % — realistic Hankook
            // share never approaches that, so the line uses the
            // upper half of the chart.  suggestedMax (not max) lets
            // the axis grow past 50 % on the rare postcode where
            // penetration actually overshoots.
            yPct: hasHK ? {
              position: "right", beginAtZero: true, suggestedMax: 50,
              ticks: { callback: v => v + "%", color: "#0f766e", font: { size: 9 } },
              grid: { drawOnChartArea: false },
            } : undefined,
          },
        },
        plugins: [ChartDataLabels],
      };
    }

    async function _unused_refresh(){
      // Mode selector was removed — chart always renders the single
      // fleet + HK + penetration overlay for the current region /
      // postcode.  The stacked breakdown lives on /fleet if needed.
      const region = currentRegion();
      const mode   = "single";
      const qs = new URLSearchParams();
      if (selectedPostcode) {
        qs.set("postcode", selectedPostcode);
      } else if (region !== "ALL") {
        // ?region=NSW expands to states {NSW, ACT} on the server so
        // the fleet chart follows the same NSW-includes-ACT grouping
        // the rest of the app already uses.  VIC picks up TAS/NT/SA.
        qs.set("region", region);
      }
      const scope = document.getElementById("fleetRimScope");
      if (selectedPostcode) {
        scope.innerHTML = `<b>Postcode ${selectedPostcode}</b> — click another boundary to change, or Clear postcode to reset.`;
        document.getElementById("fleetClearPc").style.display = "";
      } else {
        scope.textContent = "(BITRE Motor Vehicle Census)";
        document.getElementById("fleetClearPc").style.display = "none";
      }
      let data;
      try {
        const r = await fetch("/api/fleet_by_rim?" + qs, {credentials:"same-origin"});
        data = await r.json();
      } catch(e){
        document.getElementById("fleetRimWarn").style.display = "";
        document.getElementById("fleetRimWarn").textContent = "load failed: " + e;
        return;
      }
      const warn = document.getElementById("fleetRimWarn");
      if (data.warning){ warn.style.display=""; warn.textContent = data.warning; }
      else if (selectedPostcode && data.matched_rows === 0) {
        warn.style.display = "";
        const samples = (data.sample_postcodes || []).join(", ") || "(none)";
        warn.innerHTML =
          `<b>No BITRE fleet data for postcode "${selectedPostcode}".</b> ` +
          `The CSV probably stores this postcode differently — sample values ` +
          `it does have: <code>${samples}</code>. ` +
          `Check that vehicle_postcode_make_model.csv actually covers this ` +
          `postcode and that leading zeros weren't stripped.`;
      }
      else              { warn.style.display="none"; }

      // Hide MOTORCYCLE / UNKNOWN buckets from the chart — they're
      // not tyre fitments, keeping them muddies the visual.
      const rimOrder = (data.rim_order||[]).filter(f =>
        f !== "MOTORCYCLE" && f !== "UNKNOWN");
      const idxOf = f => (data.rim_order||[]).indexOf(f);

      let datasets = [];
      let hasPenetration = false;
      if (mode === "breakdown"){
        for (const s of (data.series||[])){
          datasets.push({
            label: s.state,
            data:  rimOrder.map(f => s.values[idxOf(f)] || 0),
            backgroundColor: STATE_COLORS[s.state] || "#94a3b8",
            borderWidth: 0,
          });
        }
      } else {
        const s = (data.series||[])[0] || {values:[], hk_sold:[], penetration:[]};
        const fleetLabel = region === "ALL" ? "Australia · Fleet" :
                           (s.state || region) + " · Fleet";
        datasets.push({
          type: "bar",
          label: fleetLabel,
          data:  rimOrder.map(f => s.values[idxOf(f)] || 0),
          backgroundColor: rimOrder.map(f => RIM_COLORS[f] || "#94a3b8"),
          borderWidth: 0,
          yAxisID: "y",
          order: 2,   // draw bars beneath the line
        });
        // HK sold — its own right-hand y-axis (yHK) so the bars are
        // visible even when Hankook's share is 1-5 % of the fleet.
        // Sharing the fleet axis (y) would collapse them into a
        // one-pixel line at the baseline.
        if (Array.isArray(s.hk_sold) && s.hk_sold.length){
          hasPenetration = true;
          datasets.push({
            type: "bar",
            label: "HK sold",
            data:  rimOrder.map(f => s.hk_sold[idxOf(f)] || 0),
            backgroundColor: "#e11d48",
            borderWidth: 0,
            yAxisID: "yHK",
            order: 2,
          });
          datasets.push({
            type: "line",
            label: "Penetration %",
            data:  rimOrder.map(f => {
              const p = s.penetration ? s.penetration[idxOf(f)] : null;
              return (p == null) ? null : p;
            }),
            borderColor: "#0f766e",
            backgroundColor: "#0f766e",
            borderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0.25,
            yAxisID: "yPct",
            order: 1,   // line above the bars
            spanGaps: true,
          });
        }
      }
      if (chart) chart.destroy();
      const ctx = document.getElementById("fleetRimChart");
      // Per-axis max — fleet axis (left) and HK axis (right) are on
      // wildly different scales, so we can't just take one overall
      // max.  Compute each independently, ignore the penetration-%
      // line entirely (it lives on its own axis).
      let fleetMax = 0, hkMax = 0;
      if (mode === "breakdown") {
        // Stacked bars all live on the fleet axis in breakdown mode.
        for (let i = 0; i < rimOrder.length; i++) {
          let s = 0;
          for (const ds of datasets) if (ds.yAxisID === "y" || !ds.yAxisID) s += (ds.data[i] || 0);
          if (s > fleetMax) fleetMax = s;
        }
      } else {
        for (const ds of datasets){
          if (ds.yAxisID === "yPct") continue;
          for (const v of ds.data){
            if (v == null) continue;
            if (ds.yAxisID === "yHK") { if (v > hkMax) hkMax = v; }
            else                       { if (v > fleetMax) fleetMax = v; }
          }
        }
      }
      const yMax   = fleetMax > 0 ? Math.ceil(fleetMax * 1.18) : undefined;
      const yHKMax = hkMax    > 0 ? Math.ceil(hkMax    * 1.25) : undefined;
      chart = new Chart(ctx, {
        type: "bar",
        data: {labels: rimOrder, datasets},
        options: {
          responsive:true, maintainAspectRatio:false,
          layout: { padding: { top: 22 } },
          plugins: {
            // Show legend whenever we have >1 dataset — breakdown mode
            // AND the combined fleet/HK/penetration overlay both.
            legend: { display: datasets.length > 1, position: "top",
                      labels: { boxWidth: 12, font: { size: 11 } } },
            tooltip: { callbacks: {
              label: c => {
                const v = c.parsed.y;
                if (c.dataset.yAxisID === "yPct")
                  return `${c.dataset.label}: ${v == null ? "—" : v.toFixed(1) + " %"}`;
                return `${c.dataset.label}: ${fmt(v)}`;
              }
            }},
            datalabels: {
              anchor: "end", align: "top", offset: 2,
              font: { size: 10, weight: "600" },
              color: (ctx) => {
                if (ctx.dataset.yAxisID === "yPct") return "#0f766e";
                if (ctx.dataset.yAxisID === "yHK")  return "#e11d48";
                return "#333";
              },
              formatter: (v, ctx) => {
                if (v == null || v === 0) return "";
                if (ctx.dataset.yAxisID === "yPct") return v.toFixed(1) + "%";
                return fmt(v);
              },
              display: mode !== "breakdown",
              clip: false,
            },
          },
          scales: {
            x: { stacked: mode === "breakdown" },
            // Fleet axis — LEFT.  Colour-per-rim bars live here.
            y: {
              stacked: mode === "breakdown",
              position: "left",
              beginAtZero: true,
              max: yMax,
              ticks: { callback: v => fmt(v), color: "#334155" },
              title: { display: hasPenetration, text: "Fleet units",
                       font: { size: 11 }, color: "#334155" },
            },
            // HK sold axis — RIGHT.  Own scale so the small red bars
            // (typically 1-5 % of fleet volume) are actually visible.
            yHK: hasPenetration ? {
              position: "right",
              beginAtZero: true,
              max: yHKMax,
              ticks: { callback: v => fmt(v), color: "#e11d48" },
              grid: { drawOnChartArea: false },
              title: { display: true, text: "HK sold",
                       font: { size: 11 }, color: "#e11d48" },
            } : undefined,
            // Penetration % axis — RIGHT (further out).  0-100 by
            // default; overshoots (postcode > 100 % from short-life
            // replacement patterns) get room via suggestedMax.
            yPct: hasPenetration ? {
              position: "right",
              beginAtZero: true,
              suggestedMax: 100,
              ticks: { callback: v => v + " %", color: "#0f766e" },
              grid: { drawOnChartArea: false },
              title: { display: true, text: "Penetration %",
                       font: { size: 11 }, color: "#0f766e" },
            } : undefined,
          },
        },
        plugins: [ChartDataLabels],
      });
    }

    // Region-strip / panel controls used to live here — now that the
    // chart lives inside a Leaflet popup keyed to the clicked postcode,
    // there's no persistent panel to refresh on state change and no
    // Hide / Clear buttons to wire up.

    // Boundary layer — fetches /static/postcode_boundaries.geojson,
    // renders as a light-grey polygon layer over the base map, and
    // wires each polygon's click to refresh the bar chart scoped to
    // that postcode.  Only loaded on first click (~5-30 MB file).
    // Boundary loader — driven by the #mapBoundaryBtn button floated
    // over the top-right of the map.  Kept as a plain HTML element
    // (not a Leaflet L.control) so it renders regardless of whether
    // salesMap has finished initialising when this script runs.
    async function togglePostcodeBoundaries(){
      const map = (typeof salesMap !== "undefined") ? salesMap : window.salesMap;
      if (!map) { alert("Map not ready yet — try again in a moment."); return; }
      const btn = document.getElementById("mapBoundaryBtn");
      if (postcodeLayer) {
        map.removeLayer(postcodeLayer);
        postcodeLayer = null;
        if (btn) btn.textContent = "Show postcode boundaries";
        return;
      }
      if (btn) { btn.textContent = "Loading boundaries…"; btn.style.opacity = "0.6"; }
      try {
        const r = await fetch("/static/postcode_boundaries.geojson", {credentials:"same-origin"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const gj = await r.json();
        const baseStyle = {color:"#333", weight:0.5, fillOpacity:0.02, fillColor:"#3388ff"};
        const selStyle  = {color:"#c62828", weight:2.5, fillOpacity:0.25, fillColor:"#ff6b6b"};
        postcodeLayer = L.geoJSON(gj, {
          style: baseStyle,
          onEachFeature: (feature, layer) => {
            const p = feature.properties || {};
            const pc = String(
              p.POA_CODE21 || p.POA_CODE || p.postcode ||
              p.POA_NAME21 || p.code || ""
            ).trim();
            layer.on({
              click: async (ev) => {
                if (!pc) return;
                if (postcodeLayer._selectedLayer && postcodeLayer._selectedLayer !== layer)
                  postcodeLayer.resetStyle(postcodeLayer._selectedLayer);
                layer.setStyle(selStyle);
                postcodeLayer._selectedLayer = layer;
                await openFleetPopup(layer, pc, ev.latlng);
              },
              mouseover: e => {
                if (layer !== postcodeLayer._selectedLayer)
                  e.target.setStyle({fillOpacity:0.2, weight:1.5});
              },
              mouseout:  e => {
                if (layer !== postcodeLayer._selectedLayer)
                  postcodeLayer.resetStyle(e.target);
              },
            });
            if (pc) layer.bindTooltip(pc, {sticky:true, direction:"top"});
          },
        });
        postcodeLayer.addTo(map);
        if (btn) btn.textContent = "Hide postcode boundaries";
      } catch(e){
        const warn = document.getElementById("fleetRimWarn");
        warn.style.display = "";
        warn.innerHTML =
          `Couldn't load postcode boundaries (${e}). ` +
          `Place an Australian postcode GeoJSON at ` +
          `<code>static/postcode_boundaries.geojson</code>. `;
        if (btn) btn.textContent = "Show postcode boundaries";
      } finally {
        if (btn) btn.style.opacity = "1";
      }
    }

    document.getElementById("mapBoundaryBtn")
            .addEventListener("click", togglePostcodeBoundaries);

    // Open a compact fleet-by-rim popup for the clicked postcode.
    // Renders a small Chart.js bar chart inside a Leaflet popup that's
    // bound to the clicked polygon.  Chart.js may still be loading —
    // poll briefly before drawing.
    async function openFleetPopup(layer, pc, latlng){
      const container = document.createElement("div");
      // Wider popup so the top-20 chart has ~30 px per bar without
      // scroll, and the stat-card row can breathe.
      container.style.width = "640px";
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;
                    margin-bottom:6px;">
          <div style="font-weight:700;font-size:14px;color:#0f172a;">
            Postcode <span style="color:#2563eb;">${pc}</span>
          </div>
          <div id="_fpMsgEmpty" style="font-size:11px;color:#94a3b8;">
            Loading fleet mix…
          </div>
        </div>
        <!-- Four stat cards up top so the numbers are scannable at a
             glance without reading a comma-separated run of text.  Each
             card colour-coded to match its meaning:
               Fleet         — slate (neutral vehicles)
               Tyre demand   — indigo (derived / opportunity)
               HK sold       — rose  (actual Hankook volume)
               No-size fleet — amber (data-quality gap)     -->
        <div id="_fpStats" style="display:none;grid-template-columns:repeat(4, 1fr);
                    gap:6px;margin-bottom:8px;">
          <div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:6px 8px;">
            <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Fleet</div>
            <div style="font-size:16px;color:#0f172a;font-weight:700;font-variant-numeric:tabular-nums;"
                 id="_fpStatFleet">—</div>
            <div style="font-size:10px;color:#94a3b8;">vehicles</div>
          </div>
          <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:5px;padding:6px 8px;">
            <div style="font-size:10px;color:#4338ca;font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Tyre demand</div>
            <div style="font-size:16px;color:#3730a3;font-weight:700;font-variant-numeric:tabular-nums;"
                 id="_fpStatTyre">—</div>
            <div style="font-size:10px;color:#818cf8;">per year</div>
          </div>
          <div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:5px;padding:6px 8px;">
            <div style="font-size:10px;color:#be123c;font-weight:600;text-transform:uppercase;letter-spacing:.4px;">HK sold</div>
            <div style="font-size:16px;color:#9f1239;font-weight:700;font-variant-numeric:tabular-nums;"
                 id="_fpStatHK">—</div>
            <div style="font-size:10px;color:#fb7185;">
              <span id="_fpStatPen">—</span> penetration
            </div>
          </div>
          <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:5px;padding:6px 8px;">
            <div style="font-size:10px;color:#92400e;font-weight:600;text-transform:uppercase;letter-spacing:.4px;">No-size fleet</div>
            <div style="font-size:16px;color:#78350f;font-weight:700;font-variant-numeric:tabular-nums;"
                 id="_fpStatGap">—</div>
            <div style="font-size:10px;color:#d97706;">legacy / unknown</div>
          </div>
        </div>
        <!-- Top vehicles strip — shows the 5 most common (make, model)
             pairs in this postcode.  Fills once /api/postcode_top_models
             returns; hidden until then. -->
        <div id="_fpTopModels" style="display:none;background:#f8fafc;
                    border:1px solid #e2e8f0;border-radius:5px;
                    padding:6px 10px;margin-bottom:8px;font-size:11.5px;">
          <div style="font-weight:600;color:#475569;font-size:10px;
                      text-transform:uppercase;letter-spacing:.4px;
                      margin-bottom:2px;">Top vehicles</div>
          <div id="_fpTopModelsList" style="color:#334155;line-height:1.5;"></div>
        </div>
        <div id="_fpToggleBar"
             style="display:flex;justify-content:space-between;align-items:center;
                    font-size:11px;color:#64748b;margin-bottom:4px;">
          <span id="_fpScope"></span>
          <button id="_fpToggle" type="button"
                  style="border:1px solid #cbd5e1;background:#f8fafc;
                         padding:3px 10px;border-radius:4px;font-size:11px;
                         color:#334155;font-weight:600;cursor:pointer;">
            Show all
          </button>
        </div>
        <div style="position:relative;height:270px;overflow-x:auto;overflow-y:hidden;
                    border:1px solid #e2e8f0;border-radius:5px;background:#fafbfc;">
          <div id="_fpCanvasBox" style="position:relative;height:100%;min-width:100%;">
            <canvas></canvas>
          </div>
        </div>
        <!-- Small rim-family colour legend under the chart so the eye
             can decode why bars change colour along the x-axis.  Only
             renders the rim families present in the visible slice. -->
        <div id="_fpLegend"
             style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;
                    font-size:10px;color:#64748b;"></div>
        <div id="_fpDrillHint" style="font-size:11px;color:#94a3b8;margin-top:6px;">
          Click a red <b style="color:#e11d48;">HK bar</b> for its pattern / sold-to breakdown.
        </div>
        <div id="_fpDrill" style="margin-top:6px;"></div>`;
      layer.unbindPopup();
      layer.bindPopup(container, {
        maxWidth: 720, minWidth: 640, className: "fleet-popup",
      }).openPopup(latlng);

      let data;
      try {
        const r = await fetch("/api/fleet_by_size?postcode=" + encodeURIComponent(pc),
                              {credentials: "same-origin"});
        data = await r.json();
      } catch(e){
        container.querySelector("#_fpMsgEmpty").textContent = "Load failed: " + e;
        return;
      }
      if (!data.total_units && !data.hk_total) {
        container.querySelector("#_fpMsgEmpty").innerHTML =
          `<b style="color:#dc2626;">No fleet-by-size data.</b> ` +
          `Verify postcode_size_demand.csv covers this postcode.`;
        return;
      }
      // Populate stat cards + reveal the row.  All four cards share
      // the same fetch — no additional round-trip.
      const unpred = data.unpredicted_units || 0;
      const fleetN = data.total_units || 0;
      const hkN    = data.hk_total    || 0;
      const tyreN  = fleetN;      // 1 tyre-unit / vehicle / year model
      const penPct = fleetN > 0 ? (hkN / fleetN * 100) : 0;
      container.querySelector("#_fpStatFleet").textContent = fmt(fleetN);
      container.querySelector("#_fpStatTyre").textContent  = fmt(tyreN);
      container.querySelector("#_fpStatHK").textContent    = fmt(hkN);
      container.querySelector("#_fpStatPen").textContent   = penPct.toFixed(2) + "%";
      container.querySelector("#_fpStatGap").textContent   = fmt(unpred);
      container.querySelector("#_fpStats").style.display   = "grid";
      container.querySelector("#_fpMsgEmpty").style.display = "none";

      // Fetch top-5 (make, model) for this postcode in parallel with
      // the chart render.  Failure is non-fatal — chart still renders.
      (async () => {
        try {
          const r = await fetch("/api/postcode_top_models?postcode="
                                + encodeURIComponent(pc) + "&limit=5",
                                {credentials: "same-origin"});
          const j = await r.json();
          const rows = (j.rows || []);
          if (!rows.length) return;
          const listEl = container.querySelector("#_fpTopModelsList");
          listEl.innerHTML = rows.map(m => `
            <span style="display:inline-block;margin-right:12px;
                         padding:2px 8px;background:#fff;border:1px solid #e2e8f0;
                         border-radius:12px;">
              <b>${_escape(m.make)} ${_escape(m.model)}</b>
              <span style="color:#94a3b8;margin-left:4px;">${fmt(m.fleet)}</span>
            </span>`).join("");
          container.querySelector("#_fpTopModels").style.display = "block";
        } catch(_e) { /* silent — top-models is a nice-to-have */ }
      })();

      // View-mode state.  Default: top-20 sizes by fleet.  Toggle
      // button flips to the full tail (30-50 sizes, scrollable).
      const fullSizeOrder = (data.size_order || []);
      const TOP_N = 20;
      let showAll = false;

      const scopeEl  = container.querySelector("#_fpScope");
      const toggleEl = container.querySelector("#_fpToggle");
      // Hide toggle entirely when the postcode has ≤ TOP_N sizes —
      // no benefit to a "show all" button that changes nothing.
      if (fullSizeOrder.length <= TOP_N) {
        toggleEl.style.display = "none";
      }
      const box = container.querySelector("#_fpCanvasBox");
      let chart = null;

      function renderChart() {
        const n = showAll ? fullSizeOrder.length
                          : Math.min(TOP_N, fullSizeOrder.length);
        const s = (data.series || [])[0] || {};
        const scoped = {
          size_order: fullSizeOrder.slice(0, n),
          series: [{
            state:       s.state,
            values:      (s.values      || []).slice(0, n),
            hk_sold:     (s.hk_sold     || []).slice(0, n),
            penetration: (s.penetration || []).slice(0, n),
          }],
        };
        const per = 30;
        box.style.width = Math.max(n * per, 620) + "px";
        scopeEl.textContent = showAll
          ? `Showing all ${fullSizeOrder.length} sizes`
          : `Showing top ${n} of ${fullSizeOrder.length} sizes`;
        toggleEl.textContent = showAll ? "Show top 20" : `Show all (${fullSizeOrder.length})`;
        // Rim-family colour legend — only render the families actually
        // present in the visible slice so users don't see irrelevant
        // R21 / R22.5 chips when the postcode is all R14-R17 cars.
        const rimsInView = new Set();
        for (const sz of scoped.size_order) {
          const m = /R\s*(\d{2}(?:\.\d)?)/i.exec(sz);
          if (!m) continue;
          const n2 = parseFloat(m[1]);
          if (n2 === 17.5)      rimsInView.add("R17.5 (TBR)");
          else if (n2 === 19.5) rimsInView.add("R19.5 (TBR)");
          else if (n2 === 22.5) rimsInView.add("R22.5 (TBR)");
          else if (n2 >= 22)    rimsInView.add("R22+");
          else                  rimsInView.add("R" + Math.floor(n2));
        }
        // Preserve canonical rim order (R14 → R22+, then TBR at end).
        const RIM_CANONICAL = ["R13","R14","R15","R16","R17","R18","R19","R20",
                               "R21","R22+","R17.5 (TBR)","R19.5 (TBR)","R22.5 (TBR)"];
        const legendEl = container.querySelector("#_fpLegend");
        legendEl.innerHTML = RIM_CANONICAL
          .filter(r => rimsInView.has(r))
          .map(r => `<span style="display:inline-flex;align-items:center;gap:3px;">
                       <span style="display:inline-block;width:10px;height:10px;
                                    background:${RIM_COLORS[r]||"#94a3b8"};
                                    border-radius:2px;"></span>${r}
                     </span>`).join("");
        if (chart) { try { chart.destroy(); } catch(_e){} chart = null; }
        const canvas = container.querySelector("canvas");
        if (typeof Chart === "undefined") {
          setTimeout(renderChart, 80);
          return;
        }
        chart = new Chart(canvas, buildPopupConfig(scoped, pc));
      }

      toggleEl.addEventListener("click", () => {
        showAll = !showAll;
        renderChart();
      });

      // Wire the drill-down handler that the chart's onClick calls.
      // Kept on `window._fleetPopupHKDrill` so a click inside Chart.js's
      // canvas can reach back into this popup's DOM without needing
      // access to the outer closure's variables.
      // Drill-down key is now the full SIZE (e.g. "215/60R16") not the
      // rim family.  We derive the rim from the size and reuse the
      // existing /api/fleet_by_rim/hk_detail endpoint (which returns
      // every size · pattern · sold-to combo within the rim family) —
      // then filter client-side to the exact size the user clicked.
      // Cheaper than a size-specific server endpoint for a first cut,
      // and the rim endpoint already exists.
      window._fleetPopupHKDrill = async (size) => {
        const drillDiv = container.querySelector("#_fpDrill");
        const hint     = container.querySelector("#_fpDrillHint");
        if (hint) hint.style.display = "none";
        drillDiv.innerHTML = `<div style="font-size:11.5px;color:#666;">
          Loading <b>${size}</b> HK sales…</div>`;
        // Extract the rim family the size belongs to — same regex the
        // Python side uses for its bucketing.  "215/60R16" → "R16",
        // "11R22.5" → "R22+" (roughly), etc.  Half-inch TBR keeps its
        // own bucket per the backend's rim_order.
        const rimM = /R\s*(\d{2}(?:\.\d)?)/i.exec(size);
        if (!rimM) return;
        const inches = parseFloat(rimM[1]);
        let rim;
        if (inches === 17.5)      rim = "R17.5 (TBR)";
        else if (inches === 19.5) rim = "R19.5 (TBR)";
        else if (inches === 22.5) rim = "R22.5 (TBR)";
        else if (inches >= 22)    rim = "R22+";
        else                      rim = "R" + Math.floor(inches);
        let detail;
        try {
          const r = await fetch("/api/fleet_by_rim/hk_detail?postcode="
                                + encodeURIComponent(pc)
                                + "&rim=" + encodeURIComponent(rim),
                                {credentials: "same-origin"});
          detail = await r.json();
        } catch(e){
          drillDiv.textContent = "Load failed: " + e;
          return;
        }
        // Filter to exactly the clicked size (rim endpoint returns
        // every size in the rim family; we want the one column).
        const rowsRaw = (detail.rows || []);
        const rows = rowsRaw.filter(r => (r.size || "").startsWith(size));
        if (!rows.length){
          drillDiv.innerHTML =
            `<div style="font-size:11.5px;color:#666;">
               No HK sales in ${size} for this postcode in 2026.
             </div>`;
          return;
        }
        // Table, ranked by qty descending.  Cap at ~20 rows for
        // readability; a small footer notes how many more exist if any.
        const capped = rows.slice(0, 20);
        const rest   = rows.length - capped.length;
        const rowHtml = capped.map(r => `
          <tr>
            <td style="padding:2px 6px;">${_escape(r.size)}</td>
            <td style="padding:2px 6px;">${_escape(r.pattern)}</td>
            <td style="padding:2px 6px;">${_escape(r.sold_to_name || r.sold_to)}</td>
            <td style="padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums;">
              ${fmt(r.qty)}
            </td>
          </tr>`).join("");
        const totalFiltered = rows.reduce((a, r) => a + (r.qty || 0), 0);
        drillDiv.innerHTML = `
          <div style="font-size:12px;font-weight:600;margin-bottom:2px;">
            ${size} HK sales · Total ${fmt(totalFiltered)}
          </div>
          <div style="max-height:220px;overflow:auto;border:1px solid #e5e7eb;border-radius:4px;">
            <table style="width:100%;border-collapse:collapse;font-size:11.5px;">
              <thead>
                <tr style="background:#f1f5f9;position:sticky;top:0;">
                  <th style="padding:4px 6px;text-align:left;">Size</th>
                  <th style="padding:4px 6px;text-align:left;">Pattern</th>
                  <th style="padding:4px 6px;text-align:left;">Sold-to</th>
                  <th style="padding:4px 6px;text-align:right;">Qty</th>
                </tr>
              </thead>
              <tbody>${rowHtml}</tbody>
            </table>
          </div>
          ${rest > 0 ? `<div style="font-size:11px;color:#94a3b8;margin-top:3px;">
                          + ${rest} more rows (cap 20)
                        </div>` : ""}`;
      };

      renderChart();
    }
    // Tiny HTML escaper for the drill-down table cells.
    function _escape(s){
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ── Fleet-overview panel (national / by-state, above the map) ──
    // Refreshes on region-button clicks so the reader sees the tyre
    // demand shape without needing to open a postcode-specific popup.
    let _foChart = null;
    async function refreshFleetOverview() {
      const region = (window.filters && filters.region) || "ALL";
      const scopeEl  = document.getElementById("foScope");
      const statusEl = document.getElementById("foStatus");
      if (!scopeEl) return;
      scopeEl.textContent = (region === "ALL") ? "National" : region;
      statusEl.textContent = "Loading…";
      const qs = new URLSearchParams();
      if (region !== "ALL") qs.set("region", region);
      qs.set("limit", 15);   // top-15 sizes for the overview strip
      let data, models;
      try {
        [data, models] = await Promise.all([
          fetch("/api/fleet_by_size?" + qs, {credentials:"same-origin"}).then(r => r.json()),
          fetch("/api/postcode_top_models?limit=5"
                + (region !== "ALL" ? "&state=" + encodeURIComponent(region) : ""),
                {credentials:"same-origin"}).then(r => r.json()),
        ]);
      } catch(_e) {
        statusEl.textContent = "load failed";
        return;
      }
      statusEl.textContent = "";
      const fleetN = data.total_units || 0;
      const hkN    = data.hk_total    || 0;
      document.getElementById("foFleet").textContent = fmt(fleetN);
      document.getElementById("foTyre").textContent  = fmt(fleetN);   // 1 tyre / yr / vehicle
      document.getElementById("foHK").textContent    = fmt(hkN);
      document.getElementById("foPen").textContent   =
        fleetN > 0 ? (hkN / fleetN * 100).toFixed(2) + "%" : "—";
      document.getElementById("foStats").style.display = "grid";
      // Top vehicles chips
      const rows = (models && models.rows) || [];
      if (rows.length) {
        document.getElementById("foTopModelsList").innerHTML =
          rows.map(m => `<span style="display:inline-block;margin-right:10px;
                                     padding:2px 8px;background:#f8fafc;
                                     border:1px solid #e2e8f0;border-radius:12px;">
                          <b>${_escape(m.make)} ${_escape(m.model)}</b>
                          <span style="color:#94a3b8;margin-left:4px;">${fmt(m.fleet)}</span>
                         </span>`).join("");
        document.getElementById("foTopModels").style.display = "block";
      } else {
        document.getElementById("foTopModels").style.display = "none";
      }
      // Chart — reuse buildPopupConfig but scoped to the overview data.
      const canvas = document.getElementById("foChart");
      if (!canvas) return;
      if (_foChart) { try { _foChart.destroy(); } catch(_e){} _foChart = null; }
      if (typeof Chart === "undefined") { setTimeout(refreshFleetOverview, 200); return; }
      _foChart = new Chart(canvas, buildPopupConfig(data, region));
    }

    // Wire refresh into region-button clicks — those buttons already
    // live in #regionBtns and app.js flips filters.region on click.
    // We piggyback on a global click listener with a small debounce so
    // the overview updates once per selection instead of thrashing.
    let _foDebounce = 0;
    document.getElementById("regionBtns")?.addEventListener("click", () => {
      clearTimeout(_foDebounce);
      _foDebounce = setTimeout(refreshFleetOverview, 250);
    });
    // Initial render after Chart.js has loaded.
    setTimeout(refreshFleetOverview, 400);
  })();
  </script>

  <script>
    function _vlEsc(s){
      return String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    // People directory (BDE / SM / Hayden / JJ) — preloaded once per
    // session for the FROM picker in the feedback composer.
    let _vlPeople = null;
    async function _vlEnsurePeople(){
      if (_vlPeople) return _vlPeople;
      try {
        const r = await fetch("/api/people", { credentials:"include" });
        _vlPeople = await r.json();
      } catch { _vlPeople = []; }
      return _vlPeople;
    }
    function _vlPeopleOptions(){
      return (_vlPeople || []).map(p =>
        `<option value="${_vlEsc(p.name)}">${_vlEsc(p.name)}</option>`
      ).join("");
    }

    function _vlRenderFeedback(rid, thread){
      const items = (thread || []).map(t => `
        <div style="margin-bottom:8px;">
          <div style="font-size:10px;color:#92400e;text-transform:uppercase;
                      letter-spacing:.4px;margin-bottom:2px;">
            <b>${_vlEsc(t.author_name || t.author_email || "—")}</b>
            · ${_vlEsc(t.created_at || "")}
          </div>
          <div class="vl-fb-box" style="margin-top:0;">
            <div>${_vlEsc(t.text || "")}</div>
          </div>
        </div>`).join("");
      return items + `
        <a href="javascript:void(0)" class="vl-fb-add"
           onclick="_vlOpenComposer(${rid})">+ Add feedback</a>`;
    }
    async function _vlOpenComposer(rid){
      await _vlEnsurePeople();
      const el = document.getElementById("mapFb-" + rid);
      if (!el) return;
      // Strip the existing "+ Add feedback" link and append the composer.
      const above = el.innerHTML.replace(/<a [^>]*onclick="_vlOpenComposer[\s\S]*?<\/a>/, "");
      el.innerHTML = above + `
        <div style="margin-top:6px;padding:8px;background:#f9fafb;
                    border:1px solid #e5e7eb;border-radius:5px;">
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">
            <span style="font-size:10px;color:#6b7280;font-weight:600;">FROM</span>
            <select id="vlFbWho-${rid}" style="font-size:12px;padding:3px 6px;
                    border:1px solid #d1d5db;border-radius:4px;">
              <option value="">— select —</option>${_vlPeopleOptions()}
            </select>
          </div>
          <textarea id="vlFbInp-${rid}"
            placeholder="Your reply…"
            style="width:100%;min-height:54px;font-size:12px;padding:6px;
                   border:1px solid #d1d5db;border-radius:4px;font-family:inherit;"
          ></textarea>
          <div style="margin-top:5px;display:flex;gap:6px;">
            <button type="button" onclick="_vlSaveFb(${rid})"
              style="font-size:11px;padding:3px 12px;background:#2563eb;color:#fff;
                     border:none;border-radius:4px;cursor:pointer;">Post</button>
            <button type="button" onclick="_vlCancelComposer(${rid})"
              style="font-size:11px;padding:3px 10px;background:#fff;color:#374151;
                     border:1px solid #d1d5db;border-radius:4px;cursor:pointer;">Cancel</button>
          </div>
        </div>`;
    }
    function _vlCancelComposer(rid){
      const el = document.getElementById("mapFb-" + rid);
      const row = (window._vlLastRows || []).find(x => x.id === rid);
      if (el) el.innerHTML = _vlRenderFeedback(rid, row ? row.thread : []);
    }
    async function _vlSaveFb(rid){
      const who = document.getElementById("vlFbWho-" + rid);
      const inp = document.getElementById("vlFbInp-" + rid);
      if (!who || !inp) return;
      if (!who.value){ alert("Please pick who you are."); return; }
      if (!inp.value.trim()){ alert("Type a comment first."); return; }
      try {
        const r = await fetch("/api/meeting/feedback", {
          method:"POST", headers:{"Content-Type":"application/json"},
          credentials:"include",
          body: JSON.stringify({ id: rid, text: inp.value, author_name: who.value }),
        });
        const j = await r.json();
        if (!r.ok || j.error){ alert("Save failed: " + (j.error || r.status)); return; }
        // Update cached row's thread + re-render in place.
        const row = (window._vlLastRows || []).find(x => x.id === rid);
        if (row) row.thread = j.thread || [];
        const el = document.getElementById("mapFb-" + rid);
        if (el) el.innerHTML = _vlRenderFeedback(rid, row ? row.thread : []);
      } catch (err){ alert("Error: " + err.message); }
    }
    function closeVisitLogModal(){
      const el = document.getElementById("visitLogBackdrop");
      if (el) el.style.display = "none";
    }
    async function openVisitLogModal(shipTo, shipNm){
      const back = document.getElementById("visitLogBackdrop");
      const body = document.getElementById("visitLogBody");
      const title = document.getElementById("visitLogTitle");
      if (!back || !body) return;
      title.textContent = `Visit logs — ${shipTo}${shipNm ? " · " + shipNm : ""}`;
      body.innerHTML = '<div style="color:#9ca3af;font-size:12px;text-align:center;padding:18px;">Loading…</div>';
      back.style.display = "flex";
      try {
        const qs = new URLSearchParams({ ship_to: shipTo, limit: "50" }).toString();
        const r  = await fetch("/api/meeting/list?" + qs, {credentials:"include"});
        const rows = await r.json();
        if (!Array.isArray(rows) || !rows.length){
          body.innerHTML = '<div style="color:#9ca3af;font-size:12px;text-align:center;padding:18px;">No visit logs yet for this shop.</div>';
          return;
        }
        const html = rows.map(e => {
          const photos = (e.photo_paths || [])
            .map(p => `<a href="${_vlEsc(p)}" target="_blank">`
                    + `<img src="${_vlEsc(p)}" style="width:60px;height:60px;`
                    + `object-fit:cover;border-radius:4px;border:1px solid #e5e7eb;margin:0 4px 4px 0;">`
                    + `</a>`).join("");
          const purpRow = e.visit_purpose ? `
            <div class="vl-row vl-purpose">
              <span class="vl-lbl">Purpose</span>
              <span class="vl-val"><span style="display:inline-block;font-size:11px;font-weight:600;color:#1e3a5f;background:#e0e7ff;padding:2px 8px;border-radius:10px;">${_vlEsc(e.visit_purpose)}</span></span>
            </div>` : "";
          const metRow  = e.met_person ? `
            <div class="vl-row vl-met">
              <span class="vl-lbl">Met</span>
              <span class="vl-val">${_vlEsc(e.met_person)}</span>
            </div>` : "";
          const notesRow = e.notes ? `
            <div class="vl-row vl-notes">
              <span class="vl-lbl">Meeting notes</span>
              <div class="vl-val vl-notes-body">${_vlEsc(e.notes)}</div>
            </div>` : "";
          const nextRow = e.next_action ? `
            <div class="vl-row vl-next">
              <span class="vl-lbl">Next step</span>
              <span class="vl-val">→ ${_vlEsc(e.next_action)}</span>
            </div>` : "";
          const photosRow = photos ? `
            <div class="vl-row vl-photos">
              <span class="vl-lbl">Photos</span>
              <div class="vl-val">${photos}</div>
            </div>` : "";
          return `<div class="vl-card">
            <div class="vl-head">
              <span class="vl-bde">${_vlEsc(e.bde_name || "—")}</span>
              <span class="vl-date">${_vlEsc(e.visit_date || e.created_at)}</span>
            </div>
            ${purpRow}
            ${metRow}
            ${notesRow}
            ${nextRow}
            ${photosRow}
            <div id="mapFb-${e.id}" class="vl-fb-wrap">${_vlRenderFeedback(e.id, e.thread || [])}</div>
          </div>`;
        }).join("");
        body.innerHTML = html;
        // Stash payload so a Cancel inside the editor can restore the
        // original value without a full refetch.
        window._vlLastRows = rows;
      } catch (err){
        body.innerHTML = `<div style="color:#dc2626;font-size:12px;padding:18px;">Error: ${_vlEsc(err.message)}</div>`;
      }
    }
    // Click backdrop (outside dialog) to close
    document.getElementById("visitLogBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "visitLogBackdrop") closeVisitLogModal();
    });
    // Esc key to close
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeVisitLogModal();
    });
  </script>

  <!-- small map-specific layer that reuses app.js -->
  <script src="/static/map.js?v=20260520" defer></script>
</body>
