<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebate Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;font-size:13px}
header{background:#1e3a5f;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:16px;font-weight:700}
header .sub{font-size:11px;opacity:.65}
.filters{background:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-bottom:1px solid #e5e7eb}
.filters label{font-size:11px;color:#6b7280;margin-bottom:2px;display:block}
.filters select,.filters input{border:1px solid #d1d5db;border-radius:6px;padding:5px 8px;font-size:12px;min-width:120px}
.btn{border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;border:none}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-outline:hover{background:#f9fafb}
.container{padding:12px 16px}
.summary-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:8px;padding:10px 16px;border:1px solid #e5e7eb;min-width:145px}
.stat-card .label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:19px;font-weight:700;color:#1e3a5f;margin-top:2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
/* Sold-to header rows */
tr.grp-hdr td{background:#e8eef6;font-weight:700;color:#1e3a5f;font-size:12px;padding:6px 10px;border-bottom:1px solid #c7d2e3;cursor:pointer}
tr.grp-hdr:hover td{background:#dce6f5}
tr.grp-hdr td.caret{width:24px;text-align:center;font-size:12px}
/* Column headers */
th{background:#f8fafc;color:#374151;font-size:11px;font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#f1f5f9}
th .sa{margin-left:3px;opacity:.35}
th.sorted .sa{opacity:1}
/* Ship_to data rows */
td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
tr.ship-row:hover td{background:#fafafa}
tr.ship-row td:first-child{padding-left:28px}
/* Badges */
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.b-hk{background:#dbeafe;color:#1d4ed8}
.b-lf{background:#dcfce7;color:#16a34a}
.b-ttl{background:#ede9fe;color:#6d28d9}
.b-A{background:#fef3c7;color:#92400e}
.b-Q{background:#ede9fe;color:#5b21b6}
/* Progress */
.prog-wrap{width:72px;background:#e5e7eb;border-radius:4px;height:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:4px}
.prog-bar{height:6px;border-radius:4px}
/* Tier dots */
.tier-list{display:flex;gap:2px;flex-wrap:wrap}
.td{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid transparent}
.td.past{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.td.curr{background:#fef9c3;color:#713f12;border-color:#fbbf24}
.td.fut{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
/* Misc */
.needed{color:#dc2626;font-weight:600}
.no-next{color:#16a34a;font-weight:600}
.rc{color:#1d4ed8;font-weight:700}
.rn{color:#dc2626;font-size:11px}
.est{color:#7c3aed;font-weight:600}
.ul{font-size:9px;color:#6b7280}
.empty{text-align:center;padding:40px;color:#9ca3af}
#loading{padding:20px;text-align:center;color:#6b7280;display:none}
</style>
</head>
<body>
<header>
  <h1>Rebate Calculator</h1>
  <span class="sub">Ship-To 기준 개별 Tier 계산 &nbsp;|&nbsp; sales_thismonth 현재 누적 데이터</span>
</header>

<div class="filters">
  <div>
    <label>Territory</label>
    <select id="f_terr">
      <option value="ALL">All</option>
      <option value="TTL">TTL (HK+LF)</option>
      <option value="HK">HK – Hankook</option>
      <option value="LF">LF – Laufenn</option>
    </select>
  </div>
  <div>
    <label>Customer Group</label>
    <select id="f_stg"><option value="ALL">All Groups</option></select>
  </div>
  <div>
    <label>Search</label>
    <input type="text" id="f_search" placeholder="Name / code…" style="min-width:180px">
  </div>
  <div>
    <label>Show</label>
    <select id="f_show">
      <option value="ALL">All</option>
      <option value="NEXT">Has next tier</option>
      <option value="MAX">Max tier reached</option>
      <option value="ZERO">No sales</option>
    </select>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-primary" onclick="load()">Refresh</button>
    <button class="btn btn-outline" onclick="exportCSV()">Export CSV</button>
  </div>
</div>

<div id="loading">Loading rebate data…</div>

<div class="container">
  <div class="summary-row" id="summary"></div>
  <div class="tbl-wrap" id="table-wrap"></div>
</div>

<script>
// ─── state ──────────────────────────────────────────────────────────────────
let sortCol     = "actual";
let sortDir     = "desc";
let expanded    = new Set(); // sold_to keys that are open
let currentPage = 0;
let lastMeta    = {};        // last API response metadata

// ─── build query params from current UI state ─────────────────────────────
function buildQS(page){
  return new URLSearchParams({
    territory:     document.getElementById("f_terr").value,
    sold_to_group: document.getElementById("f_stg").value,
    search:        document.getElementById("f_search").value.trim(),
    show:          document.getElementById("f_show").value,
    sort:          sortCol,
    dir:           sortDir,
    page:          page ?? currentPage,
    page_size:     40,
  });
}

// ─── fetch a page from the server ────────────────────────────────────────────
async function fetchPage(page){
  currentPage = page ?? 0;
  document.getElementById("loading").style.display = "block";
  document.getElementById("table-wrap").innerHTML  = "";
  try{
    const res  = await fetch(`/api/rebate_data?${buildQS(currentPage)}`);
    const json = await res.json();
    if(json.error){
      document.getElementById("table-wrap").innerHTML =
        `<div class="empty" style="color:#dc2626">Error: ${esc(json.error)}<br>
         <small>Run <code>python rebate_data.py</code> to populate rebate tables.</small></div>`;
      document.getElementById("summary").innerHTML = "";
      return;
    }
    lastMeta = json;
    // populate group dropdown on first load
    if(json.stg_list){
      const sel = document.getElementById("f_stg");
      const cur = sel.value;
      sel.innerHTML = '<option value="ALL">All Groups</option>';
      json.stg_list.forEach(s=>{
        const o = document.createElement("option");
        o.value = s; o.textContent = s; if(s===cur) o.selected=true;
        sel.appendChild(o);
      });
    }
    renderPage(json);
  }catch(e){
    document.getElementById("table-wrap").innerHTML =
      `<div class="empty">Failed to load: ${esc(String(e))}</div>`;
  }finally{
    document.getElementById("loading").style.display = "none";
  }
}

// alias used by Refresh button
function load(){ fetchPage(0); }

// ─── render API response ──────────────────────────────────────────────────────
function renderPage(data){
  const s = data.summary;
  document.getElementById("summary").innerHTML = `
    <div class="stat-card"><div class="label">Sold-To (structures)</div><div class="value">${s.total_groups}</div></div>
    <div class="stat-card"><div class="label">Ship-To locations</div><div class="value">${s.total_ship_to}</div></div>
    <div class="stat-card"><div class="label">Has Next Tier</div><div class="value" style="color:#dc2626">${s.has_next}</div></div>
    <div class="stat-card"><div class="label">Max Tier ✓</div><div class="value" style="color:#16a34a">${s.max_tier}</div></div>
    <div class="stat-card"><div class="label">No Sales</div><div class="value" style="color:#9ca3af">${s.zero_sales}</div></div>
    <div class="stat-card"><div class="label">Est. Total Rebate</div><div class="value" style="color:#7c3aed;font-size:15px">$${fmt(s.est_total)}</div></div>`;

  if(!data.groups.length){
    document.getElementById("table-wrap").innerHTML = '<div class="empty">No data found</div>';
    return;
  }

  // [▼] | Ship-To | Name | Brand | Actual Q | Actual A | Curr% | Next% | Need Q | Need A | Est.Rebate | Tier  (12 cols + caret)
  const cols = [
    {key:"ship_to",      label:"Ship-To"},
    {key:"ship_to_name", label:"Name"},
    {key:"brand",        label:"Brand",      nosort:true},
    {key:"actual_qty",   label:"Actual Q"},
    {key:"actual_amt",   label:"Actual A"},
    {key:"curr_rate",    label:"Curr %",     nosort:true},
    {key:"next_rate",    label:"Next %",     nosort:true},
    {key:"needed_qty",   label:"Need Q",     nosort:true},
    {key:"needed_amt",   label:"Need A",     nosort:true},
    {key:"est_rebate",   label:"Est. Rebate"},
    {key:"tiers",        label:"Tier Progress", nosort:true},
  ];
  const ths = cols.map(c=>{
    if(c.nosort) return `<th>${c.label}</th>`;
    const active = sortCol===c.key;
    const arrow  = active ? (sortDir==="asc"?'▲':'▼') : '▲';
    return `<th class="${active?'sorted':''}" onclick="setSort('${c.key}')">${c.label} <span class="sa">${arrow}</span></th>`;
  }).join("");

  let bodyHtml = "";
  data.groups.forEach(g=>{
    const isOpen    = expanded.has(g.key);
    const itemCount = g.items.length;

    // group header: caret(1) + name colspan=2 + brand(1) + actualQ(1) + actualA(1) + colspan=4 + est(1) + tier(1) = 12 ✓
    bodyHtml += `<tr class="grp-hdr" onclick="toggleGroup('${escAttr(g.key)}')">
      <td class="caret">${isOpen?"▼":"▶"}</td>
      <td colspan="2"><b>${esc(g.sold_to_name)}</b>
        <span style="font-family:monospace;font-size:10px;color:#6b7280;margin-left:6px">${g.sold_to}</span>
        <span style="margin-left:6px;font-weight:400;color:#6b7280">${esc(g.sold_to_group)}</span>
        <span style="margin-left:4px;font-weight:400;color:#6b7280">${esc(g.region)}</span>
      </td>
      <td>${terrBadgeHtml(g.brand)}</td>
      <td>${fmt(g.grp_actual_qty)} <span class="ul">units</span></td>
      <td>$${fmt(g.grp_actual_amt)}</td>
      <td colspan="4"></td>
      <td><span class="est">$${fmt(g.grp_est)}</span> <span class="ul">est.</span>
          <span class="ul">(${itemCount} ship-to)</span></td>
      <td></td>
    </tr>`;

    if(isOpen){
      g.items.forEach(r=>{
        const validT = r.tiers.filter(t=>t.rate>0);
        const maxT   = validT.length ? validT[validT.length-1].threshold : 1;
        const pct    = Math.min(100, maxT>0 ? r.actual/maxT*100 : 0);
        const barClr = r.next_rate==null && r.curr_rate>0 ? "#16a34a"
                     : pct>=50 ? "#f59e0b" : "#3b82f6";

        const dots = validT.map(t=>{
          let cls = "fut";
          if(t.threshold<=r.actual && t.rate>0) cls="past";
          else if(t===validT.find(x=>x.threshold>r.actual && x.rate>0)) cls="curr";
          const lbl = r.unit==="Q" ? fmt(t.threshold)+" u" : "$"+fmt(t.threshold);
          return `<span class="td ${cls}" title="${lbl} → ${t.rate}%">${t.rate}%</span>`;
        }).join("");

        const isMax = r.next_rate==null && r.curr_rate>0;
        const noSale = r.curr_rate===0 && r.actual===0;
        const needQHtml = r.needed_qty!=null
          ? `<span class="needed">+${fmt(r.needed_qty)}</span>`
          : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);
        const needAHtml = r.needed_amt!=null
          ? `<span class="needed">+$${fmt(r.needed_amt)}</span>`
          : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);

        bodyHtml += `<tr class="ship-row">
          <td style="font-family:monospace;font-size:11px;color:#374151">${r.ship_to}</td>
          <td>${esc(r.ship_to_name)}</td>
          <td>${terrBadgeHtml(r.brand)}</td>
          <td>
            <div class="prog-wrap"><div class="prog-bar" style="width:${r.unit==="Q"?pct.toFixed(1):0}%;background:${barClr}"></div></div>
            ${fmt(r.actual_qty)} <span class="ul">u</span>
          </td>
          <td>
            <div class="prog-wrap"><div class="prog-bar" style="width:${r.unit==="A"?pct.toFixed(1):0}%;background:${barClr}"></div></div>
            $${fmt(r.actual_amt)}
          </td>
          <td><span class="rc">${r.curr_rate>0?r.curr_rate+"%":"—"}</span></td>
          <td><span class="rn">${r.next_rate!=null?r.next_rate+"%":"—"}</span></td>
          <td>${needQHtml}</td>
          <td>${needAHtml}</td>
          <td><span class="est">${r.est_rebate>0?"$"+fmt(r.est_rebate):"—"}</span></td>
          <td><div class="tier-list">${dots}</div></td>
        </tr>`;
      });
    }
  });

  const p = data.page, tp = data.total_pages, tg = s.total_groups;
  const pgBar = `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid #e5e7eb;font-size:12px">
    <button class="btn btn-outline" onclick="goPage(0)"     ${p===0?'disabled':''}>«</button>
    <button class="btn btn-outline" onclick="goPage(${p-1})" ${p===0?'disabled':''}>‹ Prev</button>
    <span style="color:#6b7280">Page ${p+1} / ${tp} &nbsp;(${tg} sold-to)</span>
    <button class="btn btn-outline" onclick="goPage(${p+1})" ${p>=tp-1?'disabled':''}>Next ›</button>
    <button class="btn btn-outline" onclick="goPage(${tp-1})" ${p>=tp-1?'disabled':''}>»</button>
  </div>`;

  document.getElementById("table-wrap").innerHTML = `
    <table>
      <thead><tr><th></th>${ths}</tr></thead>
      <tbody>${bodyHtml}</tbody>
    </table>
    ${pgBar}`;
}

function goPage(p){ fetchPage(p); window.scrollTo(0,0); }

function setSort(col){
  if(sortCol===col) sortDir = sortDir==="desc"?"asc":"desc";
  else{ sortCol=col; sortDir="desc"; }
  fetchPage(0);
}

function toggleGroup(key){
  if(expanded.has(key)) expanded.delete(key); else expanded.add(key);
  // re-render current data without API call
  if(lastMeta.groups) renderPage(lastMeta);
}

function terrBadgeHtml(t){
  if(t==="TTL") return `<span class="badge b-ttl">TTL</span>`;
  if(t==="HK")  return `<span class="badge b-hk">HK</span>`;
  return `<span class="badge b-lf">LF</span>`;
}

// ─── export – server generates CSV ───────────────────────────────────────────
function exportCSV(){
  const qs = buildQS(0);
  qs.set("page_size", 99999);
  window.location = `/api/rebate_export?${qs}`;
}

// ─── helpers ─────────────────────────────────────────────────────────────────
function fmt(n){
  if(n==null||n==="") return "—";
  return Number(n).toLocaleString(undefined,{maximumFractionDigits:1});
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){return String(s||"").replace(/"/g,"&quot;");}

// live filters – debounced
let _debounce;
function debouncedFetch(){ clearTimeout(_debounce); _debounce=setTimeout(()=>fetchPage(0),350); }
document.getElementById("f_search").addEventListener("input",  debouncedFetch);
document.getElementById("f_show").addEventListener("change",   ()=>fetchPage(0));

load();
</script>
</body>
</html>
