<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebate Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;font-size:13px}
header{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:13px;font-weight:700}
header .sub{font-size:10px;opacity:.55}
.lbl{font-size:10px;color:#9ca3af;font-weight:400;margin-right:2px}
.filters{background:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-bottom:1px solid #e5e7eb}
.filters label{font-size:11px;color:#6b7280;margin-bottom:2px;display:block}
.filters select,.filters input{border:1px solid #d1d5db;border-radius:6px;padding:5px 8px;font-size:12px;min-width:120px}
.btn{border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;border:none}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-outline:hover{background:#f9fafb}
.container{padding:12px 16px}
.summary-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:8px;padding:10px 16px;border:1px solid #e5e7eb;min-width:145px}
.stat-card .label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:19px;font-weight:700;color:#1e3a5f;margin-top:2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
/* Region header rows (level 1) */
tr.region-hdr td{background:#1e3a5f;font-weight:700;color:#fff;font-size:12px;padding:7px 10px;border-bottom:2px solid #16305a}
/* BDE header rows (level 2) */
tr.bde-hdr td{background:#3b5f8a;font-weight:600;color:#e8f0fb;font-size:12px;padding:6px 10px 6px 28px;border-bottom:1px solid #2d4f7a}
/* Sold-to header rows (level 3) */
tr.grp-hdr td{background:#e8eef6;font-weight:700;color:#1e3a5f;font-size:12px;padding:6px 10px 6px 44px;border-bottom:1px solid #c7d2e3;cursor:pointer}
tr.grp-hdr:hover td{background:#dce6f5}
tr.grp-hdr td.caret{width:24px;text-align:center;padding-left:44px}
/* Column headers */
th{background:#f8fafc;color:#374151;font-size:11px;font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#f1f5f9}
th .sa{margin-left:3px;opacity:.35}
th.sorted .sa{opacity:1}
/* Brand sub-header rows (level 4) */
tr.brand-hdr td{background:#f0f4fa;font-weight:600;color:#374151;font-size:12px;padding:5px 10px 5px 56px;border-bottom:1px solid #dde5f0}
/* Ship_to data rows */
td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
tr.ship-row:hover td{background:#fafafa}
tr.ship-row td:first-child{padding-left:28px}
/* Badges */
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.b-hk{background:#dbeafe;color:#1d4ed8}
.b-lf{background:#dcfce7;color:#16a34a}
.b-ttl{background:#ede9fe;color:#6d28d9}
.b-A{background:#fef3c7;color:#92400e}
.b-Q{background:#ede9fe;color:#5b21b6}
.b-PCLT{background:#fce7f3;color:#9d174d}
.b-TBR{background:#ffedd5;color:#9a3412}
/* Progress */
.prog-wrap{width:72px;background:#e5e7eb;border-radius:4px;height:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:4px}
.prog-bar{height:6px;border-radius:4px}
/* Tier dots */
.tier-list{display:flex;gap:2px;flex-wrap:wrap}
.td{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid transparent}
.td.past{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.td.curr{background:#fef9c3;color:#713f12;border-color:#fbbf24}
.td.fut{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
/* Misc */
.needed{color:#dc2626;font-weight:600}
.no-next{color:#16a34a;font-weight:600}
.rc{color:#1d4ed8;font-weight:700}
.rn{color:#dc2626;font-size:11px}
.est{color:#7c3aed;font-weight:600}
.ul{font-size:9px;color:#6b7280}
.empty{text-align:center;padding:40px;color:#9ca3af}
#loading{padding:20px;text-align:center;color:#6b7280;display:none}
</style>
</head>
<body>
<header>
  <h1>Rebate Calculator</h1>
  <span class="sub">sales_thismonth cumulative data</span>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="window.location.href='/'">Graph View</button>
    <button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="window.location.href='/map'">Map View</button>
    <button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="window.location.href='/stock'">Stock</button>
    <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;background:#1e3a5f;color:#fff;border-color:#3b5f8a">Rebate</button>
  </div>
</header>

<div class="filters">
  <div>
    <label>Search</label>
    <input type="text" id="f_search" placeholder="Name / code…" style="min-width:180px" oninput="debounceSearch()">
  </div>
</div>

<div id="loading">Loading rebate data…</div>

<div class="container">
  <div class="summary-row" id="summary"></div>
  <div class="tbl-wrap" id="table-wrap"></div>
</div>

<script>
// ─── state ──────────────────────────────────────────────────────────────────
let sortCol     = "actual";
let sortDir     = "desc";
let expanded = new Set(); // sold_to group keys open (ship-to toggle)
let currentPage = 0;
let lastMeta    = {};        // last API response metadata

// ─── build query params from current UI state ─────────────────────────────
function buildQS(page){
  return new URLSearchParams({
    search:        document.getElementById("f_search").value.trim(),
    show:          "ALL",
    sort:          sortCol,
    dir:           sortDir,
    page:          page ?? currentPage,
    page_size:     40,
  });
}

let _searchTimer = null;
function debounceSearch(){ clearTimeout(_searchTimer); _searchTimer = setTimeout(()=>fetchPage(0), 350); }

// ─── fetch a page from the server ────────────────────────────────────────────
async function fetchPage(page){
  currentPage = page ?? 0;
  document.getElementById("loading").style.display = "block";
  document.getElementById("table-wrap").innerHTML  = "";
  try{
    const res  = await fetch(`/api/rebate_data?${buildQS(currentPage)}`);
    const json = await res.json();
    if(json.error){
      document.getElementById("table-wrap").innerHTML =
        `<div class="empty" style="color:#dc2626">Error: ${esc(json.error)}<br>
         <small>Run <code>python rebate_data.py</code> to populate rebate tables.</small></div>`;
      document.getElementById("summary").innerHTML = "";
      return;
    }
    lastMeta = json;
    renderPage(json);
  }catch(e){
    document.getElementById("table-wrap").innerHTML =
      `<div class="empty">Failed to load: ${esc(String(e))}</div>`;
  }finally{
    document.getElementById("loading").style.display = "none";
  }
}

// alias used by Refresh button
function load(){ fetchPage(0); }

// ─── render API response ──────────────────────────────────────────────────────
function renderPage(data){
  const s = data.summary;
  document.getElementById("summary").innerHTML = `
    <div class="stat-card"><div class="label">Total Current Rebate</div><div class="value" style="color:#7c3aed;font-size:15px">$${fmt(s.est_total)}</div></div>`;

  if(!data.groups.length){
    document.getElementById("table-wrap").innerHTML = '<div class="empty">No data found</div>';
    return;
  }

  // [▼] | Ship-To | Name | Brand | Qty (YTD) | Amount (YTD) | Rebate % | Next Tier % | Need Qty | Need Amount | Curr. Rebate | Tier Progress
  const cols = [
    {key:"ship_to",      label:"Ship-To"},
    {key:"ship_to_name", label:"Name"},
    {key:"brand",        label:"Brand",        nosort:true},
    {key:"actual_qty",   label:"Qty (YTD)"},
    {key:"actual_amt",   label:"Amount (YTD)"},
    {key:"curr_rate",    label:"Rebate %",      nosort:true},
    {key:"next_rate",    label:"Next Tier %",   nosort:true},
    {key:"needed_qty",   label:"Need Qty",      nosort:true},
    {key:"needed_amt",   label:"Need Amount",   nosort:true},
    {key:"curr_rebate",  label:"Curr. Rebate"},
    {key:"tiers",        label:"Tier Progress", nosort:true},
  ];
  const ths = cols.map(c=>{
    if(c.nosort) return `<th>${c.label}</th>`;
    const active = sortCol===c.key;
    const arrow  = active ? (sortDir==="asc"?'▲':'▼') : '▲';
    return `<th class="${active?'sorted':''}" onclick="setSort('${c.key}')">${c.label} <span class="sa">${arrow}</span></th>`;
  }).join("");

  // ── Build nested Region → BDE → Sold-to structure ──────────────────────
  const regionMap = new Map();
  data.groups.forEach(g => {
    const rKey = g.region || "-";
    if (!regionMap.has(rKey)) regionMap.set(rKey, {region:rKey, bdes:new Map(), qty:0, amt:0, rebate:0});
    const rNode = regionMap.get(rKey);
    const bKey = rKey + "|" + (g.bde || "-");
    if (!rNode.bdes.has(bKey)) rNode.bdes.set(bKey, {bde:g.bde||"-", rKey, groups:[], qty:0, amt:0, rebate:0});
    const bNode = rNode.bdes.get(bKey);
    // Sum per-brand to avoid inflating region/BDE totals when a sold_to has both PCLT+TBR
    g.brands.forEach(b => {
      rNode.qty += b.grp_actual_qty; rNode.amt += b.grp_actual_amt; rNode.rebate += b.grp_curr_rebate;
      bNode.qty += b.grp_actual_qty; bNode.amt += b.grp_actual_amt; bNode.rebate += b.grp_curr_rebate;
    });
    bNode.groups.push(g);
  });

  // ── Helper: ship-to count per brand (handles sold_to_basis) ─────────────
  function shipCount(b){
    if(b.items.length>0 && b.items[0].sold_to_basis && b.items[0].ship_details)
      return b.items[0].ship_details.length;
    return b.items.length;
  }

  // ── Helper: render ship-to rows ──────────────────────────────────────────
  function renderShipRows(g){
    let html = "";
    const seenShips = new Set();
    g.items.filter(r=>{ const k=r.ship_to+"|"+r.brand; if(seenShips.has(k)) return false; seenShips.add(k); return true; })
    .forEach(r=>{
      if(r.sold_to_basis && r.ship_details && r.ship_details.length>0){
        // Sold-to basis: show individual ship-to addresses (qty/amt only, rebate on brand row)
        // Sold-to basis: compute tier info from aggregated sold-to values
        const validT = r.tiers.filter(t=>t.rate>0);
        const maxT   = validT.length ? validT[validT.length-1].threshold : 1;
        const pct    = Math.min(100, maxT>0 ? r.actual/maxT*100 : 0);
        const barClr = r.next_rate==null && r.curr_rate>0 ? "#16a34a" : pct>=50 ? "#f59e0b" : "#3b82f6";
        const dots   = validT.map(t=>{
          let cls="fut";
          if(t.threshold<=r.actual && t.rate>0) cls="past";
          else if(t===validT.find(x=>x.threshold>r.actual && x.rate>0)) cls="curr";
          const lbl = r.unit==="Q" ? fmt(t.threshold)+" u" : "$"+fmt(t.threshold);
          return `<span class="td ${cls}" title="${lbl} → ${t.rate}%">${t.rate}%</span>`;
        }).join("");
        const isMax    = r.next_rate==null && r.curr_rate>0;
        const needQHtml = r.needed_qty!=null ? `<span class="needed">+${fmt(r.needed_qty)}</span>`
                        : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);
        const needAHtml = r.needed_amt!=null ? `<span class="needed">+$${fmt(r.needed_amt)}</span>`
                        : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);
        r.ship_details.forEach(sd=>{
          html += `<tr class="ship-row">
            <td></td>
            <td colspan="2" style="padding-left:76px"><span style="font-weight:500">${esc(sd.ship_to_name)}</span>
              <span style="font-family:monospace;font-size:10px;color:#9ca3af;margin-left:6px">${sd.ship_to}</span>
              <span style="font-size:9px;color:#c4b5fd;margin-left:5px;font-style:italic">per Sold-To</span>
            </td>
            <td></td>
            <td><span class="lbl">qty</span>${fmt(sd.actual_qty)} <span class="ul">u</span></td>
            <td><span class="lbl">amt</span>$${fmt(sd.actual_amt)}</td>
            <td><span class="rc"><span class="lbl">rate</span>${r.curr_rate>0?r.curr_rate+"%":"—"}</span></td>
            <td><span class="rn"><span class="lbl">next</span>${r.next_rate!=null?r.next_rate+"%":"—"}</span></td>
            <td>${needQHtml}</td>
            <td>${needAHtml}</td>
            <td><span style="color:#9ca3af">—</span></td>
            <td><div class="tier-list">${dots}</div></td>
          </tr>`;
        });
      } else {
        // Ship-to basis: per-ship-to rebate calculation
        const validT = r.tiers.filter(t=>t.rate>0);
        const maxT   = validT.length ? validT[validT.length-1].threshold : 1;
        const pct    = Math.min(100, maxT>0 ? r.actual/maxT*100 : 0);
        const barClr = r.next_rate==null && r.curr_rate>0 ? "#16a34a" : pct>=50 ? "#f59e0b" : "#3b82f6";
        const dots   = validT.map(t=>{
          let cls="fut";
          if(t.threshold<=r.actual && t.rate>0) cls="past";
          else if(t===validT.find(x=>x.threshold>r.actual && x.rate>0)) cls="curr";
          const lbl = r.unit==="Q" ? fmt(t.threshold)+" u" : "$"+fmt(t.threshold);
          return `<span class="td ${cls}" title="${lbl} → ${t.rate}%">${t.rate}%</span>`;
        }).join("");
        const isMax    = r.next_rate==null && r.curr_rate>0;
        const needQHtml = r.needed_qty!=null ? `<span class="needed">+${fmt(r.needed_qty)}</span>`
                        : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);
        const needAHtml = r.needed_amt!=null ? `<span class="needed">+$${fmt(r.needed_amt)}</span>`
                        : (isMax ? `<span class="no-next">MAX ✓</span>` : `<span style="color:#9ca3af">—</span>`);
        html += `<tr class="ship-row">
          <td></td>
          <td colspan="2" style="padding-left:76px"><span style="font-weight:500">${esc(r.ship_to_name)}</span>
            <span style="font-family:monospace;font-size:10px;color:#9ca3af;margin-left:6px">${r.ship_to}</span>
          </td>
          <td>${badgesHtml(r.badges)}</td>
          <td><div class="prog-wrap"><div class="prog-bar" style="width:${r.unit==="Q"?pct.toFixed(1):0}%;background:${barClr}"></div></div><span class="lbl">qty</span>${fmt(r.actual_qty)} <span class="ul">u</span></td>
          <td><div class="prog-wrap"><div class="prog-bar" style="width:${r.unit==="A"?pct.toFixed(1):0}%;background:${barClr}"></div></div><span class="lbl">amt</span>$${fmt(r.actual_amt)}</td>
          <td><span class="rc"><span class="lbl">rate</span>${r.curr_rate>0?r.curr_rate+"%":"—"}</span></td>
          <td><span class="rn"><span class="lbl">next</span>${r.next_rate!=null?r.next_rate+"%":"—"}</span></td>
          <td>${needQHtml}</td>
          <td>${needAHtml}</td>
          <td><span class="est"><span class="lbl">rebate</span>${r.curr_rebate>0?"$"+fmt(r.curr_rebate):"—"}</span></td>
          <td><div class="tier-list">${dots}</div></td>
        </tr>`;
      }
    });
    return html;
  }

  // ── Sort regions: NSW, QLD, VIC, WA first, then others alphabetically ───
  const regionOrder = ["NSW","QLD","VIC","WA"];
  const sortedRegions = [...regionMap.entries()].sort(([a],[b])=>{
    const ai = regionOrder.indexOf(a), bi = regionOrder.indexOf(b);
    if(ai>=0 && bi>=0) return ai-bi;
    if(ai>=0) return -1; if(bi>=0) return 1;
    return a.localeCompare(b);
  });

  // ── Render 4-level hierarchy ─────────────────────────────────────────────
  let bodyHtml = "";
  sortedRegions.forEach(([rKey, rNode]) => {
    bodyHtml += `<tr class="region-hdr">
      <td colspan="12"><b>${esc(rNode.region)}</b>
        <span style="font-weight:400;margin-left:12px;opacity:.8"><span class="lbl" style="color:rgba(255,255,255,.5)">qty</span>${fmt(rNode.qty)} u &nbsp;·&nbsp; <span class="lbl" style="color:rgba(255,255,255,.5)">amt</span>$${fmt(rNode.amt)} &nbsp;·&nbsp; <span class="lbl" style="color:rgba(255,255,255,.5)">rebate</span>$${fmt(rNode.rebate)}</span>
      </td>
    </tr>`;

    rNode.bdes.forEach((bNode, bKey) => {
      bodyHtml += `<tr class="bde-hdr">
        <td colspan="12"><b>${esc(bNode.bde)}</b>
          <span style="font-weight:400;margin-left:12px;opacity:.8"><span class="lbl" style="color:rgba(255,255,255,.5)">qty</span>${fmt(bNode.qty)} u &nbsp;·&nbsp; <span class="lbl" style="color:rgba(255,255,255,.5)">amt</span>$${fmt(bNode.amt)} &nbsp;·&nbsp; <span class="lbl" style="color:rgba(255,255,255,.5)">rebate</span>$${fmt(bNode.rebate)}</span>
        </td>
      </tr>`;

      bNode.groups.forEach(g => {
        const isOpen     = expanded.has(g.key);
        const totalShips = g.brands.reduce((s,b)=>s+shipCount(b), 0);
        const brandBadges = g.brands.map(b=>badgesHtml(b.badges)).join(" &nbsp; ");
        // When a sold_to has both PCLT and TBR brands, summing qty/amt is misleading — show "—"
        const hasMixedLines = g.brands.length > 1 &&
          g.brands.some(b => b.brand === "PCLT" || b.brand === "TBR");
        const grpQtyHtml = hasMixedLines
          ? `<span style="color:#9ca3af">—</span>`
          : `<span class="lbl">qty</span>${fmt(g.grp_actual_qty)} <span class="ul">u</span>`;
        const grpAmtHtml = hasMixedLines
          ? `<span style="color:#9ca3af">—</span>`
          : `<span class="lbl">amt</span>$${fmt(g.grp_actual_amt)}`;
        bodyHtml += `<tr class="grp-hdr" onclick="toggleGroup('${escAttr(g.key)}')">
          <td class="caret">${isOpen?"▼":"▶"}</td>
          <td colspan="2"><b>${esc(g.sold_to_name)}</b>
            <span style="font-family:monospace;font-size:10px;color:#6b7280;margin-left:6px">${g.sold_to}</span>
          </td>
          <td>${brandBadges}</td>
          <td>${grpQtyHtml}</td>
          <td>${grpAmtHtml}</td>
          <td colspan="4"></td>
          <td><span class="est"><span class="lbl">rebate</span>$${fmt(g.grp_curr_rebate)}</span> <span class="ul">(${totalShips} ship-to)</span></td>
          <td></td>
        </tr>`;
        if (isOpen) {
          g.brands.forEach(b => {
            bodyHtml += `<tr class="brand-hdr">
              <td></td>
              <td colspan="2" style="padding-left:56px">${badgesHtml(b.badges)}
                <span style="font-size:11px;color:#6b7280;margin-left:6px">${esc(b.structure_name)}</span>
              </td>
              <td></td>
              <td><span class="lbl">qty</span>${fmt(b.grp_actual_qty)} <span class="ul">u</span></td>
              <td><span class="lbl">amt</span>$${fmt(b.grp_actual_amt)}</td>
              <td colspan="4"></td>
              <td><span class="est"><span class="lbl">rebate</span>${b.grp_curr_rebate>0?"$"+fmt(b.grp_curr_rebate):"—"}</span> <span class="ul">(${shipCount(b)} ship-to)</span></td>
              <td></td>
            </tr>`;
            bodyHtml += renderShipRows(b);
          });
        }
      });
    });
  });

  const p = data.page, tp = data.total_pages, tg = s.total_groups;
  const pgBar = `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid #e5e7eb;font-size:12px">
    <button class="btn btn-outline" onclick="goPage(0)"     ${p===0?'disabled':''}>«</button>
    <button class="btn btn-outline" onclick="goPage(${p-1})" ${p===0?'disabled':''}>‹ Prev</button>
    <span style="color:#6b7280">Page ${p+1} / ${tp} &nbsp;(${tg} sold-to)</span>
    <button class="btn btn-outline" onclick="goPage(${p+1})" ${p>=tp-1?'disabled':''}>Next ›</button>
    <button class="btn btn-outline" onclick="goPage(${tp-1})" ${p>=tp-1?'disabled':''}>»</button>
  </div>`;

  document.getElementById("table-wrap").innerHTML = `
    <table>
      <thead><tr><th style="width:24px"></th>${ths}</tr></thead>
      <tbody>${bodyHtml}</tbody>
    </table>
    ${pgBar}`;
}

function goPage(p){ fetchPage(p); window.scrollTo(0,0); }

function setSort(col){
  if(sortCol===col) sortDir = sortDir==="desc"?"asc":"desc";
  else{ sortCol=col; sortDir="desc"; }
  fetchPage(0);
}

function toggleGroup(key){
  if(expanded.has(key)) expanded.delete(key); else expanded.add(key);
  if(lastMeta.groups) renderPage(lastMeta);
}

function terrBadgeHtml(t){
  if(t==="TTL")  return `<span class="badge b-ttl">TTL</span>`;
  if(t==="HK")   return `<span class="badge b-hk">HK</span>`;
  if(t==="LF")   return `<span class="badge b-lf">LF</span>`;
  if(t==="PCLT") return `<span class="badge b-PCLT">PCLT</span>`;
  if(t==="TBR")  return `<span class="badge b-TBR">TBR</span>`;
  return `<span class="badge b-lf">${t}</span>`;
}
function badgesHtml(arr){
  return arr.map(b => {
    if(b==="A") return `<span class="badge b-A">A</span>`;
    if(b==="Q") return `<span class="badge b-Q">Q</span>`;
    return terrBadgeHtml(b);
  }).join(" ");
}
function badgePairHtml(badge1, badge2){
  const b1 = terrBadgeHtml(badge1);
  if(badge2==="A") return `${b1} <span class="badge b-A">A</span>`;
  if(badge2==="Q") return `${b1} <span class="badge b-Q">Q</span>`;
  return `${b1} ${terrBadgeHtml(badge2)}`;
}

// ─── export – server generates CSV ───────────────────────────────────────────
function exportCSV(){
  const qs = buildQS(0);
  qs.set("page_size", 99999);
  window.location = `/api/rebate_export?${qs}`;
}

// ─── helpers ─────────────────────────────────────────────────────────────────
function fmt(n){
  if(n==null||n==="") return "—";
  return Number(n).toLocaleString(undefined,{maximumFractionDigits:1});
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){return String(s||"").replace(/"/g,"&quot;");}

load();
