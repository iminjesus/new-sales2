<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDE Visit Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;font-size:13px}
header{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:14px;font-weight:700}
header .sub{font-size:10px;opacity:.55}
header .nav{margin-left:auto;display:flex;gap:6px}
.btn{border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;border:1px solid #d1d5db;background:#fff;color:#374151}
.btn:hover{background:#f9fafb}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn.active{background:#374151;color:#fff;border-color:#374151}
.container{padding:14px 16px;max-width:1480px;margin:0 auto}
.planner-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:980px){.planner-layout{grid-template-columns:1fr}}

/* ── Calendar planner ─────────────────────────────────── */
.plan-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan-toolbar button{font-size:11px;padding:4px 10px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:5px;cursor:pointer}
.plan-toolbar button:hover{background:#f3f4f6}
.plan-month{font-weight:700;color:#1e3a5f;font-size:13px;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:#e5e7eb;border:1px solid #e5e7eb;border-radius:5px;overflow:hidden}
.cal-head,.cal-cell{background:#fff;padding:4px 5px;min-height:78px;display:flex;flex-direction:column;font-size:11px}
.cal-head{min-height:0;background:#f8fafc;font-weight:600;color:#6b7280;text-align:center;font-size:10px;padding:5px 0;text-transform:uppercase;letter-spacing:.4px}
.cal-cell.dim{background:#fafafa;color:#cbd5e1}
.cal-cell.today{background:#fff7ed}
.cal-cell .d-num{font-weight:600;color:#374151;font-size:11px;margin-bottom:2px}
.cal-cell.today .d-num{color:#ea580c}
.cal-cell.drag-over{background:#dbeafe;outline:2px dashed #2563eb;outline-offset:-2px}
.cal-cell .chips{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.plan-chip{background:#dcfce7;border:1px solid #86efac;color:#14532d;font-size:10px;padding:1px 5px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:space-between;gap:3px}
.plan-chip:hover{background:#bbf7d0}
.plan-chip .pc-rm{color:#dc2626;font-weight:700}

/* Ship-to palette */
.palette-input{width:100%;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;margin-bottom:6px}
.palette-input:focus{outline:none;border-color:#2563eb}
.palette-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:2px}
.ship-chip{padding:5px 8px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font-size:11px;color:#374151;cursor:grab;user-select:none;display:flex;justify-content:space-between;gap:6px}
.ship-chip:active{cursor:grabbing}
.ship-chip:hover{background:#eff6ff;border-color:#93c5fd}
.ship-chip .sc-code{color:#6b7280;font-family:monospace;font-size:10px}
.ship-chip.dragging{opacity:.5}
.palette-empty{color:#9ca3af;font-size:11px;padding:8px;text-align:center}
.palette-count{font-size:10px;color:#9ca3af;margin-bottom:4px;text-align:right}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
.card h2{font-size:13px;font-weight:700;color:#1e3a5f;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:640px){
  body{padding-top:46px}
  .grid{grid-template-columns:1fr}
  header{flex-wrap:wrap;padding:8px 12px;gap:6px}
  header h1{font-size:13px}
  header .sub{display:none}
  /* Pin the nav strip to the very top so it's always one tap away */
  header .nav{
    position:fixed !important;top:0;left:0;right:0;z-index:1000;
    margin:0 !important;background:#1e3a5f;border-bottom:1px solid #15314e;
    padding:6px 6px;display:flex;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;gap:4px;width:auto;
  }
  header .nav .btn{flex:0 0 auto;font-size:11px;padding:5px 10px;white-space:nowrap}
  .container{padding:8px}
  .card{padding:10px}
  /* Recent entries table — horizontal scroll wrapper so all 5 cols fit */
  #recentWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .recent-tbl{min-width:560px;font-size:11px}
  .recent-tbl th,.recent-tbl td{padding:5px 6px}
  .recent-tbl .photos img{width:30px;height:30px}
  .filt{flex-wrap:wrap;gap:4px}
  .filt select,.filt input{font-size:11px}
  /* Searchable dropdowns: full-width on mobile (no fixed 150px input) */
  .dd-wrap input{width:auto;min-width:0}
  .dd-menu{width:100%;left:0;right:0}
  /* Submit button: full-width tap target */
  .submit-row{flex-wrap:wrap}
  .submit-row .btn-primary{flex:1 1 100%}
}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:#6b7280;font-weight:600}
.field label .req{color:#dc2626}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%;background:#fff}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#2563eb}
.field.col-full{grid-column:1/-1}
.bde-id-line{font-size:11px;color:#6b7280;padding:6px 9px;background:#f3f4f6;border-radius:6px;margin-bottom:6px}
.bde-id-line b{color:#1e3a5f}
.submit-row{display:flex;gap:10px;align-items:center;margin-top:8px}
#submitMsg{font-size:12px}
#submitMsg.ok{color:#16a34a}
#submitMsg.err{color:#dc2626}

/* ── Custom searchable dropdown (same UX as the rest of the dashboard) ── */
.dd{position:relative;display:flex;flex-direction:column;gap:3px;width:100%}
.dd-wrap{display:flex;align-items:stretch;width:100%}
.dd-wrap input{
  flex:1;min-width:0;padding:7px 9px;
  border:1px solid #d1d5db;border-right:none;border-radius:6px 0 0 6px;
  font-size:13px;color:#374151;background:#fff;outline:none;
  transition:border-color .12s,background .12s
}
.dd-wrap input:focus{border-color:#2563eb}
.dd-wrap input:disabled{opacity:.55;cursor:not-allowed;background:#f3f4f6}
.dd-btn{
  padding:5px 9px;border:1px solid #d1d5db;border-right:none;
  background:#f3f4f6;cursor:pointer;font-size:11px;color:#6b7280;
  transition:background .12s;user-select:none
}
.dd-btn:hover:not(:disabled){background:#e5e7eb}
.dd-btn:disabled{opacity:.5;cursor:not-allowed}
.dd-btn.dd-clear-btn{color:#9ca3af}
.dd-btn.dd-clear-btn:hover{background:#fee2e2;color:#ef4444}
.dd-btn.dd-last{border-right:1px solid #d1d5db;border-radius:0 6px 6px 0}
.dd.dd-active .dd-wrap input{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600}
.dd.dd-active .dd-btn{border-color:#2563eb;background:#dbeafe;color:#1d4ed8}
.dd-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  max-height:280px;overflow:auto;background:#fff;
  border:1px solid #e5e7eb;border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:9999;display:none
}
.dd-item{padding:7px 10px;cursor:pointer;white-space:nowrap;font-size:12px;color:#374151;overflow:hidden;text-overflow:ellipsis}
.dd-item:hover,.dd-item.dd-item-active{background:#eff6ff;color:#2563eb}
.dd-empty{padding:10px;color:#9ca3af;font-size:12px}
.recent-tbl{width:100%;border-collapse:collapse;font-size:12px}
.recent-tbl th{background:#f8fafc;color:#374151;font-size:11px;font-weight:600;padding:6px 8px;text-align:left;border-bottom:1px solid #e5e7eb}
.recent-tbl td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.recent-tbl tr:hover td{background:#fafafa}
.recent-tbl .ts{color:#6b7280;font-size:11px;white-space:nowrap}
.recent-tbl .bde{font-weight:600;color:#1e3a5f}
.recent-tbl .shop{color:#374151}
.recent-tbl .notes{color:#111827}
.recent-tbl .photos a{display:inline-block;margin-right:4px}
.recent-tbl .photos img{width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid #e5e7eb}
.empty{padding:18px;text-align:center;color:#9ca3af;font-size:12px}
.filt{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filt label{font-size:11px;color:#6b7280}
.filt select,.filt input{border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>BDE Visit Log</h1>
  <span class="sub">post-visit memo · 1 min</span>
  <div class="nav">
    <button class="btn" onclick="location.href='/'">Graph View</button>
    <button class="btn" onclick="location.href='/map'">Map View</button>
    <button class="btn" onclick="location.href='/stock'">Stock</button>
    <button class="btn" onclick="location.href='/rebate'">Rebate</button>
    <button class="btn" onclick="location.href='/price'">Price</button>
    <button class="btn active">Meeting</button>
  </div>
</header>

<div class="container">

<div class="planner-layout">
<div class="planner-left">

  <!-- ── New entry form ── -->
  <div class="card">
    <h2>New visit</h2>
    <div id="bdeIdLine" class="bde-id-line" style="display:none;">
      Signed in as <b id="bdeIdEmail">…</b>
    </div>

    <form id="meetingForm">
      <div class="grid">
        <div class="field">
          <label>BDE <span class="req">*</span></label>
          <select id="fBde" required>
            <option value="">— select —</option>
          </select>
        </div>
        <div class="field">
          <label>Visit date <span class="req">*</span></label>
          <input id="fVisitDate" type="date" required>
        </div>

        <div class="field">
          <label>Sold-to <span style="color:#9ca3af;font-weight:400;">(optional — auto-filled when Ship-to is picked)</span></label>
          <div class="dd" id="ddSold">
            <div class="dd-wrap">
              <input id="fSold" type="text" placeholder="Search sold-to…" autocomplete="off">
              <button class="dd-btn dd-clear-btn" type="button" id="fSoldClear" title="Clear" tabindex="-1">×</button>
              <button class="dd-btn dd-last" type="button" id="fSoldOpen" title="Show all" tabindex="-1">▼</button>
            </div>
            <div class="dd-menu" id="fSoldMenu"></div>
          </div>
        </div>
        <div class="field">
          <label>Ship-to <span class="req">*</span></label>
          <div class="dd" id="ddShip">
            <div class="dd-wrap">
              <input id="fShip" type="text" placeholder="Search ship-to…" autocomplete="off">
              <button class="dd-btn dd-clear-btn" type="button" id="fShipClear" title="Clear" tabindex="-1">×</button>
              <button class="dd-btn dd-last" type="button" id="fShipOpen" title="Show all" tabindex="-1">▼</button>
            </div>
            <div class="dd-menu" id="fShipMenu"></div>
          </div>
        </div>

        <div class="field col-full">
          <label>Met person <span style="color:#9ca3af;font-weight:400;">(optional)</span></label>
          <input id="fMet" type="text" placeholder="e.g. store manager, owner, …">
        </div>

        <div class="field col-full">
          <label>Meeting notes <span class="req">*</span></label>
          <textarea id="fNotes" required placeholder="What happened — orders, complaints, conversation summary"></textarea>
        </div>

        <div class="field col-full">
          <label>Next action <span style="color:#9ca3af;font-weight:400;">(optional)</span></label>
          <input id="fNext" type="text" placeholder="Follow-up needed, deadline, …">
        </div>

        <div class="field col-full">
          <label>Feedback <span style="color:#9ca3af;font-weight:400;">(optional — can also be added later from the list below or from Map View)</span></label>
          <textarea id="fFeedback" placeholder="Manager / team feedback on this visit"></textarea>
        </div>

        <div class="field col-full">
          <label>Photos <span style="color:#9ca3af;font-weight:400;">(optional — up to 5, jpg/png/webp/heic)</span></label>
          <input id="fPhotos" type="file" accept="image/*" multiple capture="environment">
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn btn-primary">Submit</button>
        <span id="submitMsg"></span>
      </div>
    </form>
  </div>

  <!-- ── Recent entries ── -->
  <div class="card">
    <h2>Recent entries</h2>
    <div class="filt">
      <label>BDE</label>
      <select id="filtBde"><option value="">All</option></select>
      <label>Ship-to</label>
      <input id="filtShip" type="text" placeholder="e.g. A029737" style="width:140px;">
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>
    <div id="recentWrap"><div class="empty">Loading…</div></div>
  </div>

</div><!-- /planner-left -->

<div class="planner-right">

  <!-- ── Monthly calendar ── -->
  <div class="card">
    <div class="plan-toolbar">
      <button type="button" id="calPrev">‹</button>
      <span class="plan-month" id="calMonthLabel">…</span>
      <button type="button" id="calToday">Today</button>
      <button type="button" id="calNext">›</button>
    </div>
    <div id="calGrid" class="cal-grid"></div>
    <div style="font-size:10px;color:#9ca3af;margin-top:6px;">
      Tip: drag a ship-to chip from below onto a date.  Click a chip on the calendar to remove.
    </div>
  </div>

  <!-- ── Ship-to palette (drag source) ── -->
  <div class="card">
    <h2>Ship-to (drag onto calendar)</h2>

    <div style="margin-bottom:6px;">
      <label style="font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;">
        Sold-to <span style="color:#9ca3af;font-weight:400;text-transform:none;letter-spacing:0;">(optional — narrows the list below)</span>
      </label>
      <div class="dd" id="palSoldDd" style="width:100%;">
        <div class="dd-wrap">
          <input id="palSold" type="text" placeholder="Search sold-to…" autocomplete="off">
          <button class="dd-btn dd-clear-btn" type="button" id="palSoldClear" title="Clear" tabindex="-1">×</button>
          <button class="dd-btn dd-last" type="button" id="palSoldOpen" title="Show all" tabindex="-1">▼</button>
        </div>
        <div class="dd-menu" id="palSoldMenu"></div>
      </div>
    </div>

    <input id="shipSearch" class="palette-input" type="text"
           placeholder="Search ship-to by name or code…" autocomplete="off">
    <div class="palette-count" id="shipCount"></div>
    <div id="shipList" class="palette-list">
      <div class="palette-empty">Loading…</div>
    </div>
  </div>

</div><!-- /planner-right -->
</div><!-- /planner-layout -->

</div>

<script>
const fBde       = document.getElementById("fBde");
const fSold      = document.getElementById("fSold");
const fShip      = document.getElementById("fShip");
const fVisitDate = document.getElementById("fVisitDate");
const fForm      = document.getElementById("meetingForm");
const fMsg       = document.getElementById("submitMsg");
const filtBde    = document.getElementById("filtBde");
const filtShip   = document.getElementById("filtShip");

// Default visit date to today (editable so a BDE can log a past visit).
// Cap the picker at today so future dates can't be picked.
(function initVisitDate(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  fVisitDate.value = iso;
  fVisitDate.max   = iso;
})();

// ── Custom searchable dropdown ───────────────────────────────────
// options = [{label, value}, …].  bindPicker wires the input/button/menu
// so typing filters the list and clicking an item stores the chosen
// value on `picker.value`.  Same UX as the dashboard's bindDropdown but
// trimmed to just what /meeting needs (single-select, no chips).
function ddOpen(menu){ menu.style.display = "block"; }
function ddClose(menu){ menu.style.display = "none"; }
function ddRender(menu, items, onPick){
  menu.innerHTML = "";
  if (!items || !items.length){
    const div = document.createElement("div");
    div.className = "dd-empty"; div.textContent = "No matches";
    menu.appendChild(div); return;
  }
  items.slice(0, 500).forEach(opt => {
    const div = document.createElement("div");
    div.className = "dd-item";
    div.textContent = opt.label;
    div.addEventListener("mousedown", (e) => {
      e.preventDefault(); onPick(opt); ddClose(menu);
    });
    menu.appendChild(div);
  });
}
function ddFilter(opts, q){
  const s = (q || "").trim().toLowerCase();
  if (!s) return opts;
  return opts.filter(o => o.label.toLowerCase().includes(s));
}

function bindPicker({inputId, openBtnId, clearBtnId, menuId, onChange}){
  const inp  = document.getElementById(inputId);
  const open = document.getElementById(openBtnId);
  const clr  = document.getElementById(clearBtnId);
  const menu = document.getElementById(menuId);
  const ddEl = inp.closest(".dd");

  const state = { options: [], value: "", label: "" };

  function setActive(on){ if (ddEl) ddEl.classList.toggle("dd-active", !!on); }

  function pick(opt){
    state.value = opt.value;
    state.label = opt.label;
    inp.value   = opt.label;
    setActive(true);
    if (onChange) onChange(opt);
  }

  function showAll(){ ddRender(menu, state.options, pick); ddOpen(menu); }
  function showFiltered(){ ddRender(menu, ddFilter(state.options, inp.value), pick); ddOpen(menu); }

  open.addEventListener("click", () => showAll());
  inp.addEventListener("focus", () => showFiltered());
  inp.addEventListener("input", () => {
    // typing invalidates the previous pick until they actually select again
    state.value = "";
    setActive(false);
    showFiltered();
  });
  clr.addEventListener("click", () => {
    state.value = ""; state.label = ""; inp.value = "";
    setActive(false); ddClose(menu);
    if (onChange) onChange(null);
  });
  document.addEventListener("mousedown", (e) => {
    if (!menu.contains(e.target) && e.target !== inp
        && e.target !== open && e.target !== clr){
      ddClose(menu);
    }
  });

  const api = {
    setOptions(opts){ state.options = opts || []; api.__options = state.options; },
    setDisabled(b){
      inp.disabled = b; open.disabled = b; clr.disabled = b;
      if (b){ state.value = ""; state.label = ""; inp.value = ""; setActive(false); }
    },
    setValue(opt){
      // Programmatic pick — same effect as a user click but skips the
      // onChange callback so we don't trigger cascades on auto-fill.
      if (!opt) return;
      state.value = opt.value;
      state.label = opt.label;
      inp.value   = opt.label;
      setActive(true);
    },
    value(){ return state.value; },
    label(){ return state.label; },
    reset(){
      state.value = ""; state.label = ""; inp.value = "";
      setActive(false); ddClose(menu);
    },
    __options: [],
  };
  return api;
}

const soldPicker = bindPicker({
  inputId: "fSold", openBtnId: "fSoldOpen",
  clearBtnId: "fSoldClear", menuId: "fSoldMenu",
  onChange: (opt) => loadShipTosFor(opt ? opt.value : ""),
});
const shipPicker = bindPicker({
  inputId: "fShip", openBtnId: "fShipOpen",
  clearBtnId: "fShipClear", menuId: "fShipMenu",
  onChange: (opt) => {
    // Picking a ship-to directly: when Sold-to is empty, auto-fill it
    // from the ship-to's parent so the form shows the full chain.
    // (Server-side resolves sold_to from ship_to anyway, but this
    // keeps the UI honest.)
    if (!opt || soldPicker.value()) return;
    const meta = _shipToParent.get(opt.value);
    if (meta && meta.sold_to_name){
      const sel = (soldPicker.__options || []).find(o => o.value === meta.sold_to_name);
      if (sel) soldPicker.setValue(sel);
    }
  },
});
const _shipToParent = new Map(); // ship_to → {sold_to, sold_to_name}

async function fetchJSON(url){
  const r = await fetch(url, {credentials: "include"});
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}

// Auto-fill the BDE picker from /api/bdes_active.  If Cloudflare Access
// gave us an authenticated email (via the Cf-Access-Authenticated-User-Email
// header on the page request), match it to a BDE name; otherwise the user
// picks manually.  The email shown is for transparency only.
async function loadBdes(){
  const list = await fetchJSON("/api/bdes_active").catch(() => []);
  const opts = ['<option value="">— select —</option>',
                ...list.map(n => `<option value="${n}">${n}</option>`)];
  fBde.innerHTML    = opts.join("");
  filtBde.innerHTML = ['<option value="">All</option>',
                       ...list.map(n => `<option value="${n}">${n}</option>`)].join("");

  // Auto-fill the BDE dropdown with the signed-in user (any role).
  // For BDE role we also disable the dropdown so they can't submit
  // on someone else's behalf.  SM / ALL stay editable.
  try {
    const who = await fetchJSON("/api/whoami").catch(() => null);
    if (who && who.logged_in && who.name){
      // Add the user as an option if it isn't already present
      if (![...fBde.options].some(o => o.value === who.name)){
        fBde.add(new Option(who.name, who.name));
      }
      fBde.value = who.name;
      if (who.role === "BDE"){
        fBde.disabled = true;
        fBde.title = `Locked: ${who.name} (BDE)`;
      }
    }
  } catch (e) { /* whoami optional — manual pick still works */ }
}

async function loadSoldTos(){
  // /api/sold_to_names returns an array of sold_to NAMES (the cascade
  // expects the picked NAME as ?sold_to=… on /api/ship_to_names), so
  // label == value for this picker.
  const list = await fetchJSON("/api/sold_to_names?metric=amt").catch(() => []);
  const opts = list
    .filter(n => n)
    .map(n => ({ label: n, value: n }));
  soldPicker.setOptions(opts);
}

async function loadShipTosFor(soldToName){
  // Empty soldToName = load all ship-tos (no parent filter).  Ship-to
  // picker stays enabled either way — the user can pick a ship-to
  // without first choosing a Sold-to.
  shipPicker.setDisabled(false);
  document.getElementById("fShip").placeholder = "Loading…";
  const params = { metric: "amt" };
  if (soldToName) params.sold_to = soldToName;
  const qs = new URLSearchParams(params).toString();
  const list = await fetchJSON("/api/ship_to_names?" + qs).catch(() => []);
  const opts = [];
  for (const row of list){
    const code = (row && (row.code || row.ship_to)) || "";
    const name = (row && (row.name || row.ship_to_name)) || "";
    if (!code) continue;
    opts.push({ label: name ? `${code} — ${name}` : code, value: code });
  }
  shipPicker.setOptions(opts);
  document.getElementById("fShip").placeholder = soldToName
    ? `Search ship-to (within ${soldToName})…`
    : "Search ship-to…";

  // If we just loaded the full list, refresh the ship_to → parent
  // sold-to map so picking a ship directly can auto-fill Sold-to.
  if (!soldToName){
    _shipToParent.clear();
    // /api/ship_to_names without a sold-to param doesn't return sold_to
    // info, so fetch a separate batch with names attached.
    try {
      const r = await fetchJSON("/api/meeting_plan/shop_to_options").catch(() => []);
      for (const row of (r || [])){
        if (row.ship_to){
          _shipToParent.set(row.ship_to, {
            sold_to:      row.sold_to || "",
            sold_to_name: row.sold_to_name || "",
          });
        }
      }
    } catch(e) { /* non-fatal */ }
  }
}

async function loadRecent(){
  const wrap = document.getElementById("recentWrap");
  wrap.innerHTML = '<div class="empty">Loading…</div>';
  const qs = new URLSearchParams();
  if (filtBde.value)  qs.set("bde",     filtBde.value);
  if (filtShip.value) qs.set("ship_to", filtShip.value.trim());
  qs.set("limit", "100");
  const rows = await fetchJSON("/api/meeting/list?" + qs.toString()).catch(() => []);
  if (!Array.isArray(rows) || !rows.length){
    wrap.innerHTML = '<div class="empty">No entries yet.</div>';
    return;
  }
  let h = `<table class="recent-tbl">
    <thead><tr>
      <th>Visit date</th><th>BDE</th><th>Shop</th><th>Notes / Next / Feedback</th><th>Photos</th>
    </tr></thead><tbody>`;
  for (const r of rows){
    const photos = (r.photo_paths || [])
      .map(p => `<a href="${p}" target="_blank"><img src="${p}" alt=""></a>`)
      .join("");
    const next = r.next_action ? `<div style="color:#6b7280;font-size:11px;margin-top:3px;">→ ${escapeHtml(r.next_action)}</div>` : "";
    const met  = r.met_person  ? `<div style="color:#9ca3af;font-size:11px;margin-top:2px;">met: ${escapeHtml(r.met_person)}</div>` : "";
    // Feedback block: shows the value if set, with an Edit pencil; if
    // empty, shows an "+ Add feedback" link.  Inline form swaps in via
    // toggleFeedbackEditor(id).
    const fbBlock = renderFeedbackBlock(r.id, r.thread || []);
    h += `<tr>
      <td class="ts">${r.visit_date || r.created_at}</td>
      <td class="bde">${escapeHtml(r.bde_name || "—")}</td>
      <td class="shop">${escapeHtml(r.ship_to)}<br><span style="color:#6b7280;font-size:11px;">${escapeHtml(r.ship_to_name || "")}</span></td>
      <td class="notes">${escapeHtml(r.notes || "")}${next}${met}${fbBlock}</td>
      <td class="photos">${photos}</td>
    </tr>`;
  }
  h += `</tbody></table>`;
  wrap.innerHTML = h;
}

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Feedback thread — list of comments + an "Add feedback" composer.
// People dropdown is preloaded once from /api/people so commenters
// can pick their identity (BDE / SM / Hayden / JJ).
let _peopleCache = null;
async function _ensurePeople(){
  if (_peopleCache) return _peopleCache;
  _peopleCache = await fetchJSON("/api/people").catch(() => []);
  return _peopleCache;
}
function _peopleOptions(){
  return (_peopleCache || []).map(p =>
    `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`
  ).join("");
}

function renderFeedbackBlock(rid, thread){
  const items = (thread || []).map(t => `
    <div style="margin-bottom:6px;">
      <div style="font-size:10px;color:#6b7280;margin-bottom:2px;">
        <b>${escapeHtml(t.author_name || t.author_email || "—")}</b>
        · ${escapeHtml(t.created_at || "")}
      </div>
      <div style="padding:5px 9px;background:#fef3c7;border-left:3px solid #f59e0b;
                  border-radius:3px;font-size:12px;color:#78350f;white-space:pre-wrap;">
        ${escapeHtml(t.text || "")}
      </div>
    </div>`).join("");
  return `<div id="fb-${rid}" style="margin-top:6px;">
    ${items}
    <a href="javascript:void(0)" onclick="openFeedbackComposer(${rid})"
       style="font-size:11px;color:#2563eb;">+ Add feedback</a>
  </div>`;
}
async function openFeedbackComposer(rid){
  await _ensurePeople();
  const el = document.getElementById("fb-" + rid);
  if (!el) return;
  // Preserve the existing thread above the composer so it stays visible.
  const above = el.innerHTML.replace(/<a [^>]*onclick="openFeedbackComposer[\s\S]*?<\/a>/, "");
  el.innerHTML = above + `
    <div style="margin-top:4px;padding:8px;background:#f9fafb;
                border:1px solid #e5e7eb;border-radius:5px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">
        <span style="font-size:10px;color:#6b7280;font-weight:600;">FROM</span>
        <select id="fbWho-${rid}" style="font-size:12px;padding:3px 6px;
                border:1px solid #d1d5db;border-radius:4px;">
          <option value="">— select —</option>${_peopleOptions()}
        </select>
      </div>
      <textarea id="fbInp-${rid}"
        placeholder="Your reply…"
        style="width:100%;min-height:54px;font-size:12px;padding:6px;
               border:1px solid #d1d5db;border-radius:4px;font-family:inherit;"
      ></textarea>
      <div style="margin-top:5px;display:flex;gap:6px;">
        <button type="button" onclick="saveFeedback(${rid})"
          style="font-size:11px;padding:3px 12px;background:#2563eb;color:#fff;
                 border:none;border-radius:4px;cursor:pointer;">Post</button>
        <button type="button" onclick="loadRecent()"
          style="font-size:11px;padding:3px 10px;background:#fff;color:#374151;
                 border:1px solid #d1d5db;border-radius:4px;cursor:pointer;">Cancel</button>
      </div>
    </div>`;
}
async function saveFeedback(rid){
  const who = document.getElementById("fbWho-" + rid);
  const inp = document.getElementById("fbInp-" + rid);
  if (!who || !inp) return;
  if (!who.value){ alert("Please pick who you are."); return; }
  if (!inp.value.trim()){ alert("Type a comment first."); return; }
  try {
    const r = await fetch("/api/meeting/feedback", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      credentials: "include",
      body: JSON.stringify({ id: rid, text: inp.value, author_name: who.value }),
    });
    const j = await r.json();
    if (!r.ok || j.error){ alert("Save failed: " + (j.error || r.status)); return; }
    loadRecent();
  } catch (err){ alert("Error: " + err.message); }
}

fForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!fBde.value)         { fMsg.textContent = "BDE is required";      fMsg.className = "err"; return; }
  if (!shipPicker.value()) { fMsg.textContent = "Ship-to is required";  fMsg.className = "err"; return; }
  // Sold-to is optional — the server resolves it from the picked
  // ship-to (and stores both code + name for display).

  fMsg.textContent = "Submitting…"; fMsg.className = "";
  const fd = new FormData();
  fd.append("bde_name",    fBde.value);
  fd.append("visit_date",  fVisitDate.value);
  fd.append("sold_to",     soldPicker.value());
  fd.append("ship_to",     shipPicker.value());
  fd.append("met_person",  document.getElementById("fMet").value);
  fd.append("notes",       document.getElementById("fNotes").value);
  fd.append("next_action", document.getElementById("fNext").value);
  fd.append("feedback",    document.getElementById("fFeedback").value);
  const files = document.getElementById("fPhotos").files;
  for (let i = 0; i < Math.min(files.length, 5); i++){
    fd.append("photos", files[i]);
  }
  try {
    const r = await fetch("/api/meeting", { method:"POST", body: fd, credentials:"include" });
    const j = await r.json();
    if (!r.ok || j.error){
      fMsg.textContent = "Failed: " + (j.error || r.status);
      fMsg.className = "err";
      return;
    }
    fMsg.textContent = `Saved (#${j.id})`;
    fMsg.className = "ok";
    // Reset writable fields, keep BDE selection.
    document.getElementById("fNotes").value    = "";
    document.getElementById("fNext").value     = "";
    document.getElementById("fMet").value      = "";
    document.getElementById("fFeedback").value = "";
    document.getElementById("fPhotos").value   = "";
    shipPicker.reset();
    loadRecent();
    setTimeout(() => { fMsg.textContent = ""; }, 4000);
  } catch (err) {
    fMsg.textContent = "Error: " + err.message;
    fMsg.className = "err";
  }
});

document.getElementById("btnRefresh").addEventListener("click", loadRecent);
filtBde.addEventListener("change", loadRecent);
filtShip.addEventListener("change", loadRecent);

// ──────────────────────────────────────────────────────────────────
// Calendar planner + ship-to palette with drag-and-drop
// ──────────────────────────────────────────────────────────────────
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Current month being viewed.
const _calState = { year: (new Date()).getFullYear(), month: (new Date()).getMonth() + 1 };
let _planRowsByDate = {};   // "YYYY-MM-DD" → [ {id, ship_to, ship_to_name, bde_name}, … ]
let _shipOptions    = [];   // [{ship_to, ship_to_name, sold_to, sold_to_name}, …]

function _isoDate(y, m, d) {
  const pad = n => String(n).padStart(2,"0");
  return `${y}-${pad(m)}-${pad(d)}`;
}

async function loadPlansForMonth(){
  const qs = new URLSearchParams({year: _calState.year, month: _calState.month}).toString();
  const rows = await fetchJSON("/api/meeting_plan?" + qs).catch(() => []);
  _planRowsByDate = {};
  for (const r of (rows || [])) {
    const d = r.plan_date;
    if (!d) continue;
    (_planRowsByDate[d] = _planRowsByDate[d] || []).push(r);
  }
}

function renderCalendar(){
  const root = document.getElementById("calGrid");
  const label = document.getElementById("calMonthLabel");
  if (!root) return;
  const {year, month} = _calState;
  if (label) label.textContent = `${MONTHS[month-1]} ${year}`;

  // First day of month, total days, grid starting on Sunday.
  const first    = new Date(year, month - 1, 1);
  const dow      = first.getDay();   // 0=Sun
  const daysInM  = new Date(year, month, 0).getDate();
  const todayIso = (() => { const t = new Date();
    return _isoDate(t.getFullYear(), t.getMonth()+1, t.getDate()); })();

  let html = "";
  for (const w of WEEKDAYS) html += `<div class="cal-head">${w}</div>`;
  // Leading blanks
  for (let i = 0; i < dow; i++) html += `<div class="cal-cell dim"></div>`;
  // Day cells
  for (let d = 1; d <= daysInM; d++) {
    const iso = _isoDate(year, month, d);
    const isToday = (iso === todayIso) ? " today" : "";
    const chips = (_planRowsByDate[iso] || []).map(r => `
      <div class="plan-chip" data-id="${r.id}" title="${_attr(r.ship_to_name || r.ship_to)} — ${_attr(r.bde_name)}">
        <span>${escapeHtml((r.ship_to_name || r.ship_to).slice(0, 18))}</span>
        <span class="pc-rm">×</span>
      </div>`).join("");
    html += `<div class="cal-cell${isToday}" data-date="${iso}">
      <span class="d-num">${d}</span>
      <div class="chips">${chips}</div>
    </div>`;
  }
  // Trailing blanks to fill last row (optional, keeps grid even)
  const cellsUsed = dow + daysInM;
  const trailing  = (7 - (cellsUsed % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="cal-cell dim"></div>`;
  root.innerHTML = html;

  // Wire drop targets
  root.querySelectorAll(".cal-cell[data-date]").forEach(cell => {
    cell.addEventListener("dragover", (e) => {
      e.preventDefault();
      cell.classList.add("drag-over");
    });
    cell.addEventListener("dragleave", () => cell.classList.remove("drag-over"));
    cell.addEventListener("drop", async (e) => {
      e.preventDefault();
      cell.classList.remove("drag-over");
      const ship = e.dataTransfer.getData("text/ship_to");
      const date = cell.dataset.date;
      if (!ship || !date) return;
      const bde = (window._me && window._me.lock_salesman) || document.getElementById("fBde").value || "";
      try {
        const r = await fetch("/api/meeting_plan", {
          method:"POST", headers:{"Content-Type":"application/json"},
          credentials:"include",
          body: JSON.stringify({ date, ship_to: ship, bde_name: bde }),
        });
        const j = await r.json();
        if (!r.ok || j.error){ alert("Failed: " + (j.error || r.status)); return; }
        await loadPlansForMonth();
        renderCalendar();
      } catch (err) { alert("Error: " + err.message); }
    });
  });
  // Click chip to remove
  root.querySelectorAll(".plan-chip").forEach(c => {
    c.addEventListener("click", async () => {
      const id = c.dataset.id;
      if (!id) return;
      if (!confirm("Remove this planned visit?")) return;
      try {
        const r = await fetch(`/api/meeting_plan/${id}`, {
          method:"DELETE", credentials:"include",
        });
        const j = await r.json();
        if (!r.ok || j.error){ alert("Delete failed: " + (j.error || r.status)); return; }
        await loadPlansForMonth();
        renderCalendar();
      } catch (err) { alert("Error: " + err.message); }
    });
  });
}

// Palette-side Sold-to filter (mirrors the New-visit form's
// cascade): picking a Sold-to narrows the ship-to chip list to
// children of that parent.  Optional — leaving it empty shows
// every ship-to.
let _palSoldFilter = "";
const palSoldPicker = bindPicker({
  inputId: "palSold", openBtnId: "palSoldOpen",
  clearBtnId: "palSoldClear", menuId: "palSoldMenu",
  onChange: (opt) => {
    _palSoldFilter = opt ? opt.value : "";
    renderShipList();
  },
});

async function loadShipOptions(){
  const rows = await fetchJSON("/api/meeting_plan/shop_to_options").catch(() => []);
  _shipOptions = Array.isArray(rows) ? rows : [];

  // Build the Sold-to filter options from the unique sold-to names
  // that appear in the ship list.  Each option's value is the sold_to
  // NAME (matches how we filter below).
  const soldOpts = [];
  const seen = new Set();
  for (const r of _shipOptions){
    const nm = (r.sold_to_name || "").trim();
    if (!nm || seen.has(nm)) continue;
    seen.add(nm);
    soldOpts.push({ label: nm, value: nm });
  }
  soldOpts.sort((a, b) => a.label.localeCompare(b.label));
  palSoldPicker.setOptions(soldOpts);

  renderShipList();
}

function renderShipList(){
  const list = document.getElementById("shipList");
  const cnt  = document.getElementById("shipCount");
  const q    = (document.getElementById("shipSearch").value || "").trim().toLowerCase();
  // Apply the Sold-to filter first (narrow domain), then the text
  // search on top.
  const base = _palSoldFilter
    ? _shipOptions.filter(r => (r.sold_to_name || "") === _palSoldFilter)
    : _shipOptions;
  const filtered = !q ? base.slice(0, 200)
    : base.filter(r =>
        (r.ship_to || "").toLowerCase().includes(q) ||
        (r.ship_to_name || "").toLowerCase().includes(q) ||
        (r.sold_to_name || "").toLowerCase().includes(q)
      ).slice(0, 200);
  if (cnt) {
    const total = base.length;
    if (q) {
      cnt.textContent = `${filtered.length} of ${total} match` +
                        (_palSoldFilter ? ` (in ${_palSoldFilter})` : "");
    } else {
      cnt.textContent = `${total} ship-tos` +
                        (_palSoldFilter ? ` in ${_palSoldFilter}` : "") +
                        (total > 200 ? " (showing first 200)" : "");
    }
  }
  if (!filtered.length){
    list.innerHTML = '<div class="palette-empty">No matches</div>';
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="ship-chip" draggable="true" data-ship="${_attr(r.ship_to)}"
         title="${_attr(r.sold_to_name || '')} — ${_attr(r.ship_to_name || '')}">
      <span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.ship_to_name || r.ship_to)}</span>
      <span class="sc-code">${escapeHtml(r.ship_to)}</span>
    </div>`).join("");
  list.querySelectorAll(".ship-chip").forEach(el => {
    el.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/ship_to", el.dataset.ship);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
}

function _attr(s){
  return String(s == null ? "" : s).replace(/"/g, "&quot;").replace(/&/g, "&amp;");
}

document.getElementById("calPrev").addEventListener("click", async () => {
  _calState.month -= 1;
  if (_calState.month < 1){ _calState.month = 12; _calState.year -= 1; }
  await loadPlansForMonth(); renderCalendar();
});
document.getElementById("calNext").addEventListener("click", async () => {
  _calState.month += 1;
  if (_calState.month > 12){ _calState.month = 1; _calState.year += 1; }
  await loadPlansForMonth(); renderCalendar();
});
document.getElementById("calToday").addEventListener("click", async () => {
  const t = new Date();
  _calState.year = t.getFullYear();
  _calState.month = t.getMonth() + 1;
  await loadPlansForMonth(); renderCalendar();
});
document.getElementById("shipSearch").addEventListener("input", renderShipList);

(async () => {
  await loadBdes();
  await loadSoldTos();
  // Pre-load ALL ship-tos so the picker is usable without first
  // selecting a Sold-to.  Also primes _shipToParent so picking a
  // ship-to directly can auto-fill its parent Sold-to.
  await loadShipTosFor("");
  await loadRecent();
  await loadShipOptions();
  await loadPlansForMonth();
  renderCalendar();
})();
</script>
