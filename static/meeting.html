<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDE Visit Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;font-size:13px}
header{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:14px;font-weight:700}
header .sub{font-size:10px;opacity:.55}
header .nav{margin-left:auto;display:flex;gap:6px}
.btn{border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;border:1px solid #d1d5db;background:#fff;color:#374151}
.btn:hover{background:#f9fafb}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn.active{background:#374151;color:#fff;border-color:#374151}
.container{padding:14px 16px;max-width:980px;margin:0 auto}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
.card h2{font-size:13px;font-weight:700;color:#1e3a5f;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:#6b7280;font-weight:600}
.field label .req{color:#dc2626}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%;background:#fff}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#2563eb}
.field.col-full{grid-column:1/-1}
.bde-id-line{font-size:11px;color:#6b7280;padding:6px 9px;background:#f3f4f6;border-radius:6px;margin-bottom:6px}
.bde-id-line b{color:#1e3a5f}
.submit-row{display:flex;gap:10px;align-items:center;margin-top:8px}
#submitMsg{font-size:12px}
#submitMsg.ok{color:#16a34a}
#submitMsg.err{color:#dc2626}

/* ── Custom searchable dropdown (same UX as the rest of the dashboard) ── */
.dd{position:relative;display:flex;flex-direction:column;gap:3px;width:100%}
.dd-wrap{display:flex;align-items:stretch;width:100%}
.dd-wrap input{
  flex:1;min-width:0;padding:7px 9px;
  border:1px solid #d1d5db;border-right:none;border-radius:6px 0 0 6px;
  font-size:13px;color:#374151;background:#fff;outline:none;
  transition:border-color .12s,background .12s
}
.dd-wrap input:focus{border-color:#2563eb}
.dd-wrap input:disabled{opacity:.55;cursor:not-allowed;background:#f3f4f6}
.dd-btn{
  padding:5px 9px;border:1px solid #d1d5db;border-right:none;
  background:#f3f4f6;cursor:pointer;font-size:11px;color:#6b7280;
  transition:background .12s;user-select:none
}
.dd-btn:hover:not(:disabled){background:#e5e7eb}
.dd-btn:disabled{opacity:.5;cursor:not-allowed}
.dd-btn.dd-clear-btn{color:#9ca3af}
.dd-btn.dd-clear-btn:hover{background:#fee2e2;color:#ef4444}
.dd-btn.dd-last{border-right:1px solid #d1d5db;border-radius:0 6px 6px 0}
.dd.dd-active .dd-wrap input{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600}
.dd.dd-active .dd-btn{border-color:#2563eb;background:#dbeafe;color:#1d4ed8}
.dd-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  max-height:280px;overflow:auto;background:#fff;
  border:1px solid #e5e7eb;border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:9999;display:none
}
.dd-item{padding:7px 10px;cursor:pointer;white-space:nowrap;font-size:12px;color:#374151;overflow:hidden;text-overflow:ellipsis}
.dd-item:hover,.dd-item.dd-item-active{background:#eff6ff;color:#2563eb}
.dd-empty{padding:10px;color:#9ca3af;font-size:12px}
.recent-tbl{width:100%;border-collapse:collapse;font-size:12px}
.recent-tbl th{background:#f8fafc;color:#374151;font-size:11px;font-weight:600;padding:6px 8px;text-align:left;border-bottom:1px solid #e5e7eb}
.recent-tbl td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.recent-tbl tr:hover td{background:#fafafa}
.recent-tbl .ts{color:#6b7280;font-size:11px;white-space:nowrap}
.recent-tbl .bde{font-weight:600;color:#1e3a5f}
.recent-tbl .shop{color:#374151}
.recent-tbl .notes{color:#111827}
.recent-tbl .photos a{display:inline-block;margin-right:4px}
.recent-tbl .photos img{width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid #e5e7eb}
.empty{padding:18px;text-align:center;color:#9ca3af;font-size:12px}
.filt{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filt label{font-size:11px;color:#6b7280}
.filt select,.filt input{border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>BDE Visit Log</h1>
  <span class="sub">post-visit memo · 1 min</span>
  <div class="nav">
    <button class="btn" onclick="location.href='/'">Graph View</button>
    <button class="btn" onclick="location.href='/map'">Map View</button>
    <button class="btn" onclick="location.href='/stock'">Stock</button>
    <button class="btn" onclick="location.href='/rebate'">Rebate</button>
    <button class="btn" onclick="location.href='/price'">Price</button>
    <button class="btn active">Meeting</button>
  </div>
</header>

<div class="container">

  <!-- ── New entry form ── -->
  <div class="card">
    <h2>New visit</h2>
    <div id="bdeIdLine" class="bde-id-line" style="display:none;">
      Signed in as <b id="bdeIdEmail">…</b>
    </div>

    <form id="meetingForm">
      <div class="grid">
        <div class="field">
          <label>BDE <span class="req">*</span></label>
          <select id="fBde" required>
            <option value="">— select —</option>
          </select>
        </div>
        <div class="field">
          <label>Visit date <span class="req">*</span></label>
          <input id="fVisitDate" type="date" required>
        </div>

        <div class="field">
          <label>Sold-to <span class="req">*</span></label>
          <div class="dd" id="ddSold">
            <div class="dd-wrap">
              <input id="fSold" type="text" placeholder="Search sold-to…" autocomplete="off">
              <button class="dd-btn dd-clear-btn" type="button" id="fSoldClear" title="Clear" tabindex="-1">×</button>
              <button class="dd-btn dd-last" type="button" id="fSoldOpen" title="Show all" tabindex="-1">▼</button>
            </div>
            <div class="dd-menu" id="fSoldMenu"></div>
          </div>
        </div>
        <div class="field">
          <label>Ship-to <span class="req">*</span></label>
          <div class="dd" id="ddShip">
            <div class="dd-wrap">
              <input id="fShip" type="text" placeholder="— pick sold-to first —" autocomplete="off" disabled>
              <button class="dd-btn dd-clear-btn" type="button" id="fShipClear" title="Clear" tabindex="-1" disabled>×</button>
              <button class="dd-btn dd-last" type="button" id="fShipOpen" title="Show all" tabindex="-1" disabled>▼</button>
            </div>
            <div class="dd-menu" id="fShipMenu"></div>
          </div>
        </div>

        <div class="field col-full">
          <label>Met person <span style="color:#9ca3af;font-weight:400;">(optional)</span></label>
          <input id="fMet" type="text" placeholder="e.g. store manager, owner, …">
        </div>

        <div class="field col-full">
          <label>Meeting notes <span class="req">*</span></label>
          <textarea id="fNotes" required placeholder="What happened — orders, complaints, conversation summary"></textarea>
        </div>

        <div class="field col-full">
          <label>Next action <span style="color:#9ca3af;font-weight:400;">(optional)</span></label>
          <input id="fNext" type="text" placeholder="Follow-up needed, deadline, …">
        </div>

        <div class="field col-full">
          <label>Feedback <span style="color:#9ca3af;font-weight:400;">(optional — can also be added later from the list below or from Map View)</span></label>
          <textarea id="fFeedback" placeholder="Manager / team feedback on this visit"></textarea>
        </div>

        <div class="field col-full">
          <label>Photos <span style="color:#9ca3af;font-weight:400;">(optional — up to 5, jpg/png/webp/heic)</span></label>
          <input id="fPhotos" type="file" accept="image/*" multiple capture="environment">
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn btn-primary">Submit</button>
        <span id="submitMsg"></span>
      </div>
    </form>
  </div>

  <!-- ── Recent entries ── -->
  <div class="card">
    <h2>Recent entries</h2>
    <div class="filt">
      <label>BDE</label>
      <select id="filtBde"><option value="">All</option></select>
      <label>Ship-to</label>
      <input id="filtShip" type="text" placeholder="e.g. A029737" style="width:140px;">
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>
    <div id="recentWrap"><div class="empty">Loading…</div></div>
  </div>

</div>

<script>
const fBde       = document.getElementById("fBde");
const fSold      = document.getElementById("fSold");
const fShip      = document.getElementById("fShip");
const fVisitDate = document.getElementById("fVisitDate");
const fForm      = document.getElementById("meetingForm");
const fMsg       = document.getElementById("submitMsg");
const filtBde    = document.getElementById("filtBde");
const filtShip   = document.getElementById("filtShip");

// Default visit date to today (editable so a BDE can log a past visit).
// Cap the picker at today so future dates can't be picked.
(function initVisitDate(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  fVisitDate.value = iso;
  fVisitDate.max   = iso;
})();

// ── Custom searchable dropdown ───────────────────────────────────
// options = [{label, value}, …].  bindPicker wires the input/button/menu
// so typing filters the list and clicking an item stores the chosen
// value on `picker.value`.  Same UX as the dashboard's bindDropdown but
// trimmed to just what /meeting needs (single-select, no chips).
function ddOpen(menu){ menu.style.display = "block"; }
function ddClose(menu){ menu.style.display = "none"; }
function ddRender(menu, items, onPick){
  menu.innerHTML = "";
  if (!items || !items.length){
    const div = document.createElement("div");
    div.className = "dd-empty"; div.textContent = "No matches";
    menu.appendChild(div); return;
  }
  items.slice(0, 500).forEach(opt => {
    const div = document.createElement("div");
    div.className = "dd-item";
    div.textContent = opt.label;
    div.addEventListener("mousedown", (e) => {
      e.preventDefault(); onPick(opt); ddClose(menu);
    });
    menu.appendChild(div);
  });
}
function ddFilter(opts, q){
  const s = (q || "").trim().toLowerCase();
  if (!s) return opts;
  return opts.filter(o => o.label.toLowerCase().includes(s));
}

function bindPicker({inputId, openBtnId, clearBtnId, menuId, onChange}){
  const inp  = document.getElementById(inputId);
  const open = document.getElementById(openBtnId);
  const clr  = document.getElementById(clearBtnId);
  const menu = document.getElementById(menuId);
  const ddEl = inp.closest(".dd");

  const state = { options: [], value: "", label: "" };

  function setActive(on){ if (ddEl) ddEl.classList.toggle("dd-active", !!on); }

  function pick(opt){
    state.value = opt.value;
    state.label = opt.label;
    inp.value   = opt.label;
    setActive(true);
    if (onChange) onChange(opt);
  }

  function showAll(){ ddRender(menu, state.options, pick); ddOpen(menu); }
  function showFiltered(){ ddRender(menu, ddFilter(state.options, inp.value), pick); ddOpen(menu); }

  open.addEventListener("click", () => showAll());
  inp.addEventListener("focus", () => showFiltered());
  inp.addEventListener("input", () => {
    // typing invalidates the previous pick until they actually select again
    state.value = "";
    setActive(false);
    showFiltered();
  });
  clr.addEventListener("click", () => {
    state.value = ""; state.label = ""; inp.value = "";
    setActive(false); ddClose(menu);
    if (onChange) onChange(null);
  });
  document.addEventListener("mousedown", (e) => {
    if (!menu.contains(e.target) && e.target !== inp
        && e.target !== open && e.target !== clr){
      ddClose(menu);
    }
  });

  return {
    setOptions(opts){ state.options = opts || []; },
    setDisabled(b){
      inp.disabled = b; open.disabled = b; clr.disabled = b;
      if (b){ state.value = ""; state.label = ""; inp.value = ""; setActive(false); }
    },
    value(){ return state.value; },
    label(){ return state.label; },
    reset(){
      state.value = ""; state.label = ""; inp.value = "";
      setActive(false); ddClose(menu);
    },
  };
}

const soldPicker = bindPicker({
  inputId: "fSold", openBtnId: "fSoldOpen",
  clearBtnId: "fSoldClear", menuId: "fSoldMenu",
  onChange: (opt) => loadShipTosFor(opt ? opt.value : ""),
});
const shipPicker = bindPicker({
  inputId: "fShip", openBtnId: "fShipOpen",
  clearBtnId: "fShipClear", menuId: "fShipMenu",
});

async function fetchJSON(url){
  const r = await fetch(url, {credentials: "include"});
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}

// Auto-fill the BDE picker from /api/bdes_active.  If Cloudflare Access
// gave us an authenticated email (via the Cf-Access-Authenticated-User-Email
// header on the page request), match it to a BDE name; otherwise the user
// picks manually.  The email shown is for transparency only.
async function loadBdes(){
  const list = await fetchJSON("/api/bdes_active").catch(() => []);
  const opts = ['<option value="">— select —</option>',
                ...list.map(n => `<option value="${n}">${n}</option>`)];
  fBde.innerHTML    = opts.join("");
  filtBde.innerHTML = ['<option value="">All</option>',
                       ...list.map(n => `<option value="${n}">${n}</option>`)].join("");

  // If the server can see who's logged in via CF Access we surface it
  // here.  No header → just leave the manual picker.
  // (Page won't have the CF header itself, but a quick ping endpoint
  // would; for now this stays manual until we add /api/whoami.)
}

async function loadSoldTos(){
  // /api/sold_to_names returns an array of sold_to NAMES (the cascade
  // expects the picked NAME as ?sold_to=… on /api/ship_to_names), so
  // label == value for this picker.
  const list = await fetchJSON("/api/sold_to_names?metric=amt").catch(() => []);
  const opts = list
    .filter(n => n)
    .map(n => ({ label: n, value: n }));
  soldPicker.setOptions(opts);
}

async function loadShipTosFor(soldToName){
  if (!soldToName){
    shipPicker.setOptions([]);
    shipPicker.setDisabled(true);
    document.getElementById("fShip").placeholder = "— pick sold-to first —";
    return;
  }
  shipPicker.setDisabled(false);
  document.getElementById("fShip").placeholder = "Loading…";
  const qs = new URLSearchParams({ sold_to: soldToName, metric: "amt" }).toString();
  // /api/ship_to_names returns [{code, name}, …] filtered by the picked
  // sold-to name.  We store the CODE so the dashboard can join cleanly,
  // but the label keeps both for searchability.
  const list = await fetchJSON("/api/ship_to_names?" + qs).catch(() => []);
  const opts = [];
  for (const row of list){
    const code = (row && (row.code || row.ship_to)) || "";
    const name = (row && (row.name || row.ship_to_name)) || "";
    if (!code) continue;
    opts.push({ label: name ? `${code} — ${name}` : code, value: code });
  }
  shipPicker.setOptions(opts);
  document.getElementById("fShip").placeholder = "Search ship-to…";
}

async function loadRecent(){
  const wrap = document.getElementById("recentWrap");
  wrap.innerHTML = '<div class="empty">Loading…</div>';
  const qs = new URLSearchParams();
  if (filtBde.value)  qs.set("bde",     filtBde.value);
  if (filtShip.value) qs.set("ship_to", filtShip.value.trim());
  qs.set("limit", "100");
  const rows = await fetchJSON("/api/meeting/list?" + qs.toString()).catch(() => []);
  if (!Array.isArray(rows) || !rows.length){
    wrap.innerHTML = '<div class="empty">No entries yet.</div>';
    return;
  }
  let h = `<table class="recent-tbl">
    <thead><tr>
      <th>Visit date</th><th>BDE</th><th>Shop</th><th>Notes / Next / Feedback</th><th>Photos</th>
    </tr></thead><tbody>`;
  for (const r of rows){
    const photos = (r.photo_paths || [])
      .map(p => `<a href="${p}" target="_blank"><img src="${p}" alt=""></a>`)
      .join("");
    const next = r.next_action ? `<div style="color:#6b7280;font-size:11px;margin-top:3px;">→ ${escapeHtml(r.next_action)}</div>` : "";
    const met  = r.met_person  ? `<div style="color:#9ca3af;font-size:11px;margin-top:2px;">met: ${escapeHtml(r.met_person)}</div>` : "";
    // Feedback block: shows the value if set, with an Edit pencil; if
    // empty, shows an "+ Add feedback" link.  Inline form swaps in via
    // toggleFeedbackEditor(id).
    const fbBlock = renderFeedbackBlock(r.id, r.feedback);
    h += `<tr>
      <td class="ts">${r.visit_date || r.created_at}</td>
      <td class="bde">${escapeHtml(r.bde_name || "—")}</td>
      <td class="shop">${escapeHtml(r.ship_to)}<br><span style="color:#6b7280;font-size:11px;">${escapeHtml(r.ship_to_name || "")}</span></td>
      <td class="notes">${escapeHtml(r.notes || "")}${next}${met}${fbBlock}</td>
      <td class="photos">${photos}</td>
    </tr>`;
  }
  h += `</tbody></table>`;
  wrap.innerHTML = h;
}

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Feedback display + inline edit.  The element with id="fb-<row id>"
// is swapped between "view" and "edit" mode by toggleFeedbackEditor.
function renderFeedbackBlock(rid, feedback){
  const has = feedback && feedback.trim().length;
  if (has){
    return `<div id="fb-${rid}" style="margin-top:4px;padding:4px 8px;
              background:#fef3c7;border-left:3px solid #f59e0b;border-radius:3px;
              font-size:12px;color:#78350f;white-space:pre-wrap;">
      <div style="display:flex;justify-content:space-between;gap:6px;">
        <span><b>Feedback:</b> ${escapeHtml(feedback)}</span>
        <a href="javascript:void(0)" onclick="toggleFeedbackEditor(${rid}, ${JSON.stringify(feedback)})"
           style="font-size:10px;color:#9a3412;">edit</a>
      </div>
    </div>`;
  }
  return `<div id="fb-${rid}" style="margin-top:3px;">
    <a href="javascript:void(0)" onclick="toggleFeedbackEditor(${rid}, '')"
       style="font-size:11px;color:#2563eb;">+ Add feedback</a>
  </div>`;
}
function toggleFeedbackEditor(rid, current){
  const el = document.getElementById("fb-" + rid);
  if (!el) return;
  el.innerHTML = `
    <textarea id="fbInp-${rid}"
      style="width:100%;min-height:48px;font-size:12px;padding:6px;
             border:1px solid #d1d5db;border-radius:4px;font-family:inherit;"
    >${escapeHtml(current || "")}</textarea>
    <div style="margin-top:4px;display:flex;gap:6px;">
      <button type="button" onclick="saveFeedback(${rid})"
        style="font-size:11px;padding:3px 10px;background:#2563eb;color:#fff;
               border:none;border-radius:4px;cursor:pointer;">Save</button>
      <button type="button" onclick="loadRecent()"
        style="font-size:11px;padding:3px 10px;background:#f3f4f6;color:#374151;
               border:1px solid #d1d5db;border-radius:4px;cursor:pointer;">Cancel</button>
    </div>`;
}
async function saveFeedback(rid){
  const inp = document.getElementById("fbInp-" + rid);
  if (!inp) return;
  try {
    const r = await fetch("/api/meeting/feedback", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      credentials: "include",
      body: JSON.stringify({ id: rid, feedback: inp.value }),
    });
    const j = await r.json();
    if (!r.ok || j.error){ alert("Save failed: " + (j.error || r.status)); return; }
    loadRecent();
  } catch (err){ alert("Error: " + err.message); }
}

fForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!fBde.value)         { fMsg.textContent = "BDE is required";      fMsg.className = "err"; return; }
  if (!soldPicker.value()) { fMsg.textContent = "Sold-to is required";  fMsg.className = "err"; return; }
  if (!shipPicker.value()) { fMsg.textContent = "Ship-to is required";  fMsg.className = "err"; return; }

  fMsg.textContent = "Submitting…"; fMsg.className = "";
  const fd = new FormData();
  fd.append("bde_name",    fBde.value);
  fd.append("visit_date",  fVisitDate.value);
  fd.append("sold_to",     soldPicker.value());
  fd.append("ship_to",     shipPicker.value());
  fd.append("met_person",  document.getElementById("fMet").value);
  fd.append("notes",       document.getElementById("fNotes").value);
  fd.append("next_action", document.getElementById("fNext").value);
  fd.append("feedback",    document.getElementById("fFeedback").value);
  const files = document.getElementById("fPhotos").files;
  for (let i = 0; i < Math.min(files.length, 5); i++){
    fd.append("photos", files[i]);
  }
  try {
    const r = await fetch("/api/meeting", { method:"POST", body: fd, credentials:"include" });
    const j = await r.json();
    if (!r.ok || j.error){
      fMsg.textContent = "Failed: " + (j.error || r.status);
      fMsg.className = "err";
      return;
    }
    fMsg.textContent = `Saved (#${j.id})`;
    fMsg.className = "ok";
    // Reset writable fields, keep BDE selection.
    document.getElementById("fNotes").value    = "";
    document.getElementById("fNext").value     = "";
    document.getElementById("fMet").value      = "";
    document.getElementById("fFeedback").value = "";
    document.getElementById("fPhotos").value   = "";
    shipPicker.reset();
    loadRecent();
    setTimeout(() => { fMsg.textContent = ""; }, 4000);
  } catch (err) {
    fMsg.textContent = "Error: " + err.message;
    fMsg.className = "err";
  }
});

document.getElementById("btnRefresh").addEventListener("click", loadRecent);
filtBde.addEventListener("change", loadRecent);
filtShip.addEventListener("change", loadRecent);

(async () => {
  await loadBdes();
  await loadSoldTos();
  await loadRecent();
})();
