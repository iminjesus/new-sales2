<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · System Usage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.toolbar{padding:12px 18px;background:#1e3a5f;color:#fff;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.toolbar h1{font-size:14px;font-weight:700;margin:0}
.toolbar label{font-size:11px;color:#cbd5e1;display:flex;align-items:center;gap:6px}
.toolbar input[type=date],.toolbar select{background:#fff;color:#111;border:none;
  border-radius:5px;padding:5px 8px;font-size:12px}
.toolbar button{background:#2563eb;color:#fff;border:none;border-radius:5px;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.toolbar button:hover{background:#1d4ed8}
.toolbar .spacer{flex:1}
.toolbar a{color:#cbd5e1;font-size:12px;text-decoration:none}
.toolbar a:hover{color:#fff}

.wrap{padding:18px;max-width:1600px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:10px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .label{font-size:10px;font-weight:700;color:#6b7280;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.kpi .value{font-size:22px;font-weight:700;color:#1e3a5f;line-height:1.1}
.kpi .sub{font-size:10.5px;color:#6b7280;margin-top:2px}

.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:14px}
.card h2{font-size:12px;font-weight:700;color:#1e3a5f;margin:0 0 10px;
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:6px;border-bottom:1px solid #e5e7eb;
  display:flex;align-items:center;gap:8px}
.card h2 .sub{font-size:10px;font-weight:500;color:#6b7280;text-transform:none;
  letter-spacing:0;margin-left:auto}

/* Pivot table — users down, sections across */
.pivot-wrap{overflow-x:auto}
table.pivot{border-collapse:collapse;font-size:11.5px;min-width:100%}
table.pivot th,table.pivot td{padding:4px 8px;border:1px solid #e5e7eb;
  white-space:nowrap}
table.pivot thead th{background:#1e3a5f;color:#fff;font-weight:700;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;z-index:2}
table.pivot thead th.section-col{background:#2563eb}
table.pivot thead th.kpi-col{background:#065f46}
table.pivot thead th.total-col{background:#991b1b}
table.pivot tbody tr:hover td{background:#eff6ff}
table.pivot tbody tr.totals-row td{background:#1e3a5f;color:#fff;font-weight:800;
  border-top:2px solid #0f172a}
table.pivot tbody tr.totals-row td.total-cell{background:#991b1b}
table.pivot td.name-cell{font-weight:700;color:#111;position:sticky;left:0;
  background:#fff;z-index:1;max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.pivot tbody tr:hover td.name-cell{background:#eff6ff}
table.pivot tbody tr.totals-row td.name-cell{background:#1e3a5f;color:#fff}
table.pivot td.email-cell{font-size:10px;color:#6b7280}
table.pivot td.num{text-align:right;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Menlo,monospace}
table.pivot td.num.zero{color:#cbd5e1}
table.pivot td.total-cell{background:#fef2f2;color:#7f1d1d;font-weight:700}
table.pivot td.kpi-cell{background:#f0fdf4;color:#064e3b;font-weight:600}

/* Legend of path → section mapping */
.map-chip{display:inline-block;background:#eff6ff;color:#1e3a5f;padding:2px 7px;
  margin:2px 3px 0 0;border-radius:3px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.map-chip b{color:#2563eb;margin-right:4px}

.status{padding:30px;text-align:center;color:#6b7280}
.error{padding:30px;text-align:center;color:#dc2626;font-weight:600}
</style>
</head>
<body>

<div class="toolbar">
  <h1>📈 Admin · System Usage</h1>
  <label>From <input type="date" id="dFrom"></label>
  <label>To <input type="date" id="dTo"></label>
  <label>Quick
    <select id="quickWin">
      <option value="7">Past 7 days</option>
      <option value="14">Past 14 days</option>
      <option value="30" selected>Past 30 days</option>
      <option value="60">Past 60 days</option>
      <option value="90">Past 90 days</option>
      <option value="180">Past 180 days</option>
    </select>
  </label>
  <button id="btnApply">Apply</button>
  <div class="spacer"></div>
  <a href="/">← Dashboard</a>
</div>

<div class="wrap">
  <div id="status" class="status">Loading…</div>
  <div id="body" style="display:none">

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2>User × Section matrix
        <span class="sub">Each row = one user · each column = a page or KPI · last column = per-user total</span>
      </h2>
      <div class="pivot-wrap">
        <table class="pivot" id="pivotTable"></table>
      </div>
    </div>

    <div class="card">
      <h2>Section traffic breakdown
        <span class="sub">All users combined · ordered by hits</span>
      </h2>
      <table class="pivot" id="sectionTable" style="min-width:auto;max-width:620px">
        <thead>
          <tr><th>Section</th><th class="num">Hits</th><th class="num">Unique users</th></tr>
        </thead>
        <tbody id="sectionBody"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const $ = sel => document.querySelector(sel);

function fmtInt(n){
  if (n == null || isNaN(+n)) return "0";
  return (+n).toLocaleString(undefined, {maximumFractionDigits:0});
}
function fmt1(n){
  if (n == null || isNaN(+n)) return "0.0";
  return (+n).toLocaleString(undefined, {maximumFractionDigits:1, minimumFractionDigits:1});
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function setStatus(msg, cls){
  const s = $("#status");
  s.textContent = msg;
  s.className = cls || "status";
  s.style.display = "block";
  $("#body").style.display = "none";
}

function initDates(){
  const to = new Date();
  const from = new Date(); from.setDate(from.getDate() - 29);
  $("#dFrom").value = from.toISOString().slice(0,10);
  $("#dTo").value   = to.toISOString().slice(0,10);
}

$("#quickWin").addEventListener("change", (e) => {
  const n = parseInt(e.target.value, 10) || 30;
  const to = new Date();
  const from = new Date(); from.setDate(from.getDate() - (n - 1));
  $("#dFrom").value = from.toISOString().slice(0,10);
  $("#dTo").value   = to.toISOString().slice(0,10);
});

$("#btnApply").addEventListener("click", load);

async function load(){
  setStatus("Loading…");
  const qs = new URLSearchParams({
    from: $("#dFrom").value,
    to:   $("#dTo").value,
  });
  let data;
  try {
    const r = await fetch(`/api/admin/usage/summary?${qs}`, {credentials:"same-origin"});
    if (!r.ok){
      const t = await r.text();
      setStatus(`${r.status} — ${t.slice(0,200)}`, "error");
      return;
    }
    data = await r.json();
  } catch(e){
    setStatus(`Load failed: ${e}`, "error");
    return;
  }
  if (data.error){
    setStatus(`Error: ${data.error}`, "error");
    return;
  }
  renderKpis(data);
  renderPivot(data);
  renderSectionBreakdown(data);
  $("#status").style.display = "none";
  $("#body").style.display   = "block";
}

function renderKpis(d){
  const t = d.totals || {};
  const p = d.period || {};
  const kpis = [
    {label:"Period",          value: `${p.from} → ${p.to}`,  sub:`${p.days} days · ${p.working_days} working · ${p.months} mo`},
    {label:"Total requests",  value: fmtInt(t.requests)},
    {label:"Page clicks",     value: fmtInt(t.page_views),   sub:"navigations (excl. background API)"},
    {label:"Unique users",    value: fmtInt(t.uniq_users)},
    {label:"Sessions",        value: fmtInt(t.sessions),     sub:`gap ≥ ${p.session_gap_min||30} min = new session`},
    {label:"System-open hrs", value: fmt1(t.total_hours),    sub:"summed across every session"},
    {label:"Downloads",       value: fmtInt(t.downloads),    sub:"export_excel / xlsx / csv / pdf"},
  ];
  $("#kpis").innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="label">${escapeHtml(k.label)}</div>
      <div class="value">${k.label === "Period" ? `<span style="font-size:13px;font-weight:600">${escapeHtml(k.value)}</span>` : escapeHtml(k.value)}</div>
      ${k.sub ? `<div class="sub">${escapeHtml(k.sub)}</div>` : ""}
    </div>`).join("");
}

function renderPivot(d){
  const users    = (d.by_user || []).slice();
  const sections = (d.by_section || []).map(s => s.section);
  const period   = d.period || {};

  const tbl = $("#pivotTable");
  if (!users.length){
    tbl.innerHTML = `<tbody><tr><td style="padding:24px;text-align:center;color:#6b7280">No activity in this window.</td></tr></tbody>`;
    return;
  }

  // Header rows
  const kpiCols = [
    {k:"sessions",      lbl:"Sessions"},
    {k:"hours",         lbl:"Hours"},
    {k:"downloads",     lbl:"Downloads"},
    {k:"days_active",   lbl:"Active days"},
    {k:"avg_daily_clicks",   lbl:"Avg/working day"},
    {k:"avg_monthly_clicks", lbl:"Avg/month"},
  ];
  const totCols = [
    {k:"page_clicks", lbl:"Total clicks"},
  ];

  let html = "<thead><tr>";
  html += `<th rowspan="2" style="min-width:160px">User</th>`;
  if (sections.length){
    html += `<th class="section-col" colspan="${sections.length}">Section (page clicks)</th>`;
  }
  html += `<th class="kpi-col" colspan="${kpiCols.length}">Per-user KPIs</th>`;
  html += `<th class="total-col" colspan="${totCols.length}">Total</th>`;
  html += "</tr><tr>";
  for (const s of sections) html += `<th class="section-col num">${escapeHtml(s)}</th>`;
  for (const c of kpiCols) html += `<th class="kpi-col num">${escapeHtml(c.lbl)}</th>`;
  for (const c of totCols) html += `<th class="total-col num">${escapeHtml(c.lbl)}</th>`;
  html += "</tr></thead>";

  // Rows
  const colTotals = {};
  sections.forEach(s => colTotals[s] = 0);
  kpiCols.forEach(c => colTotals[c.k] = 0);
  totCols.forEach(c => colTotals[c.k] = 0);

  html += "<tbody>";
  for (const u of users){
    const name = u.name || u.email;
    const email = u.email || "";
    html += `<tr>`;
    html += `<td class="name-cell">${escapeHtml(name)}<br><span class="email-cell">${escapeHtml(email)}</span></td>`;
    for (const s of sections){
      const n = (u.sections || {})[s] || 0;
      colTotals[s] += n;
      html += `<td class="num${n===0?' zero':''}">${fmtInt(n)}</td>`;
    }
    for (const c of kpiCols){
      const v = u[c.k];
      colTotals[c.k] += (+v || 0);
      const txt = (c.k === "hours" || c.k.startsWith("avg_")) ? fmt1(v) : fmtInt(v);
      html += `<td class="num kpi-cell">${txt}</td>`;
    }
    for (const c of totCols){
      const v = u[c.k];
      colTotals[c.k] += (+v || 0);
      html += `<td class="num total-cell">${fmtInt(v)}</td>`;
    }
    html += `</tr>`;
  }
  // Totals row
  html += `<tr class="totals-row">`;
  html += `<td class="name-cell">Total</td>`;
  for (const s of sections) html += `<td class="num">${fmtInt(colTotals[s])}</td>`;
  for (const c of kpiCols){
    const v = colTotals[c.k];
    const txt = (c.k === "hours" || c.k.startsWith("avg_")) ? fmt1(v) : fmtInt(v);
    html += `<td class="num">${txt}</td>`;
  }
  for (const c of totCols) html += `<td class="num total-cell">${fmtInt(colTotals[c.k])}</td>`;
  html += `</tr></tbody>`;

  tbl.innerHTML = html;
}

function renderSectionBreakdown(d){
  const rows = d.by_section || [];
  if (!rows.length){
    $("#sectionBody").innerHTML = `<tr><td colspan="3" style="padding:14px;text-align:center;color:#6b7280">No section hits in this window.</td></tr>`;
    return;
  }
  $("#sectionBody").innerHTML = rows.map(r => `
    <tr>
      <td><b>${escapeHtml(r.section)}</b></td>
      <td class="num">${fmtInt(r.hits)}</td>
      <td class="num">${fmtInt(r.uniq_users)}</td>
    </tr>`).join("");
}

initDates();
load();
</script>
</body>
</html>
