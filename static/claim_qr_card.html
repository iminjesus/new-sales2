<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim QR — Hankook</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e5e7eb;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.toolbar{padding:10px 14px;background:#1e3a5f;color:#fff;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.toolbar h1{font-size:13px;font-weight:700;margin:0}
.toolbar button{background:#2563eb;color:#fff;border:none;border-radius:5px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.toolbar a{color:#cbd5e1;font-size:12px;text-decoration:none}
.toolbar a:hover{color:#fff}
.stage{padding:24px;display:flex;justify-content:center}
/* Card sized so that an A6 print fits perfectly when zoom is 100 % */
.card{width:105mm;height:148mm;background:#fff;padding:8mm;border-radius:4mm;
  box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;
  align-items:center;text-align:center}
.card .brand{font-size:11pt;font-weight:700;color:#1e3a5f;letter-spacing:.4px}
.card .title{font-size:14pt;font-weight:800;color:#111827;margin:2mm 0 4mm}
.card .qr-wrap{width:70mm;height:70mm;display:flex;align-items:center;justify-content:center;
  border:1px solid #e5e7eb;border-radius:3mm;padding:3mm;background:#fff}
.card .qr-wrap img{width:100%;height:100%;object-fit:contain}
.card .shop-name{font-size:12pt;font-weight:700;color:#1e3a5f;margin-top:5mm;
  line-height:1.2;word-break:break-word;padding:0 2mm}
.card .shop-code{font-size:9pt;color:#6b7280;font-family:ui-monospace,Menlo,monospace;
  margin-top:1mm;letter-spacing:.5px}
.card .or{font-size:8pt;color:#9ca3af;margin-top:4mm}
.card .url{font-size:9pt;color:#1e3a5f;font-family:ui-monospace,Menlo,monospace;
  word-break:break-all;padding:0 3mm}
.error{padding:30px;color:#dc2626;text-align:center;font-size:14px}
@media print {
  body{background:#fff}
  .toolbar{display:none}
  .stage{padding:0}
  .card{box-shadow:none;border-radius:0;width:105mm;height:148mm}
  @page { size: A6; margin: 0 }
}
</style>
</head>
<body>
<div class="toolbar">
  <h1>Hankook claim QR — printable card</h1>
  <div>
    <a href="/claims" style="margin-right:14px;">← Back to claims</a>
    <button onclick="window.print()">Print this card</button>
  </div>
</div>

<div class="stage" id="stage">
  <div style="padding:30px;color:#6b7280;">Loading shop information…</div>
</div>

<script>
const SHIP_TO = location.pathname.split("/").filter(Boolean).pop() || "";
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
(async () => {
  const stage = document.getElementById("stage");
  try {
    const r = await fetch(`/api/claim/shop/${encodeURIComponent(SHIP_TO)}`);
    if (!r.ok) throw new Error("Shop code not recognised");
    const s = await r.json();
    const url = `${s.portal_url || location.origin}/claim/${s.ship_to}`;
    stage.innerHTML = `
      <div class="card">
        <img src="/static/img/hankook_logo.png" alt=""
             style="max-height:14mm;max-width:50mm;object-fit:contain;margin-bottom:3mm;"
             onerror="this.style.display='none'">
        <div class="title">Tyre Claim Form</div>
        <div class="qr-wrap">
          <img src="/api/claim/qr/${encodeURIComponent(s.ship_to)}" alt="QR code">
        </div>
        <div class="shop-name">${esc(s.ship_to_name || s.ship_to)}</div>
        <div class="shop-code">#${esc(s.ship_to)}</div>
        <div class="or">Scan with your phone camera, or visit:</div>
        <div class="url">${esc(url)}</div>
      </div>
    `;
  } catch (e){
    stage.innerHTML = `<div class="error">Shop code <b>${esc(SHIP_TO)}</b> not recognised.</div>`;
  }
})();
</script>
</body>
</html>
