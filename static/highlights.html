<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Highlights</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.toolbar{padding:10px 18px;background:#1e3a5f;color:#fff;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.toolbar h1{font-size:14px;font-weight:700;margin:0;margin-right:14px}
.toolbar select,.toolbar button{background:#fff;color:#111827;border:none;
  border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer}
.toolbar button.active{background:#2563eb;color:#fff;font-weight:700}
.toolbar .nav{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.toolbar .nav a{color:#cbd5e1;font-size:12px;text-decoration:none;
  padding:5px 10px;border-radius:5px}
.toolbar .nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.toolbar .nav a.here{background:#fff;color:#1e3a5f;font-weight:700}

.wrap{padding:20px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:12px;font-weight:700;color:#1e3a5f;margin:0 0 12px;
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:8px;border-bottom:1px solid #e5e7eb}

/* Summary KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{padding:10px 12px;border:1px solid #f1f5f9;border-radius:6px;background:#fafafa}
.kpi .label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
.kpi .value{font-size:22px;font-weight:700;color:#1e3a5f;margin-top:2px;
  font-family:ui-monospace,Menlo,monospace}
.kpi .sub{font-size:11px;color:#6b7280;margin-top:2px}
.delta-up{color:#16a34a;font-weight:700}
.delta-dn{color:#dc2626;font-weight:700}
.delta-fl{color:#9ca3af}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #f1f5f9}
th{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;
  background:#fafafa;position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,monospace}
td.name{font-weight:500;color:#1e3a5f}

.section-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.section-grid2{grid-template-columns:1fr}}

.notes{font-size:11px;color:#6b7280;font-style:italic;margin-top:8px;line-height:1.5}
.notes b{color:#374151;font-style:normal}
.status-msg{padding:30px;text-align:center;color:#6b7280;font-size:13px}
.status-msg.err{color:#dc2626;font-weight:600}

/* Remarkable card — one-sentence headlines that expand to detail.
   Each item is a <details>: native browser expand/collapse + zero
   JS state to manage.  Summary line stays compact; the detail
   panel slides in with a soft background so the "what's behind
   this fact" feels like a drill rather than a wall of numbers. */
.card.remarkable h2 { color: #b45309; }
.rem-list { display:flex; flex-direction:column; gap:6px; }
.rem-item { border:1px solid #fef3c7; border-radius:6px;
  background:#fffbeb; }
.rem-item[open] { border-color:#fbbf24; box-shadow:0 1px 3px rgba(180,83,9,0.08); }
.rem-item summary {
  list-style:none; cursor:pointer; padding:9px 12px;
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:500; color:#1f2937;
}
.rem-item summary::-webkit-details-marker { display:none; }
.rem-item summary::before {
  content:"▸"; color:#b45309; font-size:11px; flex:0 0 auto;
  transition:transform 120ms ease;
}
.rem-item[open] summary::before { transform:rotate(90deg); }
.rem-item .rem-chip {
  display:inline-block; font-size:10px; font-weight:700;
  padding:2px 7px; border-radius:9px;
  background:#fde68a; color:#78350f; letter-spacing:.3px;
  text-transform:uppercase; flex:0 0 auto;
}
.rem-item .rem-chip.bad  { background:#fecaca; color:#7f1d1d; }
.rem-item .rem-chip.good { background:#bbf7d0; color:#14532d; }
.rem-item .rem-chip.info { background:#dbeafe; color:#1e3a8a; }
.rem-item .rem-detail {
  padding:8px 14px 12px; border-top:1px dashed #fde68a;
  font-size:12px; color:#4b5563; line-height:1.55;
}
.rem-item .rem-detail b { color:#111827; }
.rem-item .rem-detail table { margin-top:6px; max-width:480px; }
.rem-item .rem-detail table th { background:transparent; padding:3px 8px 3px 0; }
.rem-item .rem-detail table td { padding:3px 8px 3px 0; border-bottom:1px solid #fef3c7; }
</style>
</head>
<body>
<div class="toolbar">
  <h1>📊 Monthly Highlights</h1>
  <label>Month
    <select id="monthSel">
      <option value="2026-01">2026 January</option>
      <option value="2026-02">2026 February</option>
      <option value="2026-03">2026 March</option>
      <option value="2026-04">2026 April</option>
      <option value="2026-05">2026 May</option>
      <option value="2026-06" selected>2026 June</option>
    </select>
  </label>
  <div class="nav">
    <a href="/">Graph</a>
    <a href="/map">Map</a>
    <a href="/stock">Stock</a>
    <a href="/rebate">Rebate</a>
    <a href="/price">Price</a>
    <a href="/meeting">Meeting</a>
    <a href="/claims">Claims</a>
    <a href="/highlights" class="here">📊 Highlights</a>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="status-msg" id="status">Loading…</div>
</div>

<script>
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmtNum(n){
  if (n == null) return "—";
  return Math.round(n).toLocaleString();
}
function fmtPct(p){
  if (p == null) return "—";
  const cls = p > 0 ? "delta-up" : (p < 0 ? "delta-dn" : "delta-fl");
  const sign = p > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${p.toFixed(1)}%</span>`;
}
function fmtPpt(p){
  if (p == null) return "—";
  const cls = p > 0 ? "delta-up" : (p < 0 ? "delta-dn" : "delta-fl");
  const sign = p > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${p.toFixed(1)} ppt</span>`;
}

// Highlights page is qty-only — the team analyses units, not AUD.
const metric = "qty";

document.getElementById("monthSel").addEventListener("change", load);

async function load(){
  const wrap = document.getElementById("wrap");
  const status = document.getElementById("status");
  if (status) { status.className = "status-msg"; status.textContent = "Loading…"; status.style.display = ""; }
  const month = document.getElementById("monthSel").value;
  try {
    const r = await fetch(`/api/monthly_highlights?month=${encodeURIComponent(month)}&metric=${metric}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    render(j);
  } catch (e) {
    if (status) { status.className = "status-msg err"; status.textContent = "Error: " + e.message; }
  }
}

function unitLabel(){ return metric === "qty" ? "units" : "$"; }
function unitVal(v){
  if (v == null) return "—";
  return metric === "qty" ? fmtNum(v) : "$" + fmtNum(v);
}

// ────────── Remarkable: derive the few "look at this" facts ──────────
// Each entry: { tone: 'good'|'bad'|'info', chip: 'YoY'|'MoM'|..., line: '...', detail: '...html...' }
// We score candidates and keep the top ~5 to avoid burying the user.
function buildRemarkable(j){
  const items = [];

  const sum = j.summary || {};
  const v3  = sum.vs_avg3_pct;

  // Total vs 3M avg if material (>= 5%).
  if (v3 != null && Math.abs(v3) >= 5) {
    const tone = v3 > 0 ? "good" : "bad";
    const dir  = v3 > 0 ? "up" : "down";
    items.push({
      score: Math.abs(v3) * 2,
      chip: "vs 3M avg", tone,
      line: `Total sales are <b>${dir} ${Math.abs(v3).toFixed(1)}%</b> vs the 3-month average (${unitVal(sum.this?.[metric])} vs ${unitVal(sum.avg3?.[metric])}).`,
      detail: `<b>This month:</b> ${unitVal(sum.this?.[metric])}<br>
               <b>3-month average:</b> ${unitVal(sum.avg3?.[metric])}<br>
               <b>Prev month:</b> ${unitVal(sum.prev?.[metric])} (${fmtPct(sum.mom_pct)})<br>
               <b>Daily avg:</b> ${unitVal(sum.daily_avg)} across ${sum.working_days || "—"} working days.`
    });
  }

  // Region: biggest vs-3M-avg mover.
  const regions = (j.regions || []).filter(r => r.region && r.region !== "COMMON" && r.vs_avg3_pct != null);
  if (regions.length) {
    const byAvg3 = [...regions].sort((a,b) => Math.abs(b.vs_avg3_pct) - Math.abs(a.vs_avg3_pct));
    const top = byAvg3[0];
    if (top && Math.abs(top.vs_avg3_pct) >= 10) {
      const tone = top.vs_avg3_pct > 0 ? "good" : "bad";
      const dir  = top.vs_avg3_pct > 0 ? "up" : "down";
      items.push({
        score: Math.abs(top.vs_avg3_pct) * 1.2,
        chip: `Region · ${top.region}`, tone,
        line: `<b>${esc(top.region)}</b> is <b>${dir} ${Math.abs(top.vs_avg3_pct).toFixed(1)}% vs 3M avg</b> — biggest regional swing this month.`,
        detail: `<table>
          <tr><th>This month</th><td>${unitVal(top.this)}</td></tr>
          <tr><th>3M average</th><td>${unitVal(top.avg3)}</td></tr>
          <tr><th>vs 3M avg</th><td>${fmtPct(top.vs_avg3_pct)}</td></tr>
          <tr><th>vs Prev M</th><td>${fmtPct(top.mom_pct)}</td></tr>
          <tr><th>vs Prev Y</th><td>${fmtPct(top.yoy_pct)}</td></tr>
          <tr><th>Share of total</th><td>${top.share != null ? top.share.toFixed(1) + "%" : "—"}</td></tr>
        </table>`
      });
    }
  }

  // Product Group: biggest vs-3M-avg mover among top 10 (filter tiny).
  const pgs = (j.product_groups || []).filter(p => p.product_group && p.vs_avg3_pct != null && (p.this || 0) > 0);
  if (pgs.length) {
    const byAvg3 = [...pgs].sort((a,b) => Math.abs(b.vs_avg3_pct) - Math.abs(a.vs_avg3_pct));
    const top = byAvg3[0];
    if (top && Math.abs(top.vs_avg3_pct) >= 30) {
      const tone = top.vs_avg3_pct > 0 ? "good" : "bad";
      const dir  = top.vs_avg3_pct > 0 ? "surged" : "dropped";
      items.push({
        score: Math.abs(top.vs_avg3_pct),
        chip: "Product", tone,
        line: `<b>${esc(top.product_group)}</b> ${dir} <b>${Math.abs(top.vs_avg3_pct).toFixed(1)}% vs 3M avg</b> (now ${unitVal(top.this)}, ${top.share != null ? top.share.toFixed(1) + "%": "—"} share).`,
        detail: `<table>
          <tr><th>This month</th><td>${unitVal(top.this)}</td></tr>
          <tr><th>3M average</th><td>${unitVal(top.avg3)}</td></tr>
          <tr><th>vs 3M avg</th><td>${fmtPct(top.vs_avg3_pct)}</td></tr>
          <tr><th>vs Prev M</th><td>${fmtPct(top.mom_pct)}</td></tr>
          <tr><th>vs Prev Y</th><td>${fmtPct(top.yoy_pct)}</td></tr>
          <tr><th>Share</th><td>${top.share != null ? top.share.toFixed(1) + "%" : "—"}</td></tr>
        </table>`
      });
    }
    // Runner-up only if it moved hard in the OPPOSITE direction.
    if (byAvg3.length > 1) {
      const second = byAvg3[1];
      if (second && top && Math.sign(second.vs_avg3_pct) !== Math.sign(top.vs_avg3_pct)
          && Math.abs(second.vs_avg3_pct) >= 30) {
        const tone = second.vs_avg3_pct > 0 ? "good" : "bad";
        const dir  = second.vs_avg3_pct > 0 ? "surged" : "dropped";
        items.push({
          score: Math.abs(second.vs_avg3_pct) * 0.9,
          chip: "Product", tone,
          line: `<b>${esc(second.product_group)}</b> ${dir} <b>${Math.abs(second.vs_avg3_pct).toFixed(1)}% vs 3M avg</b> — second-biggest product swing.`,
          detail: `<table>
            <tr><th>This month</th><td>${unitVal(second.this)}</td></tr>
            <tr><th>3M average</th><td>${unitVal(second.avg3)}</td></tr>
            <tr><th>vs 3M avg</th><td>${fmtPct(second.vs_avg3_pct)}</td></tr>
            <tr><th>vs Prev M</th><td>${fmtPct(second.mom_pct)}</td></tr>
          </table>`
        });
      }
    }
  }

  // Promo vs Non-Promo share swing — vs 3M-avg share (not prev).
  const agg = j.promo_aggregate;
  if (agg && agg.promo_share_this != null && agg.promo_share_avg3 != null) {
    const delta = +(agg.promo_share_this - agg.promo_share_avg3).toFixed(1);
    if (Math.abs(delta) >= 3) {
      const tone = delta > 0 ? "good" : "bad";
      const dir  = delta > 0 ? "up" : "down";
      items.push({
        score: Math.abs(delta) * 4,
        chip: "Promo mix", tone,
        line: `Promo share is <b>${dir} ${Math.abs(delta).toFixed(1)} ppt vs 3M avg</b> (${agg.promo_share_this.toFixed(1)}% vs 3M ${agg.promo_share_avg3.toFixed(1)}%).`,
        detail: `<table>
          <tr><th>Promo this</th><td>${unitVal(agg.promo_this)} (${agg.promo_share_this.toFixed(1)}%)</td></tr>
          <tr><th>Promo 3M avg</th><td>${unitVal(agg.promo_avg3)} (${agg.promo_share_avg3.toFixed(1)}%)</td></tr>
          <tr><th>Non-Promo this</th><td>${unitVal(agg.non_promo_this)} (${agg.non_promo_share_this != null ? agg.non_promo_share_this.toFixed(1) + "%" : "—"})</td></tr>
          <tr><th>Promo vs 3M</th><td>${fmtPct(agg.promo_vs_avg3_pct)}</td></tr>
          <tr><th>Non-Promo vs 3M</th><td>${fmtPct(agg.non_promo_vs_avg3_pct)}</td></tr>
        </table>`
      });
    }
  }

  // Per-promo: biggest vs-3M-avg mover among 443 / iON / TrueBlue.
  const promos = (j.promotions || []).filter(p => p.vs_avg3_pct != null && (p.this || 0) > 0);
  if (promos.length) {
    const byAvg3 = [...promos].sort((a,b) => Math.abs(b.vs_avg3_pct) - Math.abs(a.vs_avg3_pct));
    const top = byAvg3[0];
    if (top && Math.abs(top.vs_avg3_pct) >= 5) {
      const tone = top.vs_avg3_pct > 0 ? "good" : "bad";
      const dir  = top.vs_avg3_pct > 0 ? "up" : "down";
      items.push({
        score: Math.abs(top.vs_avg3_pct) * 1.5,
        chip: `Promo · ${top.promo}`, tone,
        line: `<b>${esc(top.promo)}</b> is <b>${dir} ${Math.abs(top.vs_avg3_pct).toFixed(1)}% vs 3M avg</b> (${unitVal(top.this)}, ${top.share_of_promo_this != null ? top.share_of_promo_this.toFixed(1) + "% of total promo" : ""}).`,
        detail: `<table>
          <tr><th>Participants</th><td>${top.participants} / ${top.total_shops}</td></tr>
          <tr><th>This month</th><td>${unitVal(top.this)}</td></tr>
          <tr><th>3M average</th><td>${unitVal(top.avg3)}</td></tr>
          <tr><th>vs 3M avg</th><td>${fmtPct(top.vs_avg3_pct)}</td></tr>
          <tr><th>MoM</th><td>${fmtPct(top.mom_pct)}</td></tr>
          <tr><th>Share of Promo</th><td>${top.share_of_promo_this != null ? top.share_of_promo_this.toFixed(1) + "%" : "—"}${top.share_of_promo_avg3 != null ? " (3M " + top.share_of_promo_avg3.toFixed(1) + "%)" : ""}</td></tr>
          <tr><th>Share of Total</th><td>${top.share_of_total_this != null ? top.share_of_total_this.toFixed(1) + "%" : "—"}</td></tr>
        </table>`
      });
    }
  }

  // Sold-to: biggest gainer / loser vs 3M avg.  Backend exposes
  // sold_to.gainers_vs_avg3 / losers_vs_avg3 (3-month per-sold_to
  // average computed alongside the existing MoM gainers/losers).
  const sold = j.sold_to || {};
  const gainersA = sold.gainers_vs_avg3 || [];
  const losersA  = sold.losers_vs_avg3  || [];
  if (gainersA.length) {
    const g = gainersA[0];
    if (g && g.delta != null) {
      items.push({
        score: 30,
        chip: "Customer · vs 3M", tone: "good",
        line: `<b>${esc(g.name)}</b> is the month's biggest gainer vs 3M avg — added <b>${unitVal(g.delta)}</b> (${fmtPct(g.delta_pct)}).`,
        detail: `<table>
          <tr><th>Sold-to</th><td>${esc(g.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;">#${esc(g.sold_to)}</span></td></tr>
          <tr><th>3M average</th><td>${unitVal(g.avg3)}</td></tr>
          <tr><th>This month</th><td>${unitVal(g.this)}</td></tr>
          <tr><th>Delta</th><td><span class="delta-up">+${unitVal(g.delta)}</span> (${fmtPct(g.delta_pct)})</td></tr>
        </table>`
      });
    }
  }
  if (losersA.length) {
    const l = losersA[0];
    if (l && l.delta != null) {
      items.push({
        score: 30,
        chip: "Customer · vs 3M", tone: "bad",
        line: `<b>${esc(l.name)}</b> fell the most vs 3M avg — <b>${unitVal(l.delta)}</b> (${fmtPct(l.delta_pct)}).`,
        detail: `<table>
          <tr><th>Sold-to</th><td>${esc(l.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;">#${esc(l.sold_to)}</span></td></tr>
          <tr><th>3M average</th><td>${unitVal(l.avg3)}</td></tr>
          <tr><th>This month</th><td>${unitVal(l.this)}</td></tr>
          <tr><th>Delta</th><td><span class="delta-dn">${unitVal(l.delta)}</span> (${fmtPct(l.delta_pct)})</td></tr>
        </table>`
      });
    }
  }

  // Newly active / silent counts (only when notable).
  const newA = sold.newly_active || [], newS = sold.newly_silent || [];
  if (newA.length >= 5) {
    items.push({
      score: 15 + newA.length * 0.3,
      chip: "Customer", tone: "info",
      line: `<b>${newA.length}</b> sold-tos came back this month after a 3-month silence.`,
      detail: `<div style="max-height:220px;overflow:auto;">
        <table>
          <tr><th>Sold-to</th><th class="num">This month</th></tr>
          ${newA.slice(0, 30).map(r => `
            <tr>
              <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
              <td class="num">${unitVal(r.this)}</td>
            </tr>`).join("")}
        </table>
        ${newA.length > 30 ? `<div class="notes">+ ${newA.length - 30} more — see Sold-to Movement section.</div>` : ""}
      </div>`
    });
  }
  if (newS.length >= 5) {
    items.push({
      score: 15 + newS.length * 0.3,
      chip: "Customer", tone: "bad",
      line: `<b>${newS.length}</b> sold-tos went silent this month (had sales last month, none this month).`,
      detail: `<div style="max-height:220px;overflow:auto;">
        <table>
          <tr><th>Sold-to</th><th class="num">Prev month</th></tr>
          ${newS.slice(0, 30).map(r => `
            <tr>
              <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
              <td class="num">${unitVal(r.prev)}</td>
            </tr>`).join("")}
        </table>
        ${newS.length > 30 ? `<div class="notes">+ ${newS.length - 30} more — see Sold-to Movement section.</div>` : ""}
      </div>`
    });
  }

  // Rank by score, keep top 6 so the card stays scannable.
  items.sort((a, b) => b.score - a.score);
  return items.slice(0, 6);
}

function renderRemarkableCard(j){
  const items = buildRemarkable(j);
  if (!items.length) {
    return `<div class="card remarkable">
      <h2>🌟 Remarkable</h2>
      <div class="notes">Nothing especially out of the ordinary in this month.  Browse the sections below for the underlying detail.</div>
    </div>`;
  }
  return `<div class="card remarkable">
    <h2>🌟 Remarkable</h2>
    <div class="rem-list">
      ${items.map(it => `
        <details class="rem-item">
          <summary>
            <span class="rem-chip ${it.tone}">${esc(it.chip)}</span>
            <span>${it.line}</span>
          </summary>
          <div class="rem-detail">${it.detail}</div>
        </details>
      `).join("")}
    </div>
  </div>`;
}

function render(j){
  const wrap = document.getElementById("wrap");
  const status = document.getElementById("status");
  if (status) status.style.display = "none";

  const sum = j.summary || {};
  const this_v = (sum.this || {})[metric] || 0;
  const prev_v = (sum.prev || {})[metric] || 0;
  const py_v   = (sum.py   || {})[metric] || 0;

  const html = [];

  // 🌟 Remarkable — sits above ① Summary; each line expands inline.
  html.push(renderRemarkableCard(j));

  // ① Summary
  const avg3_v = (sum.avg3 || {})[metric];
  html.push(`
    <div class="card">
      <h2>① Summary — ${esc(j.month)}</h2>
      <div class="kpis">
        <div class="kpi">
          <div class="label">This month total</div>
          <div class="value">${unitVal(this_v)}</div>
          <div class="sub">${metric === "qty" ? "units" : "AUD"}</div>
        </div>
        <div class="kpi">
          <div class="label">vs Previous month</div>
          <div class="value">${fmtPct(sum.mom_pct)}</div>
          <div class="sub">Prev: ${unitVal(prev_v)}</div>
        </div>
        <div class="kpi">
          <div class="label">vs 3-month average</div>
          <div class="value">${fmtPct(sum.vs_avg3_pct)}</div>
          <div class="sub">3M avg: ${unitVal(avg3_v)}</div>
        </div>
        <div class="kpi">
          <div class="label">vs Same month last year</div>
          <div class="value">${fmtPct(sum.yoy_pct)}</div>
          <div class="sub">Last year: ${unitVal(py_v)}</div>
        </div>
        <div class="kpi">
          <div class="label">Daily avg · Working days</div>
          <div class="value">${sum.daily_avg != null ? unitVal(sum.daily_avg) : "—"}</div>
          <div class="sub">${sum.working_days ? sum.working_days + " working days" : "—"}</div>
        </div>
      </div>
    </div>
  `);

  // ② Regions
  const regions = j.regions || [];
  html.push(`
    <div class="card">
      <h2>② Region</h2>
      <table>
        <thead><tr>
          <th>Region</th>
          <th class="num">This month</th>
          <th class="num">vs Prev M</th>
          <th class="num">vs 3M avg</th>
          <th class="num">vs Prev Y</th>
          <th class="num">Share</th>
        </tr></thead>
        <tbody>
          ${regions.map(r => `
            <tr>
              <td class="name">${esc(r.region)}</td>
              <td class="num">${unitVal(r.this)}</td>
              <td class="num">${fmtPct(r.mom_pct)}</td>
              <td class="num">${fmtPct(r.vs_avg3_pct)}<div style="font-size:10px;color:#9ca3af;">${unitVal(r.avg3)}</div></td>
              <td class="num">${fmtPct(r.yoy_pct)}</td>
              <td class="num">${r.share != null ? r.share.toFixed(1) + "%" : "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `);

  // ③ Product Groups (Top 10)
  const pgs = j.product_groups || [];
  html.push(`
    <div class="card">
      <h2>③ Product Group (Top 10 by this-month ${metric === "qty" ? "qty" : "amount"})</h2>
      <table>
        <thead><tr>
          <th>Product Group</th>
          <th class="num">This month</th>
          <th class="num">vs Prev M</th>
          <th class="num">vs 3M avg</th>
          <th class="num">vs Prev Y</th>
          <th class="num">Share</th>
        </tr></thead>
        <tbody>
          ${pgs.map(r => `
            <tr>
              <td class="name">${esc(r.product_group)}</td>
              <td class="num">${unitVal(r.this)}</td>
              <td class="num">${fmtPct(r.mom_pct)}</td>
              <td class="num">${fmtPct(r.vs_avg3_pct)}<div style="font-size:10px;color:#9ca3af;">${unitVal(r.avg3)}</div></td>
              <td class="num">${fmtPct(r.yoy_pct)}</td>
              <td class="num">${r.share != null ? r.share.toFixed(1) + "%" : "—"}</td>
            </tr>
          `).join("") || `<tr><td colspan="6" style="color:#9ca3af;text-align:center;padding:14px;">No data for this month.</td></tr>`}
        </tbody>
      </table>
    </div>
  `);

  // ④ Promotion — three real promos only (443 / iON / TrueBlue),
  // plus a Promo vs Non-Promo aggregate split.  443_beforeTrueblue
  // (a backfill artefact) is filtered out backend-side.
  const promos = j.promotions || [];
  const agg    = j.promo_aggregate || null;
  const shareCell = (cur, prev) => {
    if (cur == null) return "—";
    const delta = (prev == null) ? null : +(cur - prev).toFixed(1);
    const sub = (delta == null)
      ? ""
      : `<div style="font-size:10px;color:#6b7280;">prev ${prev.toFixed(1)}% &nbsp;${
          delta > 0 ? '<span class="delta-up">+' + delta.toFixed(1) + ' ppt</span>'
                    : (delta < 0 ? '<span class="delta-dn">' + delta.toFixed(1) + ' ppt</span>'
                                 : '<span class="delta-fl">0.0 ppt</span>')
        }</div>`;
    return `<b>${cur.toFixed(1)}%</b>${sub}`;
  };
  html.push(`
    <div class="card">
      <h2>④ Promotion</h2>
      ${agg ? `
        <h3 style="font-size:11px;color:#1e3a5f;margin:4px 0 6px;">Promo vs Non-Promo</h3>
        <table style="margin-bottom:14px;">
          <thead><tr>
            <th>Bucket</th>
            <th class="num">This month</th>
            <th class="num">Prev month</th>
            <th class="num">3M avg</th>
            <th class="num">MoM</th>
            <th class="num">vs 3M avg</th>
            <th class="num">Share — this / prev / 3M</th>
          </tr></thead>
          <tbody>
            <tr>
              <td class="name">🎯 Promo (443 + iON + TrueBlue)</td>
              <td class="num">${unitVal(agg.promo_this)}</td>
              <td class="num">${unitVal(agg.promo_prev)}</td>
              <td class="num">${unitVal(agg.promo_avg3)}</td>
              <td class="num">${fmtPct(agg.promo_mom_pct)}</td>
              <td class="num">${fmtPct(agg.promo_vs_avg3_pct)}</td>
              <td class="num">${shareCell(agg.promo_share_this, agg.promo_share_prev)}<div style="font-size:10px;color:#9ca3af;">3M ${agg.promo_share_avg3 != null ? agg.promo_share_avg3.toFixed(1) + "%" : "—"}</div></td>
            </tr>
            <tr>
              <td class="name">⚪ Non-Promo</td>
              <td class="num">${unitVal(agg.non_promo_this)}</td>
              <td class="num">${unitVal(agg.non_promo_prev)}</td>
              <td class="num">${unitVal(agg.non_promo_avg3)}</td>
              <td class="num">${fmtPct(agg.non_promo_mom_pct)}</td>
              <td class="num">${fmtPct(agg.non_promo_vs_avg3_pct)}</td>
              <td class="num">${shareCell(agg.non_promo_share_this, agg.non_promo_share_prev)}<div style="font-size:10px;color:#9ca3af;">3M ${agg.non_promo_share_avg3 != null ? agg.non_promo_share_avg3.toFixed(1) + "%" : "—"}</div></td>
            </tr>
            <tr style="background:#f9fafb;font-weight:600;">
              <td class="name">Total</td>
              <td class="num">${unitVal(agg.total_this)}</td>
              <td class="num">${unitVal(agg.total_prev)}</td>
              <td class="num">${unitVal(agg.total_avg3)}</td>
              <td class="num">—</td>
              <td class="num">—</td>
              <td class="num">100.0%</td>
            </tr>
          </tbody>
        </table>` : ""
      }
      <h3 style="font-size:11px;color:#1e3a5f;margin:10px 0 6px;">Per-Promo MoM / 3M-avg &amp; Share within Promotion</h3>
      <table>
        <thead><tr>
          <th>Promo</th>
          <th class="num">Participants</th>
          <th class="num">This</th>
          <th class="num">Prev</th>
          <th class="num">3M avg</th>
          <th class="num">MoM</th>
          <th class="num">vs 3M avg</th>
          <th class="num">Share of Promo</th>
          <th class="num">Share of Total</th>
        </tr></thead>
        <tbody>
          ${promos.map(p => `
            <tr>
              <td class="name">${esc(p.promo)}</td>
              <td class="num">${p.participants} / ${p.total_shops}</td>
              <td class="num">${unitVal(p.this)}</td>
              <td class="num">${unitVal(p.prev)}</td>
              <td class="num">${unitVal(p.avg3)}</td>
              <td class="num">${fmtPct(p.mom_pct)}</td>
              <td class="num">${fmtPct(p.vs_avg3_pct)}</td>
              <td class="num">${shareCell(p.share_of_promo_this, p.share_of_promo_prev)}<div style="font-size:10px;color:#9ca3af;">3M ${p.share_of_promo_avg3 != null ? p.share_of_promo_avg3.toFixed(1) + "%" : "—"}</div></td>
              <td class="num">${shareCell(p.share_of_total_this, p.share_of_total_prev)}<div style="font-size:10px;color:#9ca3af;">3M ${p.share_of_total_avg3 != null ? p.share_of_total_avg3.toFixed(1) + "%" : "—"}</div></td>
            </tr>
          `).join("") || `<tr><td colspan="9" style="color:#9ca3af;text-align:center;padding:14px;">No promos active in this month.</td></tr>`}
        </tbody>
      </table>
      <div class="notes">
        <b>Participants</b> = shops whose this-month sales rows qualify for the promo (PCLT + dc_rate + min_qty + customer + period match).
        <b>Share of Promo</b> = this promo's qty ÷ sum of qty across the three promos (deduped, shops in multiple promos counted once on the aggregate).
        <b>Share of Total</b> = this promo's qty ÷ total month qty.
      </div>
    </div>
  `);

  // ⑤ Sold-to movement
  const sold = j.sold_to || {};
  const gainers = sold.gainers || [];
  const losers  = sold.losers || [];
  const newlyA  = sold.newly_active || [];
  const newlyS  = sold.newly_silent || [];
  html.push(`
    <div class="card">
      <h2>⑤ Sold-to Movement</h2>
      <div class="section-grid2">
        <div>
          <h3 style="font-size:11px;color:#16a34a;margin:6px 0 6px;">🟢 Biggest Gainers (Top 30 by Δ)</h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">Prev</th>
              <th class="num">This</th>
              <th class="num">Δ</th>
              <th class="num">Δ%</th>
            </tr></thead>
            <tbody>
              ${gainers.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.prev)}</td>
                  <td class="num">${unitVal(r.this)}</td>
                  <td class="num delta-up">+${unitVal(r.delta)}</td>
                  <td class="num">${fmtPct(r.delta_pct)}</td>
                </tr>
              `).join("") || `<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:14px;">No gainers this month.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div>
          <h3 style="font-size:11px;color:#dc2626;margin:6px 0 6px;">🔴 Biggest Losers (Top 30 by Δ)</h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">Prev</th>
              <th class="num">This</th>
              <th class="num">Δ</th>
              <th class="num">Δ%</th>
            </tr></thead>
            <tbody>
              ${losers.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.prev)}</td>
                  <td class="num">${unitVal(r.this)}</td>
                  <td class="num delta-dn">${unitVal(r.delta)}</td>
                  <td class="num">${fmtPct(r.delta_pct)}</td>
                </tr>
              `).join("") || `<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:14px;">No losers this month.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="section-grid2" style="margin-top:12px;">
        <div>
          <h3 style="font-size:11px;color:#1d4ed8;margin:6px 0 6px;">🆕 Newly Active <span style="color:#9ca3af;font-weight:500;">(${newlyA.length})</span></h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">This month</th>
            </tr></thead>
            <tbody>
              ${newlyA.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.this)}</td>
                </tr>
              `).join("") || `<tr><td colspan="2" style="color:#9ca3af;text-align:center;padding:14px;">No newly active sold-to.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div>
          <h3 style="font-size:11px;color:#7c3aed;margin:6px 0 6px;">💤 Newly Silent <span style="color:#9ca3af;font-weight:500;">(${newlyS.length})</span></h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">Prev month</th>
            </tr></thead>
            <tbody>
              ${newlyS.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.prev)}</td>
                </tr>
              `).join("") || `<tr><td colspan="2" style="color:#9ca3af;text-align:center;padding:14px;">No newly silent sold-to.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="notes">
        <b>Gainers / Losers</b>: computed over the <b>full sold-to set</b> with Δ = this-month − previous-month, then the top 30 by absolute Δ on each side are shown.<br>
        <b>Newly Active</b>: ${esc(sold.notes && sold.notes.newly_active || "Sold-to with zero sales in the previous 3 months AND positive sales this month.")} Full list shown.<br>
        <b>Newly Silent</b>: ${esc(sold.notes && sold.notes.newly_silent || "Sold-to with positive sales in the previous month AND zero sales this month.")} Full list shown.
      </div>
    </div>
  `);

  wrap.innerHTML = html.join("");
  // Keep status div hidden but available for next load
  const refreshed = document.getElementById("status");
  if (refreshed) refreshed.style.display = "none";
}

// Boot — default month to the current calendar month if it's in 2026.
(function(){
  const today = new Date();
  const sel = document.getElementById("monthSel");
  if (today.getFullYear() === 2026) {
    const want = `2026-${String(today.getMonth() + 1).padStart(2, "0")}`;
    for (const o of sel.options) { if (o.value === want) { sel.value = want; break; } }
  }
  load();
})();
</script>
</body>
</html>
