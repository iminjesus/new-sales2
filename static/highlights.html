<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Highlights</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.toolbar{position:sticky;top:0;z-index:900;padding:10px 18px;background:#1e3a5f;color:#fff;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.toolbar h1{font-size:14px;font-weight:700;margin:0;margin-right:14px}
.toolbar select,.toolbar button{background:#fff;color:#111827;border:none;
  border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer}
.toolbar button.active{background:#2563eb;color:#fff;font-weight:700}
.toolbar .nav{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.toolbar .nav a{color:#cbd5e1;font-size:12px;text-decoration:none;
  padding:5px 10px;border-radius:5px}
.toolbar .nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.toolbar .nav a.here{background:#fff;color:#1e3a5f;font-weight:700}

.wrap{padding:20px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:12px;font-weight:700;color:#1e3a5f;margin:0 0 12px;
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:8px;border-bottom:1px solid #e5e7eb}

/* Summary KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{padding:10px 12px;border:1px solid #f1f5f9;border-radius:6px;background:#fafafa}
.kpi .label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
.kpi .value{font-size:22px;font-weight:700;color:#1e3a5f;margin-top:2px;
  font-family:ui-monospace,Menlo,monospace}
.kpi .sub{font-size:11px;color:#6b7280;margin-top:2px}
.delta-up{color:#16a34a;font-weight:700}
.delta-dn{color:#dc2626;font-weight:700}
.delta-fl{color:#9ca3af}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #f1f5f9}
th{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;
  background:#fafafa;position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,monospace}
td.name{font-weight:500;color:#1e3a5f}

.section-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.section-grid2{grid-template-columns:1fr}}

.notes{font-size:11px;color:#6b7280;font-style:italic;margin-top:8px;line-height:1.5}
.notes b{color:#374151;font-style:normal}
.status-msg{padding:30px;text-align:center;color:#6b7280;font-size:13px}
.status-msg.err{color:#dc2626;font-weight:600}

/* Floating loading badge — pinned top-center while a fetch is in
   flight.  Highlights queries can take several seconds when a half-
   year or state filter is on, so the user needs a clear "we're
   working on it" signal between the click and the new render. */
#loadingBadge {
  position: fixed; top: 12px; left: 50%;
  transform: translate(-50%, -120%);
  z-index: 10000;
  display: flex; align-items: center; gap: 8px;
  background: #1e3a8a; color: #fff;
  border-radius: 18px; padding: 6px 14px 6px 12px;
  font-size: 12px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(30,58,138,0.35);
  opacity: 0;
  transition: transform 180ms ease, opacity 180ms ease;
  pointer-events: none;
}
body[data-loading="1"] #loadingBadge {
  transform: translate(-50%, 0);
  opacity: 1;
}
body[data-loading="1"] { cursor: progress; }
body[data-loading="1"] .toolbar button,
body[data-loading="1"] .toolbar select { cursor: progress !important; opacity: 0.65; pointer-events: none; }
body[data-loading="1"] #wrap { opacity: 0.55; transition: opacity 120ms ease; pointer-events: none; }
#loadingBadge .lb-spin {
  display: inline-block;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  animation: lbSpin 0.7s linear infinite;
}
@keyframes lbSpin { to { transform: rotate(360deg); } }

/* Remarkable card — one-sentence headlines that expand to detail.
   Each item is a <details>: native browser expand/collapse + zero
   JS state to manage.  Summary line stays compact; the detail
   panel slides in with a soft background so the "what's behind
   this fact" feels like a drill rather than a wall of numbers. */
.card.remarkable h2 { color: #b45309; }
/* Decline analysis card — always renders after Remarkable so the
   reader can see WHICH slices fell (and how much), even when the
   monthly total actually rose. */
.decl-headline { padding:8px 12px; background:#fef2f2; border-radius:5px;
  margin-bottom:10px; font-size:13px; color:#1f2937; }
.decl-block { margin-top:10px; }
.decl-block h4 { margin:0 0 4px 0; font-size:11px; color:#64748b;
  font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.decl-row { display:grid; grid-template-columns: 1fr auto auto;
  gap:8px; padding:4px 8px; font-size:12.5px;
  border-bottom:1px solid #f1f5f9; align-items:baseline; }
.decl-row:last-child { border-bottom:none; }
.decl-key { color:#334155; font-weight:500; }
.decl-change { color:#dc2626; font-weight:700;
  font-variant-numeric:tabular-nums; text-align:right; }
.decl-pct { color:#f87171; font-weight:500; margin-left:2px; }
.decl-sub { color:#94a3b8; font-size:11px;
  font-variant-numeric:tabular-nums; text-align:right; }
.decl-cross { padding:6px 10px; background:#fafafa;
  border-left:3px solid #dc2626; border-radius:3px;
  margin-bottom:4px; font-size:12.5px; color:#334155; }
.decl-cross .decl-inline b { color:#dc2626; font-variant-numeric:tabular-nums; }

/* 📖 Narrative card — 3 sentences at the very top of the report.
   Larger type + soft indigo panel so the story reads like a lead
   paragraph, not another data row. */
.card.narrative h2 { color:#1e40af; }
.card.narrative .story p {
  margin:0 0 8px; font-size:14px; line-height:1.55;
  color:#1e293b;
}
.card.narrative .story p:last-child { margin-bottom:0; }
.card.narrative .story p:first-child { font-weight:600; }

/* 🚀 Trajectory card */
.tr-headline { padding:8px 12px; background:#f8fafc; border-radius:5px;
  margin-bottom:10px; font-size:13px; color:#334155; }
.tr-chart { display:flex; align-items:flex-end; gap:6px;
  height:120px; padding:6px 4px; border-bottom:1px solid #e5e7eb; }
.tr-bar { flex:1 1 0; display:flex; flex-direction:column;
  align-items:center; gap:2px; min-width:0; }
.tr-fill { width:60%; min-height:2px; border-radius:2px 2px 0 0; }
.tr-label { font-size:10px; color:#64748b; margin-top:4px; }
.tr-value { font-size:10px; color:#334155;
  font-variant-numeric:tabular-nums; }
.tr-run { display:flex; align-items:center; gap:6px; margin-top:8px;
  font-size:11px; }
.tr-step { display:inline-block; width:18px; height:18px;
  border-radius:3px; text-align:center; line-height:18px;
  font-weight:700; font-size:12px; }
.tr-step.up { background:#dcfce7; color:#166534; }
.tr-step.dn { background:#fee2e2; color:#991b1b; }
.tr-step.fl { background:#f1f5f9; color:#64748b; }
.tr-flag { display:inline-block; margin-left:12px; padding:1px 8px;
  border-radius:10px; font-size:11px; font-weight:600; }
.tr-flag.good { background:#dcfce7; color:#166534; }
.tr-flag.bad  { background:#fee2e2; color:#991b1b; }

/* 🎯 Watch list */
.wl-block { margin-top:8px; }
.wl-block h4 { margin:0 0 4px 0; font-size:11px; color:#64748b;
  font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.wl-row { display:grid; grid-template-columns: minmax(0,auto) 1fr;
  gap:12px; padding:5px 8px; font-size:12.5px;
  border-bottom:1px solid #f1f5f9; align-items:baseline; }
.wl-row:last-child { border-bottom:none; }
.wl-row.wl-esc { background:#fef2f2; border-left:3px solid #dc2626;
  border-radius:3px; margin-bottom:2px; }
.wl-reason { color:#334155; font-weight:600; }
.wl-name { color:#1e40af; font-weight:500; }
.wl-detail { color:#64748b; font-size:12px; }

/* 📊 Mix shift */
.mx-note { color:#94a3b8; font-weight:400; font-size:11px;
  text-transform:none; letter-spacing:0; margin-left:6px; }
.mx-lead { font-size:11px; color:#64748b; font-weight:600;
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.mx-tbl { font-size:12px; }
.mx-tbl th { padding:4px 8px; }
.mx-tbl td { padding:3px 8px; }
.mx-up { color:#16a34a; font-weight:700;
  font-variant-numeric:tabular-nums; }
.mx-dn { color:#dc2626; font-weight:700;
  font-variant-numeric:tabular-nums; }
.mx-fl { color:#94a3b8; font-variant-numeric:tabular-nums; }
.rem-list { display:flex; flex-direction:column; gap:6px; }
.rem-item { border:1px solid #fef3c7; border-radius:6px;
  background:#fffbeb; }
.rem-item[open] { border-color:#fbbf24; box-shadow:0 1px 3px rgba(180,83,9,0.08); }
.rem-item summary {
  list-style:none; cursor:pointer; padding:9px 12px;
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:500; color:#1f2937;
}
.rem-item summary::-webkit-details-marker { display:none; }
.rem-item summary::before {
  content:"▸"; color:#b45309; font-size:11px; flex:0 0 auto;
  transition:transform 120ms ease;
}
.rem-item[open] summary::before { transform:rotate(90deg); }
.rem-item .rem-chip {
  display:inline-block; font-size:10px; font-weight:700;
  padding:2px 7px; border-radius:9px;
  background:#fde68a; color:#78350f; letter-spacing:.3px;
  text-transform:uppercase; flex:0 0 auto;
}
.rem-item .rem-chip.bad  { background:#fecaca; color:#7f1d1d; }
.rem-item .rem-chip.good { background:#bbf7d0; color:#14532d; }
.rem-item .rem-chip.info { background:#dbeafe; color:#1e3a8a; }
.rem-item .rem-detail {
  padding:8px 14px 12px; border-top:1px dashed #fde68a;
  font-size:12px; color:#4b5563; line-height:1.55;
}
.rem-item .rem-detail b { color:#111827; }
.rem-item .rem-detail table { margin-top:6px; max-width:480px; }
.rem-item .rem-detail table th { background:transparent; padding:3px 8px 3px 0; }
.rem-item .rem-detail table td { padding:3px 8px 3px 0; border-bottom:1px solid #fef3c7; }
</style>
</head>
<body>
<div class="toolbar">
  <h1>📊 Monthly Highlights</h1>
  <label>Month
    <select id="monthSel">
      <option value="2026-01">2026 January</option>
      <option value="2026-02">2026 February</option>
      <option value="2026-03">2026 March</option>
      <option value="2026-04">2026 April</option>
      <option value="2026-05">2026 May</option>
      <option value="2026-06" selected>2026 June</option>
      <option value="2026-H1">2026 1st Half (Jan–Jun)</option>
    </select>
  </label>
  <div id="stateBtns" style="display:flex;gap:4px;">
    <button data-state=""    class="active">All States</button>
    <button data-state="NSW">NSW</button>
    <button data-state="QLD">QLD</button>
    <button data-state="VIC">VIC</button>
    <button data-state="WA">WA</button>
  </div>
  <div class="nav">
    <a href="/">Graph</a>
    <a href="/map">Map</a>
    <a href="/stock">Stock</a>
    <a href="/rebate">Rebate</a>
    <a href="/price">Price</a>
    <a href="/meeting">Meeting</a>
    <a href="/claims">Claims</a>
    <a href="/order">📝 Order</a>
    <a href="/highlights" class="here">📊 Highlights</a>
  </div>
</div>

<div id="loadingBadge" aria-hidden="true">
  <span class="lb-spin"></span>
  <span>Loading highlights…</span>
</div>

<div class="wrap" id="wrap">
  <div class="status-msg" id="status">Loading…</div>
</div>

<script>
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmtNum(n){
  if (n == null) return "—";
  return Math.round(n).toLocaleString();
}
function fmtPct(p){
  if (p == null) return "—";
  const cls = p > 0 ? "delta-up" : (p < 0 ? "delta-dn" : "delta-fl");
  const sign = p > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${p.toFixed(1)}%</span>`;
}
function fmtPpt(p){
  if (p == null) return "—";
  const cls = p > 0 ? "delta-up" : (p < 0 ? "delta-dn" : "delta-fl");
  const sign = p > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${p.toFixed(1)} ppt</span>`;
}

// Highlights page is qty-only — the team analyses units, not AUD.
const metric = "qty";
let stateFilter = "";  // "" = all states; otherwise NSW/QLD/VIC/WA

document.getElementById("monthSel").addEventListener("change", load);
document.getElementById("stateBtns").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-state]");
  if (!btn) return;
  stateFilter = btn.dataset.state || "";
  document.querySelectorAll("#stateBtns button").forEach(b =>
    b.classList.toggle("active", (b.dataset.state || "") === stateFilter));
  load();
});

async function load(){
  const wrap = document.getElementById("wrap");
  const status = document.getElementById("status");
  if (status) { status.className = "status-msg"; status.textContent = "Loading…"; status.style.display = ""; }
  // Flip body[data-loading] so the floating badge slides in and the
  // previously-rendered cards dim — half-year + state filter queries
  // can take several seconds and the page used to look frozen.
  document.body.setAttribute("data-loading", "1");
  const month = document.getElementById("monthSel").value;
  try {
    const stateQs = stateFilter ? `&state=${encodeURIComponent(stateFilter)}` : "";
    const r = await fetch(`/api/monthly_highlights?month=${encodeURIComponent(month)}&metric=${metric}${stateQs}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    render(j);
  } catch (e) {
    if (status) { status.className = "status-msg err"; status.textContent = "Error: " + e.message; }
  } finally {
    document.body.removeAttribute("data-loading");
  }
}

function unitLabel(){ return metric === "qty" ? "units" : "$"; }
function unitVal(v){
  if (v == null) return "—";
  return metric === "qty" ? fmtNum(v) : "$" + fmtNum(v);
}

// ────────── Remarkable: derive the few "look at this" facts ──────────
// Each entry: { tone: 'good'|'bad'|'info', chip: 'YoY'|'MoM'|..., line: '...', detail: '...html...' }
// We score candidates and keep the top ~5 to avoid burying the user.
function buildRemarkable(j){
  const items = [];

  const sum = j.summary || {};
  const v3  = sum.vs_avg3_pct;
  const isRange = !!j.is_range;
  // Range mode anchors on prev period (M-1 ≡ prev half) + YoY since
  // "vs 3M avg" doesn't apply to a 6-month window.
  const anchorPct = isRange ? sum.mom_pct : v3;
  const anchorChip = isRange ? "vs Prev 6M" : "vs 3M avg";
  const anchorWord = isRange ? "the previous 6 months" : "the 3-month average";

  // Total swing if material (>= 5%).
  if (anchorPct != null && Math.abs(anchorPct) >= 5) {
    const tone = anchorPct > 0 ? "good" : "bad";
    const dir  = anchorPct > 0 ? "up" : "down";
    const baselineVal = isRange ? sum.prev?.[metric] : sum.avg3?.[metric];
    items.push({
      score: Math.abs(anchorPct) * 2,
      chip: anchorChip, tone,
      line: `Total sales are <b>${dir} ${Math.abs(anchorPct).toFixed(1)}%</b> vs ${anchorWord} (${unitVal(sum.this?.[metric])} vs ${unitVal(baselineVal)}).`,
      detail: `<b>${isRange ? "Period" : "This month"}:</b> ${unitVal(sum.this?.[metric])}<br>
               <b>${isRange ? "Previous 6 months" : "3-month average"}:</b> ${unitVal(baselineVal)}<br>
               <b>YoY same ${isRange ? "half" : "month"}:</b> ${unitVal(sum.py?.[metric])} (${fmtPct(sum.yoy_pct)})<br>
               <b>Daily avg:</b> ${unitVal(sum.daily_avg)} across ${sum.working_days || "—"} working days.`
    });
  }
  // YoY callout in range mode (it's the most natural "this half vs
  // last year same half" comparison).
  if (isRange && sum.yoy_pct != null && Math.abs(sum.yoy_pct) >= 5) {
    const tone = sum.yoy_pct > 0 ? "good" : "bad";
    const dir  = sum.yoy_pct > 0 ? "up" : "down";
    items.push({
      score: Math.abs(sum.yoy_pct) * 1.5,
      chip: "vs Same 6M LY", tone,
      line: `Period vs last year's same half: <b>${dir} ${Math.abs(sum.yoy_pct).toFixed(1)}%</b> (${unitVal(sum.this?.[metric])} vs ${unitVal(sum.py?.[metric])}).`,
      detail: `<b>This period:</b> ${unitVal(sum.this?.[metric])}<br>
               <b>Same half last year:</b> ${unitVal(sum.py?.[metric])}`
    });
  }

  // Region: biggest vs-anchor mover (vs 3M avg in single-month mode,
  // vs prev 6M in range mode).
  const regionMetric = isRange ? "mom_pct" : "vs_avg3_pct";
  const regions = (j.regions || []).filter(r => r.region && r.region !== "COMMON" && r[regionMetric] != null);
  if (regions.length) {
    const byAnchor = [...regions].sort(
      (a,b) => Math.abs(b[regionMetric]) - Math.abs(a[regionMetric]));
    const top = byAnchor[0];
    if (top && Math.abs(top[regionMetric]) >= 10) {
      const v = top[regionMetric];
      const tone = v > 0 ? "good" : "bad";
      const dir  = v > 0 ? "up" : "down";
      items.push({
        score: Math.abs(v) * 1.2,
        chip: `Region · ${top.region}`, tone,
        line: `<b>${esc(top.region)}</b> is <b>${dir} ${Math.abs(v).toFixed(1)}% ${anchorChip}</b> — biggest regional swing this ${isRange ? "period" : "month"}.`,
        detail: `<table>
          <tr><th>${isRange ? "Period" : "This month"}</th><td>${unitVal(top.this)}</td></tr>
          ${isRange ? "" : `<tr><th>3M average</th><td>${unitVal(top.avg3)}</td></tr>`}
          ${isRange ? "" : `<tr><th>vs 3M avg</th><td>${fmtPct(top.vs_avg3_pct)}</td></tr>`}
          <tr><th>${isRange ? "vs Prev 6M" : "vs Prev M"}</th><td>${fmtPct(top.mom_pct)}</td></tr>
          <tr><th>${isRange ? "vs Same 6M LY" : "vs Prev Y"}</th><td>${fmtPct(top.yoy_pct)}</td></tr>
          <tr><th>Share of total</th><td>${top.share != null ? top.share.toFixed(1) + "%" : "—"}</td></tr>
        </table>`
      });
    }
  }

  // Product Group: surface the biggest riser AND biggest faller
  // separately, so the reader always sees which real product grew
  // and which shrank in the period.  Skip anything below the share
  // floor / without a real name — a brand-new product jumping
  // "+98% from a tiny base" is noise.  Threshold lowered to ±5% so
  // the callouts actually show up on months with modest swings.
  const PG_MIN_SHARE = 3.0;
  const PG_MIN_SWING = 5.0;
  const pgMetric = isRange ? "mom_pct" : "vs_avg3_pct";
  const pgs = (j.product_groups || []).filter(p =>
    p.product_group && String(p.product_group).trim() !== "" && String(p.product_group).trim() !== "—"
    && p[pgMetric] != null
    && (p.this || 0) > 0
    && (p.share == null || p.share >= PG_MIN_SHARE));
  function _pgItem(row, kind){
    const v    = row[pgMetric];
    const tone = kind === "up" ? "good" : "bad";
    const chip = kind === "up" ? "Product · biggest gainer" : "Product · biggest faller";
    const dir  = kind === "up" ? "surged" : "dropped";
    return {
      score: Math.abs(v) + 10,   // small bump so product items keep priority
      chip, tone,
      line: `<b>${esc(row.product_group)}</b> ${dir} <b>${Math.abs(v).toFixed(1)}% ${anchorChip}</b> (now ${unitVal(row.this)}, ${row.share != null ? row.share.toFixed(1) + "%" : "—"} share).`,
      detail: `<table>
        <tr><th>${isRange ? "Period" : "This month"}</th><td>${unitVal(row.this)}</td></tr>
        ${isRange ? "" : `<tr><th>3M average</th><td>${unitVal(row.avg3)}</td></tr>`}
        ${isRange ? "" : `<tr><th>vs 3M avg</th><td>${fmtPct(row.vs_avg3_pct)}</td></tr>`}
        <tr><th>${isRange ? "vs Prev 6M" : "vs Prev M"}</th><td>${fmtPct(row.mom_pct)}</td></tr>
        <tr><th>${isRange ? "vs Same 6M LY" : "vs Prev Y"}</th><td>${fmtPct(row.yoy_pct)}</td></tr>
        <tr><th>Share</th><td>${row.share != null ? row.share.toFixed(1) + "%" : "—"}</td></tr>
      </table>`
    };
  }
  if (pgs.length) {
    const risers  = pgs.filter(p => p[pgMetric] >  0).sort((a,b) => b[pgMetric] - a[pgMetric]);
    const fallers = pgs.filter(p => p[pgMetric] <  0).sort((a,b) => a[pgMetric] - b[pgMetric]);
    if (risers.length  && Math.abs(risers[0][pgMetric])  >= PG_MIN_SWING) items.push(_pgItem(risers[0],  "up"));
    if (fallers.length && Math.abs(fallers[0][pgMetric]) >= PG_MIN_SWING) items.push(_pgItem(fallers[0], "down"));
  }

  // Promo vs Non-Promo share swing — vs anchor share.
  const agg = j.promo_aggregate;
  const aggShareBaseline = isRange ? agg?.promo_share_prev : agg?.promo_share_avg3;
  if (agg && agg.promo_share_this != null && aggShareBaseline != null) {
    const delta = +(agg.promo_share_this - aggShareBaseline).toFixed(1);
    if (Math.abs(delta) >= 3) {
      const tone = delta > 0 ? "good" : "bad";
      const dir  = delta > 0 ? "up" : "down";
      items.push({
        score: Math.abs(delta) * 4,
        chip: "Promo mix", tone,
        line: `Promo share is <b>${dir} ${Math.abs(delta).toFixed(1)} ppt ${anchorChip}</b> (${agg.promo_share_this.toFixed(1)}% vs ${aggShareBaseline.toFixed(1)}%).`,
        detail: `<table>
          <tr><th>Promo ${isRange ? "period" : "this"}</th><td>${unitVal(agg.promo_this)} (${agg.promo_share_this.toFixed(1)}%)</td></tr>
          <tr><th>Promo ${isRange ? "prev 6M" : "3M avg"}</th><td>${unitVal(isRange ? agg.promo_prev : agg.promo_avg3)} (${aggShareBaseline.toFixed(1)}%)</td></tr>
          <tr><th>Non-Promo this</th><td>${unitVal(agg.non_promo_this)} (${agg.non_promo_share_this != null ? agg.non_promo_share_this.toFixed(1) + "%" : "—"})</td></tr>
          <tr><th>Promo ${anchorChip}</th><td>${fmtPct(isRange ? agg.promo_mom_pct : agg.promo_vs_avg3_pct)}</td></tr>
          <tr><th>Non-Promo ${anchorChip}</th><td>${fmtPct(isRange ? agg.non_promo_mom_pct : agg.non_promo_vs_avg3_pct)}</td></tr>
        </table>`
      });
    }
  }

  // Per-promo: biggest vs-anchor mover among 443 / iON / TrueBlue.
  const promoMetric = isRange ? "mom_pct" : "vs_avg3_pct";
  const promos = (j.promotions || []).filter(p => p[promoMetric] != null && (p.this || 0) > 0);
  if (promos.length) {
    const byAnchor = [...promos].sort((a,b) => Math.abs(b[promoMetric]) - Math.abs(a[promoMetric]));
    const top = byAnchor[0];
    if (top && Math.abs(top[promoMetric]) >= 5) {
      const v = top[promoMetric];
      const tone = v > 0 ? "good" : "bad";
      const dir  = v > 0 ? "up" : "down";
      items.push({
        score: Math.abs(v) * 1.5,
        chip: `Promo · ${top.promo}`, tone,
        line: `<b>${esc(top.promo)}</b> is <b>${dir} ${Math.abs(v).toFixed(1)}% ${anchorChip}</b> (${unitVal(top.this)}, ${top.share_of_promo_this != null ? top.share_of_promo_this.toFixed(1) + "% of total promo" : ""}).`,
        detail: `<table>
          <tr><th>Participants</th><td>${top.participants} / ${top.total_shops}</td></tr>
          <tr><th>${isRange ? "Period" : "This month"}</th><td>${unitVal(top.this)}</td></tr>
          <tr><th>${isRange ? "Prev 6M" : "3M average"}</th><td>${unitVal(isRange ? top.prev : top.avg3)}</td></tr>
          <tr><th>${anchorChip}</th><td>${fmtPct(v)}</td></tr>
          <tr><th>Share of Promo</th><td>${top.share_of_promo_this != null ? top.share_of_promo_this.toFixed(1) + "%" : "—"}</td></tr>
          <tr><th>Share of Total</th><td>${top.share_of_total_this != null ? top.share_of_total_this.toFixed(1) + "%" : "—"}</td></tr>
        </table>`
      });
    }
  }

  // Sold-to: biggest gainer / loser.  Range mode falls back to MoM
  // gainers/losers (which compare to prev period) since the
  // vs-3M-avg variant doesn't apply.
  //
  // Skip customers below a minimum activity threshold on BOTH sides
  // of the comparison — a shop that jumped from 5 → 500 units is
  // technically the "biggest %" mover but nobody cares about a shop
  // that small.  Require the baseline OR the current value to hit at
  // least SOLD_TO_MIN_QTY so we only surface real customers.
  const SOLD_TO_MIN_QTY = 100;
  const sold = j.sold_to || {};
  const _bigEnough = (r, key) =>
    r && ((+r.this || 0) >= SOLD_TO_MIN_QTY || (+r[key] || 0) >= SOLD_TO_MIN_QTY)
      && String(r.name || "").trim() !== "";
  const gainersList = (isRange ? (sold.gainers || []) : (sold.gainers_vs_avg3 || []))
    .filter(r => _bigEnough(r, isRange ? "prev" : "avg3"));
  const losersList  = (isRange ? (sold.losers  || []) : (sold.losers_vs_avg3  || []))
    .filter(r => _bigEnough(r, isRange ? "prev" : "avg3"));
  const customerChip = isRange ? "Customer · vs Prev 6M" : "Customer · vs 3M";
  const baselineLabel = isRange ? "Prev 6 months" : "3M average";
  const baselineKey   = isRange ? "prev" : "avg3";
  if (gainersList.length) {
    const g = gainersList[0];
    if (g && g.delta != null) {
      items.push({
        score: 30,
        chip: customerChip, tone: "good",
        line: `<b>${esc(g.name)}</b> is the ${isRange ? "period's" : "month's"} biggest gainer ${isRange ? "vs prev 6M" : "vs 3M avg"} — added <b>${unitVal(g.delta)}</b> (${fmtPct(g.delta_pct)}).`,
        detail: `<table>
          <tr><th>Sold-to</th><td>${esc(g.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;">#${esc(g.sold_to)}</span></td></tr>
          <tr><th>${baselineLabel}</th><td>${unitVal(g[baselineKey])}</td></tr>
          <tr><th>${isRange ? "Period" : "This month"}</th><td>${unitVal(g.this)}</td></tr>
          <tr><th>Delta</th><td><span class="delta-up">+${unitVal(g.delta)}</span> (${fmtPct(g.delta_pct)})</td></tr>
        </table>`
      });
    }
  }
  if (losersList.length) {
    const l = losersList[0];
    if (l && l.delta != null) {
      items.push({
        score: 30,
        chip: customerChip, tone: "bad",
        line: `<b>${esc(l.name)}</b> fell the most ${isRange ? "vs prev 6M" : "vs 3M avg"} — <b>${unitVal(l.delta)}</b> (${fmtPct(l.delta_pct)}).`,
        detail: `<table>
          <tr><th>Sold-to</th><td>${esc(l.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;">#${esc(l.sold_to)}</span></td></tr>
          <tr><th>${baselineLabel}</th><td>${unitVal(l[baselineKey])}</td></tr>
          <tr><th>${isRange ? "Period" : "This month"}</th><td>${unitVal(l.this)}</td></tr>
          <tr><th>Delta</th><td><span class="delta-dn">${unitVal(l.delta)}</span> (${fmtPct(l.delta_pct)})</td></tr>
        </table>`
      });
    }
  }

  // Newly active / silent counts (only when notable).
  const newA = sold.newly_active || [], newS = sold.newly_silent || [];
  if (newA.length >= 5) {
    items.push({
      score: 15 + newA.length * 0.3,
      chip: "Customer", tone: "info",
      line: `<b>${newA.length}</b> sold-tos came back this month after a 3-month silence.`,
      detail: `<div style="max-height:220px;overflow:auto;">
        <table>
          <tr><th>Sold-to</th><th class="num">This month</th></tr>
          ${newA.slice(0, 30).map(r => `
            <tr>
              <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
              <td class="num">${unitVal(r.this)}</td>
            </tr>`).join("")}
        </table>
        ${newA.length > 30 ? `<div class="notes">+ ${newA.length - 30} more — see Sold-to Movement section.</div>` : ""}
      </div>`
    });
  }
  if (newS.length >= 1) {
    items.push({
      score: 15 + newS.length * 0.5,
      chip: "Customer", tone: "bad",
      line: `<b>${newS.length}</b> steady customer${newS.length === 1 ? "" : "s"} went silent — had qty &gt; 100 in each of the last 3 months, zero this month.`,
      detail: `<div style="max-height:240px;overflow:auto;">
        <table>
          <tr><th>Sold-to</th><th class="num">3M avg</th><th class="num">M-3 / M-2 / M-1</th></tr>
          ${newS.slice(0, 30).map(r => `
            <tr>
              <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
              <td class="num">${unitVal(r.avg3)}</td>
              <td class="num" style="font-family:ui-monospace,monospace;font-size:11px;">${(r.trailing3 || []).slice().reverse().map(unitVal).join(" / ")}</td>
            </tr>`).join("")}
        </table>
        ${newS.length > 30 ? `<div class="notes">+ ${newS.length - 30} more — see Sold-to Movement section.</div>` : ""}
      </div>`
    });
  }

  // Rank by score, keep top 6 so the card stays scannable.
  items.sort((a, b) => b.score - a.score);
  return items.slice(0, 6);
}

function renderRemarkableCard(j){
  const items = buildRemarkable(j);
  if (!items.length) {
    return `<div class="card remarkable">
      <h2>🌟 Remarkable</h2>
      <div class="notes">Nothing especially out of the ordinary in this month.  Browse the sections below for the underlying detail.</div>
    </div>`;
  }
  return `<div class="card remarkable">
    <h2>🌟 Remarkable</h2>
    <div class="rem-list">
      ${items.map(it => `
        <details class="rem-item">
          <summary>
            <span class="rem-chip ${it.tone}">${esc(it.chip)}</span>
            <span>${it.line}</span>
          </summary>
          <div class="rem-detail">${it.detail}</div>
        </details>
      `).join("")}
    </div>
  </div>`;
}

// ── 📖 Narrative: 3-sentence auto story ──────────────────────
function renderNarrativeCard(j){
  const lines = j.narrative || [];
  if (!lines.length) return "";
  return `<div class="card narrative">
    <h2>📖 This month's story</h2>
    <div class="story">
      ${lines.map(l => `<p>${esc(l)}</p>`).join("")}
    </div>
  </div>`;
}

// ── 🚀 Trajectory: 6-month slope + run pattern ──────────────
function renderTrajectoryCard(j){
  const t = j.trajectory;
  if (!t) return "";
  const s = t.series || [];
  const dirColor = /decline/i.test(t.direction) ? "#dc2626"
                : /accel|growth/i.test(t.direction) ? "#16a34a"
                : "#64748b";
  const maxV = Math.max(...s.map(x => x.value)) || 1;
  const bars = s.map(x => {
    const h = Math.round(x.value / maxV * 100);
    return `<div class="tr-bar">
      <div class="tr-fill" style="height:${h}%;background:${dirColor};"></div>
      <div class="tr-label">${x.month.slice(5)}</div>
      <div class="tr-value">${unitVal(x.value)}</div>
    </div>`;
  }).join("");
  const runIcons = (t.run_pattern || []).map(step =>
    step === "up" ? '<span class="tr-step up">↑</span>'
    : step === "down" ? '<span class="tr-step dn">↓</span>'
    : '<span class="tr-step fl">→</span>'
  ).join("");
  const runNote = t.consecutive_up >= 3 ? `<span class="tr-flag good">${t.consecutive_up} months up in a row</span>`
                 : t.consecutive_down >= 3 ? `<span class="tr-flag bad">${t.consecutive_down} months down in a row</span>`
                 : "";
  const slopeLabel = t.slope_pct > 0 ? `+${t.slope_pct}% / month`
                   : `${t.slope_pct}% / month`;
  return `<div class="card">
    <h2>🚀 Trajectory (last 6 months + this)</h2>
    <div class="tr-headline" style="border-left:3px solid ${dirColor};">
      <b style="color:${dirColor};text-transform:capitalize;">${esc(t.direction)}</b>
      · slope <b>${slopeLabel}</b>
      ${runNote}
    </div>
    <div class="tr-chart">${bars}</div>
    <div class="tr-run">
      <span class="ctx-lbl">MoM steps</span>${runIcons}
    </div>
  </div>`;
}

// ── 🎯 Watch list: call + escalate ─────────────────────────
function renderWatchListCard(j){
  const w = j.watch_list;
  if (!w) return "";
  const call = w.call || [];
  const esc_ = w.escalate || [];
  if (!call.length && !esc_.length) {
    return `<div class="card">
      <h2>🎯 Watch list</h2>
      <div class="notes">Nothing on the watch list this month — customers steady and no escalations.</div>
    </div>`;
  }
  const callHtml = call.length ? `
    <div class="wl-block">
      <h4>📞 Call this week</h4>
      ${call.map(c => `
        <div class="wl-row">
          <span class="wl-reason">${esc(c.reason)}</span>
          <span class="wl-name">${esc(c.name || c.sold_to)}</span>
        </div>`).join("")}
    </div>` : "";
  const escHtml = esc_.length ? `
    <div class="wl-block">
      <h4>🚨 Escalate to SM</h4>
      ${esc_.map(e => `
        <div class="wl-row wl-esc">
          <span class="wl-reason">${esc(e.reason)}</span>
          <span class="wl-detail">${esc(e.detail)}</span>
        </div>`).join("")}
    </div>` : "";
  return `<div class="card">
    <h2>🎯 Watch list</h2>
    ${callHtml}${escHtml}
  </div>`;
}

// ── 📊 Mix shift: share vs 6 months ago ──────────────────────
function renderMixShiftCard(j){
  const m = j.mix_shift;
  if (!m) return "";
  const pgs = m.product_groups || [];
  const rims = m.rim_family || [];
  if (!pgs.length && !rims.length) return "";
  const anchorNote = `<span class="mx-note">${esc(m.anchor_now)} vs ${esc(m.anchor_prev)}</span>`;
  const rowsHtml = (rows, keyName, keyLabel) => rows.length ? `
    <table class="mx-tbl">
      <thead><tr>
        <th>${keyLabel}</th>
        <th class="num">Share now</th>
        <th class="num">6mo ago</th>
        <th class="num">Δpt</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const chg = r.share_change;
          const cls = chg > 0.5 ? "mx-up" : chg < -0.5 ? "mx-dn" : "mx-fl";
          return `<tr>
            <td>${esc(r[keyName])}</td>
            <td class="num">${r.share_now.toFixed(1)}%</td>
            <td class="num" style="color:#94a3b8;">${r.share_prev.toFixed(1)}%</td>
            <td class="num ${cls}">${chg > 0 ? "+" : ""}${chg.toFixed(1)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>` : "";
  return `<div class="card">
    <h2>📊 Mix shift ${anchorNote}</h2>
    <div class="section-grid2">
      <div>
        <div class="mx-lead">Product-group share</div>
        ${rowsHtml(pgs, "product_group", "Product group")}
      </div>
      <div>
        <div class="mx-lead">Rim-family share</div>
        ${rowsHtml(rims, "rim", "Rim family")}
      </div>
    </div>
  </div>`;
}

function renderDeclinesCard(j){
  const d = j.declines || {};
  const ov = d.overall || {};
  const regs = d.regions || [];
  const pgs  = d.product_groups || [];
  const cus  = d.customers || [];
  const cross = d.cross || [];
  const anyDecline = regs.length || pgs.length || cus.length;
  if (!anyDecline && ov.direction !== "down") {
    return `<div class="card">
      <h2>🔻 Decline analysis</h2>
      <div class="notes">Every region, product group, and top customer grew this month.  Nothing fell worth flagging.</div>
    </div>`;
  }
  const arrow = ov.direction === "down" ? "▼"
               : ov.direction === "up" ? "▲" : "—";
  const arrowClr = ov.direction === "down" ? "#dc2626"
                  : ov.direction === "up" ? "#16a34a" : "#64748b";
  const headline = ov.direction === "down"
    ? `Overall <b style="color:#dc2626;">down ${fmtPct(ov.pct)}</b> (${unitVal(ov.change)} vs prev)`
    : ov.direction === "up"
      ? `Overall up <b style="color:#16a34a;">${fmtPct(ov.pct)}</b> — but the below segments still fell:`
      : `Overall flat this month; individual segments below still moved.`;

  const regHtml = regs.length ? `
    <div class="decl-block">
      <h4>Regions that fell</h4>
      ${regs.map(r => `
        <div class="decl-row">
          <span class="decl-key">${esc(r.region)}</span>
          <span class="decl-change">${unitVal(r.change)} <span class="decl-pct">(${fmtPct(r.pct)})</span></span>
          <span class="decl-sub">prev ${unitVal(r.prev)} → ${unitVal(r.this)}</span>
        </div>`).join("")}
    </div>` : "";
  const pgHtml = pgs.length ? `
    <div class="decl-block">
      <h4>Product groups that fell</h4>
      ${pgs.map(r => `
        <div class="decl-row">
          <span class="decl-key">${esc(r.product_group)}</span>
          <span class="decl-change">${unitVal(r.change)} <span class="decl-pct">(${fmtPct(r.pct)})</span></span>
          <span class="decl-sub">prev ${unitVal(r.prev)} → ${unitVal(r.this)}</span>
        </div>`).join("")}
    </div>` : "";
  const cusHtml = cus.length ? `
    <div class="decl-block">
      <h4>Top customer losses (top 5)</h4>
      ${cus.map(r => `
        <div class="decl-row">
          <span class="decl-key">${esc(r.name || r.sold_to)}</span>
          <span class="decl-change">${unitVal(r.change)} <span class="decl-pct">(${fmtPct(r.pct)})</span></span>
          <span class="decl-sub">prev ${unitVal(r.prev)} → ${unitVal(r.this)}</span>
        </div>`).join("")}
    </div>` : "";
  const crossHtml = cross.length ? `
    <div class="decl-block">
      <h4>Where the top-declining regions lost ground</h4>
      ${cross.map(c => `
        <div class="decl-cross">
          <b>${esc(c.region)}</b> fell ${unitVal(c.region_change)} —
          concentrated in
          ${(c.product_declines || []).slice(0, 4).map(p =>
            `<span class="decl-inline">${esc(p.pg)} <b>${unitVal(p.change)}</b></span>`
          ).join(", ") || "no single product group"}.
        </div>`).join("")}
    </div>` : "";

  return `<div class="card">
    <h2>🔻 Decline analysis</h2>
    <div class="decl-headline" style="border-left:3px solid ${arrowClr};">
      <span style="color:${arrowClr};font-weight:700;">${arrow}</span>
      ${headline}
    </div>
    ${regHtml}${pgHtml}${cusHtml}${crossHtml}
  </div>`;
}

function render(j){
  const wrap = document.getElementById("wrap");
  const status = document.getElementById("status");
  if (status) status.style.display = "none";

  const sum = j.summary || {};
  const this_v = (sum.this || {})[metric] || 0;
  const prev_v = (sum.prev || {})[metric] || 0;
  const py_v   = (sum.py   || {})[metric] || 0;

  // Period mode: half-year compares to the previous half + same half
  // last year; "vs 3M avg" doesn't apply and is hidden.
  const isRange   = !!j.is_range;
  const prevLabel = isRange ? "vs Prev 6M"  : "vs Prev M";
  const yoyLabel  = isRange ? "vs Same 6M LY" : "vs Prev Y";
  const showAvg3  = !isRange;

  const html = [];

  // 📖 3-sentence story — the executive-summary lead sits before
  // Remarkable so a reader who only reads the top card walks away
  // with the month's narrative.
  html.push(renderNarrativeCard(j));

  // 🌟 Remarkable — sits above ① Summary; each line expands inline.
  html.push(renderRemarkableCard(j));

  // 🚀 Trajectory — 6-month slope + run pattern so MoM isn't read
  // in isolation.
  html.push(renderTrajectoryCard(j));

  // 🎯 Watch list — actionable "call this week" + "escalate to SM".
  html.push(renderWatchListCard(j));

  // 📊 Mix shift — product-group + rim-family share vs 6 months ago.
  html.push(renderMixShiftCard(j));

  // 🔻 Decline analysis — always renders, even when the total rose,
  // because the reader wants to see which segments still fell.
  html.push(renderDeclinesCard(j));

  // ① Summary
  const avg3_v = (sum.avg3 || {})[metric];
  html.push(`
    <div class="card">
      <h2>① Summary — ${esc(j.month)}</h2>
      <div class="kpis">
        <div class="kpi">
          <div class="label">${isRange ? "Period total" : "This month total"}</div>
          <div class="value">${unitVal(this_v)}</div>
          <div class="sub">${metric === "qty" ? "units" : "AUD"}</div>
        </div>
        <div class="kpi">
          <div class="label">${isRange ? "vs Previous 6 months" : "vs Previous month"}</div>
          <div class="value">${fmtPct(sum.mom_pct)}</div>
          <div class="sub">Prev: ${unitVal(prev_v)}</div>
        </div>
        ${showAvg3 ? `
        <div class="kpi">
          <div class="label">vs 3-month average</div>
          <div class="value">${fmtPct(sum.vs_avg3_pct)}</div>
          <div class="sub">3M avg: ${unitVal(avg3_v)}</div>
        </div>` : ""}
        <div class="kpi">
          <div class="label">${isRange ? "vs Same half last year" : "vs Same month last year"}</div>
          <div class="value">${fmtPct(sum.yoy_pct)}</div>
          <div class="sub">${isRange ? "Last year" : "Last year"}: ${unitVal(py_v)}</div>
        </div>
        <div class="kpi">
          <div class="label">Daily avg · Working days</div>
          <div class="value">${sum.daily_avg != null ? unitVal(sum.daily_avg) : "—"}</div>
          <div class="sub">${sum.working_days ? sum.working_days + " working days" : "—"}</div>
        </div>
      </div>
    </div>
  `);

  // ② Regions
  const regions = j.regions || [];
  html.push(`
    <div class="card">
      <h2>② Region</h2>
      <table>
        <thead><tr>
          <th>Region</th>
          <th class="num">${isRange ? "Period" : "This month"}</th>
          <th class="num">${prevLabel}</th>
          ${showAvg3 ? `<th class="num">vs 3M avg</th>` : ""}
          <th class="num">${yoyLabel}</th>
          <th class="num">Share</th>
        </tr></thead>
        <tbody>
          ${regions.map(r => `
            <tr>
              <td class="name">${esc(r.region)}</td>
              <td class="num">${unitVal(r.this)}</td>
              <td class="num">${fmtPct(r.mom_pct)}</td>
              ${showAvg3 ? `<td class="num">${fmtPct(r.vs_avg3_pct)}<div style="font-size:10px;color:#9ca3af;">${unitVal(r.avg3)}</div></td>` : ""}
              <td class="num">${fmtPct(r.yoy_pct)}</td>
              <td class="num">${r.share != null ? r.share.toFixed(1) + "%" : "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `);

  // ③ Product Groups (Top 10)
  const pgs = j.product_groups || [];
  html.push(`
    <div class="card">
      <h2>③ Product Group (Top 10 by ${isRange ? "period" : "this-month"} qty)</h2>
      <table>
        <thead><tr>
          <th>Product Group</th>
          <th class="num">${isRange ? "Period" : "This month"}</th>
          <th class="num">${prevLabel}</th>
          ${showAvg3 ? `<th class="num">vs 3M avg</th>` : ""}
          <th class="num">${yoyLabel}</th>
          <th class="num">Share</th>
        </tr></thead>
        <tbody>
          ${pgs.map(r => `
            <tr>
              <td class="name">${esc(r.product_group)}</td>
              <td class="num">${unitVal(r.this)}</td>
              <td class="num">${fmtPct(r.mom_pct)}</td>
              ${showAvg3 ? `<td class="num">${fmtPct(r.vs_avg3_pct)}<div style="font-size:10px;color:#9ca3af;">${unitVal(r.avg3)}</div></td>` : ""}
              <td class="num">${fmtPct(r.yoy_pct)}</td>
              <td class="num">${r.share != null ? r.share.toFixed(1) + "%" : "—"}</td>
            </tr>
          `).join("") || `<tr><td colspan="${showAvg3 ? 6 : 5}" style="color:#9ca3af;text-align:center;padding:14px;">No data for this period.</td></tr>`}
        </tbody>
      </table>
    </div>
  `);

  // ④ Promotion — three real promos only (443 / iON / TrueBlue),
  // plus a Promo vs Non-Promo aggregate split.  443_beforeTrueblue
  // (a backfill artefact) is filtered out backend-side.
  const promos = j.promotions || [];
  const agg    = j.promo_aggregate || null;
  const shareCell = (cur, prev) => {
    if (cur == null) return "—";
    const delta = (prev == null) ? null : +(cur - prev).toFixed(1);
    const sub = (delta == null)
      ? ""
      : `<div style="font-size:10px;color:#6b7280;">prev ${prev.toFixed(1)}% &nbsp;${
          delta > 0 ? '<span class="delta-up">+' + delta.toFixed(1) + ' ppt</span>'
                    : (delta < 0 ? '<span class="delta-dn">' + delta.toFixed(1) + ' ppt</span>'
                                 : '<span class="delta-fl">0.0 ppt</span>')
        }</div>`;
    return `<b>${cur.toFixed(1)}%</b>${sub}`;
  };
  html.push(`
    <div class="card">
      <h2>④ Promotion</h2>
      ${agg ? `
        <h3 style="font-size:11px;color:#1e3a5f;margin:4px 0 6px;">Promo vs Non-Promo</h3>
        <table style="margin-bottom:14px;">
          <thead><tr>
            <th>Bucket</th>
            <th class="num">${isRange ? "Period" : "This month"}</th>
            <th class="num">${isRange ? "Prev 6M" : "Prev month"}</th>
            ${showAvg3 ? `<th class="num">3M avg</th>` : ""}
            <th class="num">${prevLabel}</th>
            ${showAvg3 ? `<th class="num">vs 3M avg</th>` : ""}
            <th class="num">${showAvg3 ? "Share — this / prev / 3M" : "Share — this / prev"}</th>
          </tr></thead>
          <tbody>
            <tr>
              <td class="name">🎯 Promo (443 + iON + TrueBlue)</td>
              <td class="num">${unitVal(agg.promo_this)}</td>
              <td class="num">${unitVal(agg.promo_prev)}</td>
              ${showAvg3 ? `<td class="num">${unitVal(agg.promo_avg3)}</td>` : ""}
              <td class="num">${fmtPct(agg.promo_mom_pct)}</td>
              ${showAvg3 ? `<td class="num">${fmtPct(agg.promo_vs_avg3_pct)}</td>` : ""}
              <td class="num">${shareCell(agg.promo_share_this, agg.promo_share_prev)}${showAvg3 ? `<div style="font-size:10px;color:#9ca3af;">3M ${agg.promo_share_avg3 != null ? agg.promo_share_avg3.toFixed(1) + "%" : "—"}</div>` : ""}</td>
            </tr>
            <tr>
              <td class="name">⚪ Non-Promo</td>
              <td class="num">${unitVal(agg.non_promo_this)}</td>
              <td class="num">${unitVal(agg.non_promo_prev)}</td>
              ${showAvg3 ? `<td class="num">${unitVal(agg.non_promo_avg3)}</td>` : ""}
              <td class="num">${fmtPct(agg.non_promo_mom_pct)}</td>
              ${showAvg3 ? `<td class="num">${fmtPct(agg.non_promo_vs_avg3_pct)}</td>` : ""}
              <td class="num">${shareCell(agg.non_promo_share_this, agg.non_promo_share_prev)}${showAvg3 ? `<div style="font-size:10px;color:#9ca3af;">3M ${agg.non_promo_share_avg3 != null ? agg.non_promo_share_avg3.toFixed(1) + "%" : "—"}</div>` : ""}</td>
            </tr>
            <tr style="background:#f9fafb;font-weight:600;">
              <td class="name">Total</td>
              <td class="num">${unitVal(agg.total_this)}</td>
              <td class="num">${unitVal(agg.total_prev)}</td>
              ${showAvg3 ? `<td class="num">${unitVal(agg.total_avg3)}</td>` : ""}
              <td class="num">—</td>
              ${showAvg3 ? `<td class="num">—</td>` : ""}
              <td class="num">100.0%</td>
            </tr>
          </tbody>
        </table>` : ""
      }
      <h3 style="font-size:11px;color:#1e3a5f;margin:10px 0 6px;">Per-Promo ${showAvg3 ? "MoM / 3M-avg" : "MoM"} &amp; Share within Promotion</h3>
      <table>
        <thead><tr>
          <th>Promo</th>
          <th class="num">Participants</th>
          <th class="num">${isRange ? "Period" : "This"}</th>
          <th class="num">${isRange ? "Prev 6M" : "Prev"}</th>
          ${showAvg3 ? `<th class="num">3M avg</th>` : ""}
          <th class="num">${prevLabel}</th>
          ${showAvg3 ? `<th class="num">vs 3M avg</th>` : ""}
          <th class="num">Share of Promo</th>
          <th class="num">Share of Total</th>
        </tr></thead>
        <tbody>
          ${promos.map(p => `
            <tr>
              <td class="name">${esc(p.promo)}</td>
              <td class="num">${p.participants} / ${p.total_shops}</td>
              <td class="num">${unitVal(p.this)}</td>
              <td class="num">${unitVal(p.prev)}</td>
              ${showAvg3 ? `<td class="num">${unitVal(p.avg3)}</td>` : ""}
              <td class="num">${fmtPct(p.mom_pct)}</td>
              ${showAvg3 ? `<td class="num">${fmtPct(p.vs_avg3_pct)}</td>` : ""}
              <td class="num">${shareCell(p.share_of_promo_this, p.share_of_promo_prev)}${showAvg3 ? `<div style="font-size:10px;color:#9ca3af;">3M ${p.share_of_promo_avg3 != null ? p.share_of_promo_avg3.toFixed(1) + "%" : "—"}</div>` : ""}</td>
              <td class="num">${shareCell(p.share_of_total_this, p.share_of_total_prev)}${showAvg3 ? `<div style="font-size:10px;color:#9ca3af;">3M ${p.share_of_total_avg3 != null ? p.share_of_total_avg3.toFixed(1) + "%" : "—"}</div>` : ""}</td>
            </tr>
          `).join("") || `<tr><td colspan="${showAvg3 ? 9 : 7}" style="color:#9ca3af;text-align:center;padding:14px;">No promos active in this period.</td></tr>`}
        </tbody>
      </table>
      <div class="notes">
        <b>Participants</b> = shops whose this-month sales rows qualify for the promo (PCLT + dc_rate + min_qty + customer + period match).
        <b>Share of Promo</b> = this promo's qty ÷ sum of qty across the three promos (deduped, shops in multiple promos counted once on the aggregate).
        <b>Share of Total</b> = this promo's qty ÷ total month qty.
      </div>
    </div>
  `);

  // ⑤ Sold-to movement
  const sold = j.sold_to || {};
  const gainers = sold.gainers || [];
  const losers  = sold.losers || [];
  const newlyA  = sold.newly_active || [];
  const newlyS  = sold.newly_silent || [];
  html.push(`
    <div class="card">
      <h2>⑤ Sold-to Movement</h2>
      <div class="section-grid2">
        <div>
          <h3 style="font-size:11px;color:#16a34a;margin:6px 0 6px;">🟢 Biggest Gainers (Top 30 by Δ)</h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">Prev</th>
              <th class="num">This</th>
              <th class="num">Δ</th>
              <th class="num">Δ%</th>
            </tr></thead>
            <tbody>
              ${gainers.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.prev)}</td>
                  <td class="num">${unitVal(r.this)}</td>
                  <td class="num delta-up">+${unitVal(r.delta)}</td>
                  <td class="num">${fmtPct(r.delta_pct)}</td>
                </tr>
              `).join("") || `<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:14px;">No gainers this month.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div>
          <h3 style="font-size:11px;color:#dc2626;margin:6px 0 6px;">🔴 Biggest Losers (Top 30 by Δ)</h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">Prev</th>
              <th class="num">This</th>
              <th class="num">Δ</th>
              <th class="num">Δ%</th>
            </tr></thead>
            <tbody>
              ${losers.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.prev)}</td>
                  <td class="num">${unitVal(r.this)}</td>
                  <td class="num delta-dn">${unitVal(r.delta)}</td>
                  <td class="num">${fmtPct(r.delta_pct)}</td>
                </tr>
              `).join("") || `<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:14px;">No losers this month.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="section-grid2" style="margin-top:12px;">
        <div>
          <h3 style="font-size:11px;color:#1d4ed8;margin:6px 0 6px;">🆕 Newly Active <span style="color:#9ca3af;font-weight:500;">(${newlyA.length})</span></h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">This month</th>
            </tr></thead>
            <tbody>
              ${newlyA.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.this)}</td>
                </tr>
              `).join("") || `<tr><td colspan="2" style="color:#9ca3af;text-align:center;padding:14px;">No newly active sold-to.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div>
          <h3 style="font-size:11px;color:#7c3aed;margin:6px 0 6px;">💤 Newly Silent <span style="color:#9ca3af;font-weight:500;">(${newlyS.length})</span></h3>
          <table>
            <thead><tr>
              <th>Sold-to</th>
              <th class="num">3M avg</th>
              <th class="num">M-3 / M-2 / M-1</th>
            </tr></thead>
            <tbody>
              ${newlyS.map(r => `
                <tr>
                  <td class="name">${esc(r.name)} <span style="color:#9ca3af;font-family:ui-monospace,monospace;font-size:10px;">#${esc(r.sold_to)}</span></td>
                  <td class="num">${unitVal(r.avg3)}</td>
                  <td class="num" style="font-family:ui-monospace,monospace;font-size:11px;">${(r.trailing3 || []).slice().reverse().map(unitVal).join(" / ")}</td>
                </tr>
              `).join("") || `<tr><td colspan="3" style="color:#9ca3af;text-align:center;padding:14px;">No newly silent sold-to.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="notes">
        <b>Gainers / Losers</b>: computed over the <b>full sold-to set</b> with Δ = this-month − previous-month, then the top 30 by absolute Δ on each side are shown.<br>
        <b>Newly Active</b>: ${esc(sold.notes && sold.notes.newly_active || "Sold-to with zero sales in the previous 3 months AND positive sales this month.")} Full list shown.<br>
        <b>Newly Silent</b>: ${esc(sold.notes && sold.notes.newly_silent || "Sold-to with positive sales in the previous month AND zero sales this month.")} Full list shown.
      </div>
    </div>
  `);

  wrap.innerHTML = html.join("");
  // Keep status div hidden but available for next load
  const refreshed = document.getElementById("status");
  if (refreshed) refreshed.style.display = "none";
}

// Boot — default month to the current calendar month if it's in 2026.
(function(){
  const today = new Date();
  const sel = document.getElementById("monthSel");
  if (today.getFullYear() === 2026) {
    const want = `2026-${String(today.getMonth() + 1).padStart(2, "0")}`;
    for (const o of sel.options) { if (o.value === want) { sel.value = want; break; } }
  }
  load();
})();
</script>
</body>
</html>
