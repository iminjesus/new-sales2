<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hankook — Claim form</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f3f4f6;color:#111827;font-size:14px;-webkit-text-size-adjust:100%}
header{background:#1e3a5f;color:#fff;padding:14px 18px;display:flex;
       align-items:center;justify-content:space-between}
header .brand{font-size:15px;font-weight:700;letter-spacing:.3px}
header .sub{font-size:11px;opacity:.8}
.wrap{max-width:560px;margin:0 auto;padding:14px}
/* On wider screens lay New claim (main) and Your claims (side) out
   in two columns; the New claim form is always the primary action so
   it stays in the leading column. */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:880px){
  .wrap{max-width:1080px}
  .grid{grid-template-columns:minmax(0, 1.6fr) minmax(0, 1fr);align-items:start}
}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);
      padding:16px;margin-bottom:14px}
.shop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#eff6ff;
      border:1px solid #dbeafe;border-radius:8px;margin-bottom:14px}
.shop .pin{font-size:18px}
.shop .name{font-weight:700;color:#1e3a5f}
.shop .code{font-size:11px;color:#6b7280;font-family:ui-monospace,monospace}
.shop .cust{font-size:11px;color:#6b7280;margin-top:2px}
h2{font-size:15px;font-weight:700;color:#1e3a5f;margin:0 0 12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:4px}
.field label .req{color:#dc2626;margin-left:2px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:6px;
  font-size:14px;background:#fff;color:#111827;-webkit-appearance:none;appearance:none
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.15)
}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:11px;color:#6b7280;margin-top:3px}
.row2{display:flex;gap:8px}
.row2 .field{flex:1}
.honey{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
/* Photo slots: 5 labelled buttons that open the rear camera on phones. */
.photo-grid{display:grid;gap:8px}
.photo-slot{display:flex;align-items:center;justify-content:space-between;gap:8px;
            padding:10px 12px;border:1.5px dashed #d1d5db;border-radius:8px;
            background:#fafafa;cursor:pointer;transition:border-color .15s,background .15s}
.photo-slot:hover{border-color:#93c5fd;background:#eff6ff}
.photo-slot.filled{border-style:solid;border-color:#22c55e;background:#f0fdf4}
.photo-slot.filled .ps-status{color:#15803d;font-weight:700}
.photo-slot input[type="file"]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-slot .ps-label{font-size:12px;font-weight:600;color:#1e3a5f;line-height:1.2}
.photo-slot .ps-label small{display:block;font-size:10px;font-weight:400;color:#6b7280;margin-top:2px}
.photo-slot .ps-status{font-size:11px;color:#9ca3af;flex-shrink:0;white-space:nowrap}
.btn{display:block;width:100%;background:#2563eb;color:#fff;border:none;
     border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;
     box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:disabled{background:#9ca3af;cursor:not-allowed}
.btn.secondary{background:#fff;color:#1f2937;border:1px solid #d1d5db}
.msg{margin-top:10px;font-size:13px;padding:10px 12px;border-radius:6px;display:none}
.msg.ok{background:#dcfce7;color:#14532d;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.photo-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photo-list img{width:54px;height:54px;object-fit:cover;border-radius:5px;
                border:1px solid #e5e7eb}
.thread{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.bubble{padding:5px 9px;border-radius:8px;font-size:12px;line-height:1.3;
        word-break:break-word;max-width:92%}
.bubble.them{align-self:flex-start;background:#eff6ff;border:1px solid #dbeafe;color:#1e3a5f}
.bubble.us{align-self:flex-end;background:#dcfce7;border:1px solid #bbf7d0;color:#14532d}
.bubble.collapsed{cursor:pointer}
.bubble .head{display:flex;justify-content:space-between;align-items:center;gap:6px;
              font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
              opacity:.75;margin-bottom:2px}
.bubble .head .when{font-weight:400;opacity:.7}
.bubble .cat{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;
              letter-spacing:.3px;padding:0 6px;border-radius:6px;margin-right:4px;
              background:rgba(255,255,255,.65);color:inherit}
.bubble .preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                  overflow:hidden}
.bubble .full{white-space:pre-wrap;word-break:break-word}
.bubble .toggle{display:inline-flex;align-items:center;gap:2px;margin-top:2px;font-size:10px;
                 color:#2563eb;cursor:pointer;opacity:.85}
.bubble .toggle:hover{opacity:1;text-decoration:underline}
.bubble .attach-hint{display:inline-block;font-size:10px;opacity:.7;margin-top:2px;margin-right:6px}
.bubble .ph{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.bubble .ph img{width:50px;height:50px;object-fit:cover;border-radius:4px}
.claim-card{padding:0;border:1px solid #e5e7eb;border-radius:8px;
            margin-bottom:10px;background:#fafafa;overflow:hidden}
.claim-summary{padding:10px 12px;cursor:pointer;list-style:none;
               display:flex;justify-content:space-between;align-items:center;gap:8px}
.claim-summary::-webkit-details-marker{display:none}
.claim-summary:hover{background:#f3f4f6}
.claim-summary .left{flex:1;min-width:0}
.claim-summary .caret{font-size:11px;color:#6b7280;transition:transform .15s}
details[open] .claim-summary .caret{transform:rotate(90deg)}
.claim-body{padding:0 12px 12px}
.claim-head{display:flex;justify-content:space-between;align-items:center;
            font-size:11px;color:#6b7280;margin-bottom:6px}
.claim-title{font-weight:700;color:#1e3a5f;margin-bottom:2px}
.status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
        text-transform:uppercase;letter-spacing:.3px}
.status.New{background:#fef3c7;color:#92400e}
.status.Reviewing{background:#dbeafe;color:#1e40af}
.status\\.Awaiting{background:#fef3c7;color:#92400e}
.status\\.Resolved{background:#dcfce7;color:#166534}
.status\\.Rejected{background:#fee2e2;color:#991b1b}
.reply-box{margin-top:8px}
.reply-box textarea{width:100%;min-height:60px;padding:8px;border:1px solid #d1d5db;
                    border-radius:6px;font-size:13px;font-family:inherit}
.loading{text-align:center;padding:24px;color:#6b7280;font-size:13px}
.err-banner{padding:14px;background:#fee2e2;color:#991b1b;border-radius:8px;
            font-size:13px;text-align:center}
@media (max-width:380px){
  .row2{flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Hankook Australia</div>
    <div class="sub">Claim submission</div>
  </div>
</header>

<div class="wrap">
  <div id="root">
    <div class="loading">Loading shop information…</div>
  </div>
</div>

<script>
const SHIP_TO = location.pathname.split("/").filter(Boolean).pop() || "";
const root = document.getElementById("root");

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

async function fetchJSON(url, opts){
  const r = await fetch(url, opts || {});
  let j = null;
  try { j = await r.json(); } catch { /* non-JSON */ }
  if (!r.ok){
    const msg = (j && j.error) || r.statusText || ("HTTP " + r.status);
    throw new Error(msg);
  }
  return j || {};
}

function statusPill(s){
  const cls = ["status", esc(s).replace(/\s+/g,".")].join(" ");
  return `<span class="${cls}">${esc(s)}</span>`;
}

const CAT_LABEL = {
  ack: "Acknowledge", info: "Request info", visit: "Will visit shop",
  approve: "Approve", reject: "Reject", pickup: "Pickup arranged",
};
function bubble(m){
  const isUs = m.author_type === "customer";
  const photoArr = (m.photo_paths || []).filter(Boolean);
  const photos = photoArr
    .map(p => `<a href="${esc(p)}" target="_blank"><img src="${esc(p)}" alt=""></a>`)
    .join("");
  const cat = (m.category || "").trim();
  const catBadge = cat ? `<span class="cat">${esc(CAT_LABEL[cat] || cat)}</span>` : "";
  const txt = m.text || "";
  const attachHint = photoArr.length ? `<span class="attach-hint">📎 ${photoArr.length}</span>` : "";
  return `
    <div class="bubble ${isUs ? "us" : "them"} collapsed" data-mid="${m.id}">
      <div class="head">
        <span>${catBadge}${esc(m.author_name || (isUs ? "You" : "Hankook"))}</span>
        <span class="when">${esc(m.created_at || "")}</span>
      </div>
      <div class="preview">${esc(txt)}</div>
      <div class="full" style="display:none;">${esc(txt)}</div>
      ${photos ? `<div class="ph" style="display:none;">${photos}</div>` : ""}
      <div class="toggle">${attachHint}<span class="tog-lbl">▼ more</span></div>
    </div>`;
}
function wireBubbleToggles(root){
  if (!root) return;
  root.querySelectorAll(".bubble.collapsed, .bubble.expanded").forEach(b => {
    b.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const expanded = b.classList.toggle("expanded");
      b.classList.toggle("collapsed", !expanded);
      b.querySelector(".preview").style.display = expanded ? "none" : "";
      const full = b.querySelector(".full"); if (full) full.style.display = expanded ? "" : "none";
      const ph   = b.querySelector(".ph");   if (ph)   ph.style.display   = expanded ? "flex" : "none";
      const lbl  = b.querySelector(".tog-lbl");
      if (lbl) lbl.textContent = expanded ? "▲ less" : "▼ more";
    });
  });
}

function renderLanding(){
  root.innerHTML = `
    <div class="card" style="margin-top:24px;text-align:center;max-width:480px;margin-left:auto;margin-right:auto;">
      <div style="font-size:32px;margin-bottom:8px;">🛞</div>
      <h2 style="margin:0 0 6px;">Hankook tyre claim</h2>
      <p style="color:#6b7280;margin:0 0 18px;font-size:13px;line-height:1.5;">
        Enter your shop code to start a claim, or scan the QR sticker
        provided by your Hankook BDE.
      </p>
      <form id="landingForm" autocomplete="off">
        <input id="landingCode" type="text" inputmode="numeric"
               placeholder="e.g. 735486" required maxlength="32"
               style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;
                      font-size:15px;text-align:center;font-family:ui-monospace,Menlo,monospace;
                      letter-spacing:.5px;">
        <button type="submit" class="btn" style="margin-top:10px;width:100%;">Continue →</button>
        <div id="landingMsg" class="msg"></div>
      </form>
      <p style="margin-top:18px;font-size:11px;color:#9ca3af;">
        Don't have a code? Ask your local Hankook BDE for the QR sticker
        for your shop.
      </p>
    </div>
  `;
  document.getElementById("landingForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const code = (document.getElementById("landingCode").value || "").trim();
    const msg  = document.getElementById("landingMsg");
    msg.className = "msg"; msg.textContent = "";
    if (!/^[A-Za-z0-9_-]{4,32}$/.test(code)){
      msg.className = "msg err"; msg.textContent = "That doesn't look like a valid shop code.";
      return;
    }
    location.href = "/" + encodeURIComponent(code);
  });
}

async function renderHome(){
  // Bare-root visit (e.g. claim.hankooktyre.com.au/) — no shop code in
  // the URL.  Show a landing form so the customer can type their shop
  // code or scan the QR sticker.
  if (!SHIP_TO) return renderLanding();
  let shop = null;
  try {
    shop = await fetchJSON(`/api/claim/shop/${encodeURIComponent(SHIP_TO)}`);
  } catch (e){
    root.innerHTML = `<div class="err-banner">Shop code <b>${esc(SHIP_TO)}</b> not recognised.<br>
      Please check the link from your Hankook BDE.</div>`;
    return;
  }
  let prior = { claims: [] };
  try { prior = await fetchJSON(`/api/claim/by_ship/${encodeURIComponent(SHIP_TO)}`); }
  catch {}
  // Claims are collapsed by default — only the most recent one auto-
  // opens so the customer can spot any reply quickly without scrolling.
  const claimsHtml = (prior.claims && prior.claims.length) ? `
    <div class="card">
      <h2>Your claims (${prior.claims.length})</h2>
      ${prior.claims.map((c, idx) => `
        <details class="claim-card" ${idx === 0 ? "open" : ""}>
          <summary class="claim-summary">
            <div class="left">
              <div class="claim-title">#${c.id} · ${esc(c.claim_type || "Other")}</div>
              <div style="font-size:11px;color:#6b7280;">${esc(c.created_at || "")}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              ${statusPill(c.status || "New")}
              <span class="caret">▶</span>
            </div>
          </summary>
          <div class="claim-body">
            <div class="thread">${(c.thread || []).map(bubble).join("")}</div>
            <div class="reply-box">
              <textarea id="reply-${c.id}" placeholder="Reply to Hankook…"></textarea>
              <input type="file" id="reply-photos-${c.id}" accept="image/*" multiple style="margin-top:6px;font-size:12px;">
              <button class="btn" style="margin-top:6px;padding:10px;" onclick="sendReply(${c.id})">Send reply</button>
              <div id="reply-msg-${c.id}" class="msg"></div>
            </div>
          </div>
        </details>
      `).join("")}
    </div>` : "";

  const newClaimHtml = `
    <div class="card">
      <h2>New claim</h2>
      <form id="cForm" autocomplete="on">
        <input type="text" name="website" class="honey" tabindex="-1" autocomplete="off">

        <div class="row2">
          <div class="field">
            <label>Your name <span class="req">*</span></label>
            <input type="text" name="contact_name" required maxlength="120">
          </div>
          <div class="field">
            <label>Phone <span class="req">*</span></label>
            <input type="tel" name="contact_phone" required maxlength="40" inputmode="tel">
          </div>
        </div>

        <div class="field">
          <label>Email <span class="hint">(so we can send updates)</span></label>
          <input type="email" name="contact_email" maxlength="160" inputmode="email">
        </div>

        <div class="field">
          <label>Claim type <span class="req">*</span></label>
          <select name="claim_type" required>
            <option value="Road Hazard Warranty" selected>Road Hazard Warranty</option>
          </select>
        </div>

        <div class="field">
          <label>Product details <span class="hint">(if applicable — pick what you can, in any order)</span></label>
          <div style="display:grid;gap:6px;">
            <select id="claimPG"><option value="">— Product Group —</option></select>
            <select id="claimPattern"><option value="">— Pattern —</option></select>
            <select id="claimSize"><option value="">— Size —</option></select>
          </div>
          <input type="hidden" name="product_size" id="claimProductSize">
        </div>

        <div class="field">
          <label>Describe the issue <span class="req">*</span></label>
          <textarea name="description" required placeholder="What happened, when, how many tyres affected…"></textarea>
        </div>

        <!-- Product photos — the five tyre angles we need to triage the
             claim.  Each input accepts camera capture or gallery upload
             (image or PDF).  Categories ride along as photo_categories. -->
        <div class="field">
          <label>Product photos <span class="req">*</span> <span class="hint">(every slot accepts one or more files; tread measurement needs at least 3)</span></label>
          <div class="photo-grid">
            <label class="photo-slot">
              <span class="ps-label">📸 Whole tyre (sidewall)</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="whole_tyre" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 Tread</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="tread" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 Damaged close-up</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="damaged" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 DOT code</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="dot_code" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 DOT cut</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="dot_cut" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 Serial barcode</span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="serial_barcode" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 Tread measurement <small>at least 3</small></span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="tread_measurement" data-min="3" required multiple>
              <span class="ps-status">0 / 3 files — tap to capture or upload</span>
            </label>
            <label class="photo-slot">
              <span class="ps-label">📸 Others <small>optional</small></span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="others" multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
          </div>
        </div>

        <!-- Proof of purchase — its own section so it's not confused
             with the product photos and easy to spot for the customer. -->
        <div class="field">
          <label>Invoice / receipt <span class="req">*</span> <span class="hint">(PDF or photo — one or more)</span></label>
          <div class="photo-grid">
            <label class="photo-slot invoice-slot">
              <span class="ps-label">🧾 Invoice or receipt <small>(proof of purchase)</small></span>
              <input type="file" name="photos" accept="image/*,application/pdf" data-cat="invoice" required multiple>
              <span class="ps-status">No file — tap to capture or upload</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Submit claim</button>
        <div id="submitMsg" class="msg"></div>
      </form>
    </div>`;

  root.innerHTML = `
    <div class="shop">
      <div class="pin">📍</div>
      <div style="flex:1;">
        <div class="name">${esc(shop.ship_to_name || shop.ship_to)}</div>
        <div class="code">${esc(shop.ship_to)}</div>
        ${shop.sold_to_name ? `<div class="cust">${esc(shop.sold_to_name)}</div>` : ""}
      </div>
    </div>

    <div class="grid">
      <div>${newClaimHtml}</div>
      <div>${claimsHtml}</div>
    </div>
  `;

  document.getElementById("cForm").addEventListener("submit", submitClaim);
  // Make every conversation bubble (in every prior-claim card)
  // collapsible — click to expand the full message + photos.
  root.querySelectorAll(".claim-card .thread").forEach(wireBubbleToggles);
  // Cascading Product Group → Pattern → Size dropdowns, sourced from
  // carrying_26 via the same endpoints the Sales Dashboard uses. The
  // selections are combined into the hidden product_size field so the
  // backend storage stays a single string.
  wireProductDropdowns();
  // Live-update each photo slot's status as soon as a file is chosen
  // so the user can see at a glance which slots still need a photo.
  document.querySelectorAll(".photo-slot input[type='file']").forEach(inp => {
    inp.addEventListener("change", () => {
      const slot = inp.closest(".photo-slot");
      const stat = slot.querySelector(".ps-status");
      const got  = (inp.files && inp.files.length) || 0;
      const min  = parseInt(inp.dataset.min || (inp.hasAttribute("required") ? "1" : "0"), 10);
      const enough = got >= min;
      slot.classList.toggle("filled", got > 0 && enough);
      if (got === 0){
        stat.textContent = min > 1
          ? `0 / ${min} files — tap to capture or upload`
          : "No file — tap to capture or upload";
      } else if (min > 1){
        stat.textContent = `${got} / ${min} files${enough ? " ✓" : ""}`;
      } else if (got === 1){
        stat.textContent = "✓ " + (inp.files[0].name || "Captured");
      } else {
        stat.textContent = `✓ ${got} files`;
      }
    });
  });
}

function wireProductDropdowns(){
  const pgSel   = document.getElementById("claimPG");
  const patSel  = document.getElementById("claimPattern");
  const sizeSel = document.getElementById("claimSize");
  const hidden  = document.getElementById("claimProductSize");
  if (!pgSel || !patSel || !sizeSel || !hidden) return;

  let MATRIX = [];   // [{pg, pattern, size}, …] — fetched once, filtered locally

  function updateHidden(){
    const parts = [pgSel.value, patSel.value, sizeSel.value]
                    .map(v => (v || "").trim()).filter(Boolean);
    hidden.value = parts.join(" / ");
  }

  function fill(sel, items, placeholder){
    const keep = sel.value;
    const opts = [`<option value="">${esc(placeholder)}</option>`]
      .concat((items || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`));
    sel.innerHTML = opts.join("");
    // Keep the user's previous pick when it's still a valid option;
    // otherwise drop back to "—" so they can't keep a stale selection.
    sel.value = items.includes(keep) ? keep : "";
  }

  // Derive each dropdown's option set from the matrix filtered by the
  // OTHER two selections.  That way picking any single dropdown narrows
  // the remaining two, in any direction — pick Size first to filter
  // Pattern + Group, or Pattern first to filter Group + Size, etc.
  function refresh(){
    const pg  = pgSel.value;
    const pat = patSel.value;
    const sz  = sizeSel.value;
    const uniq = (rows, key) => [...new Set(rows.map(r => r[key]).filter(Boolean))].sort();
    fill(pgSel,   uniq(MATRIX.filter(r => (!pat || r.pattern === pat) && (!sz || r.size === sz)), "pg"),       "— Product Group —");
    fill(patSel,  uniq(MATRIX.filter(r => (!pg  || r.pg      === pg ) && (!sz || r.size === sz)), "pattern"),  "— Pattern —");
    fill(sizeSel, uniq(MATRIX.filter(r => (!pg  || r.pg      === pg ) && (!pat || r.pattern === pat)), "size"), "— Size —");
    updateHidden();
  }

  pgSel  .addEventListener("change", refresh);
  patSel .addEventListener("change", refresh);
  sizeSel.addEventListener("change", refresh);

  fetchJSON("/api/carrying_matrix").then(rows => {
    MATRIX = Array.isArray(rows) ? rows : [];
    refresh();
  }).catch(() => {
    fill(pgSel,   [], "— Product Group (load failed) —");
    fill(patSel,  [], "— Pattern (load failed) —");
    fill(sizeSel, [], "— Size (load failed) —");
  });
}

async function submitClaim(e){
  e.preventDefault();
  const form = e.target;
  const btn  = document.getElementById("submitBtn");
  const msg  = document.getElementById("submitMsg");
  msg.className = "msg";
  msg.textContent = "";
  btn.disabled = true; btn.textContent = "Submitting…";
  // Belt-and-braces validation: make sure every photo slot has a file
  // before we POST so the user gets a clearer error than the server's.
  // Required slots: all seven product photos.  Tread measurement is a
  // multi-file slot (3 grooves required); the others take one file.
  // Build the categories list ALIGNED PER FILE — empty inputs still
  // send one entry, multi-file inputs send N entries — so the backend
  // can match each saved photo to its category by index.
  const slots = form.querySelectorAll(".photo-slot input[type='file']");
  const cats  = [];
  let missing = 0;
  slots.forEach(inp => {
    const got = (inp.files && inp.files.length) || 0;
    const min = parseInt(inp.dataset.min || "1", 10);
    // Push the category once per file actually present; otherwise once
    // to align with the empty entry the browser still submits.
    const n = Math.max(got, 1);
    for (let i = 0; i < n; i++) cats.push(inp.dataset.cat || "");
    if (inp.hasAttribute("required") && got < min) missing += (min - got);
  });
  if (missing > 0){
    msg.className = "msg err";
    msg.textContent = `Please attach the remaining ${missing} required file${missing === 1 ? "" : "s"} before submitting.`;
    btn.disabled = false; btn.textContent = "Submit claim";
    return;
  }
  try {
    const fd = new FormData(form);
    fd.append("photo_categories", cats.join(","));
    const r = await fetch(`/api/claim/by_ship/${encodeURIComponent(SHIP_TO)}`, {
      method: "POST", body: fd,
    });
    const j = await r.json();
    if (!r.ok){
      msg.className = "msg err";
      msg.textContent = j.error || ("HTTP " + r.status);
    } else {
      msg.className = "msg ok";
      msg.textContent = `Thanks — your claim #${j.id} has been submitted. We will be in touch shortly.`;
      form.reset();
      // Reload so the new claim appears in the prior-claims block.
      setTimeout(renderHome, 1200);
    }
  } catch (err){
    msg.className = "msg err";
    msg.textContent = err.message;
  }
  btn.disabled = false; btn.textContent = "Submit claim";
}

async function sendReply(cid){
  const ta  = document.getElementById("reply-" + cid);
  const ph  = document.getElementById("reply-photos-" + cid);
  const msg = document.getElementById("reply-msg-" + cid);
  msg.className = "msg"; msg.textContent = "";
  const text = (ta.value || "").trim();
  if (!text){
    msg.className = "msg err"; msg.textContent = "Type a reply first.";
    return;
  }
  const fd = new FormData();
  fd.append("ship_to", SHIP_TO);
  fd.append("text", text);
  fd.append("website", "");   // honeypot
  for (const f of (ph.files || [])) fd.append("photos", f);
  try {
    const r = await fetch(`/api/claim/${cid}/customer_reply`, { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok){
      msg.className = "msg err"; msg.textContent = j.error || ("HTTP " + r.status);
    } else {
      ta.value = ""; ph.value = "";
      msg.className = "msg ok"; msg.textContent = "Reply sent.";
      setTimeout(renderHome, 800);
    }
  } catch (err){
    msg.className = "msg err"; msg.textContent = err.message;
  }
}

renderHome();
</script>
