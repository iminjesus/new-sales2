<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock</title>

  <link rel="stylesheet" href="/static/style.css?v=20260715">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

</head>

<body>
  <h2 style="margin:10px 0 8px; font-size:18px; color:#111827; font-weight:700; letter-spacing:-0.01em;">Stock</h2>

  <!-- Mobile: toggle button for filter panel -->
  <button id="filterToggleBtn" class="filter-toggle-btn">
    <span>&#9881; Filters</span><span class="filter-toggle-arrow">&#9660;</span>
  </button>

  <div id="filterPanel">

  <!-- ── Top filter bar (includes dropdowns) ── -->
  <div style="display:flex; gap:8px; align-items:stretch; margin-bottom:6px;">
    <div id="topRow" class="filter-bar" style="flex:1; margin-bottom:0; flex-wrap:wrap; width:100%;">
      <div id="catBtns" style="display:flex; gap:5px; flex-wrap:wrap;">
        <button class="btn active" data-val="ALL">All</button>
        <button class="btn" data-val="PCLT">PCLT</button>
        <button class="btn" data-val="TBR">TBR</button>
        <button class="btn" data-val="18PLUS">18+ Inch</button>
        <button class="btn" data-val="ISEG">EV/iSeg</button>
        <button class="btn" data-val="SUV">SUV</button>
        <button class="btn" data-val="LOWPROFILE">Low profile / Strategic TBR</button>
        <button class="btn" data-val="HM">HM</button>
        <button class="btn" data-val="HK">HK</button>
        <button class="btn" data-val="LF">LF</button>
      </div>

      <div class="filter-sep"></div>

      <div id="ordersMetricBtns" style="display:flex; gap:5px;">
        <button class="btn active" data-metric="po">Orders PO</button>
        <button class="btn" data-metric="confirm">Ready to Ship</button>
      </div>

      <div class="filter-sep"></div>

      <!-- Product Group (moved from second bar) -->
      <div class="dd" id="ddProductGroup">
        <label for="product_group">Product Group</label>
        <div class="dd-wrap">
          <input id="product_group" type="text" placeholder="All Groups" autocomplete="off">
          <button type="button" class="dd-btn" id="pgBtn">▼</button>
          <button type="button" class="dd-btn dd-clear-btn" id="pgClear">✕</button>
        </div>
        <div class="dd-menu" id="pgMenu"></div>
      </div>

      <!-- Pattern -->
      <div class="dd" id="ddPattern">
        <label for="pattern">Pattern</label>
        <div class="dd-wrap">
          <input id="pattern" type="text" placeholder="Search Pattern" autocomplete="off">
          <button type="button" class="dd-btn" id="patternBtn">▼</button>
          <button type="button" class="dd-btn dd-clear-btn" id="patternClear">✕</button>
        </div>
        <div class="dd-menu" id="patternMenu"></div>
      </div>

      <!-- Size -->
      <div class="dd" id="ddMaterial">
        <label for="material">Size</label>
        <div class="dd-wrap">
          <input id="material" type="text" placeholder="Search Size" autocomplete="off">
          <button type="button" class="dd-btn" id="materialBtn">▼</button>
          <button type="button" class="dd-btn dd-clear-btn" id="materialClear">✕</button>
        </div>
        <div class="dd-menu" id="materialMenu"></div>
      </div>

      <!-- Code (custom dropdown — carrying_26.m_code) -->
      <div class="dd" id="ddCode">
        <label for="code">Code</label>
        <div class="dd-wrap">
          <input id="code" type="text" placeholder="Search Code" autocomplete="off">
          <button type="button" class="dd-btn" id="codeBtn">▼</button>
          <button type="button" class="dd-btn dd-clear-btn" id="codeClear">✕</button>
        </div>
        <div class="dd-menu" id="codeMenu"></div>
      </div>

      <!-- Clear all four narrowing dropdowns (Product Group / Pattern /
           Size / Code) in one click.  Category chips + Orders-PO /
           Ready-to-Ship stay as-is — those are toggled, not searched. -->
      <button type="button" id="clearAllFiltersBtn" class="btn clear-all-btn"
              title="Clear Product Group / Pattern / Size / Code filters">
        ✕ Clear
      </button>

      <div id="viewSwitch" style="margin-left:auto; display:flex; gap:6px;">
        <button class="btn" onclick="window.location.href='/' + window.location.search">Graph View</button>
        <button class="btn" onclick="window.location.href='/map' + window.location.search">Map View</button>
        <button class="btn active">Stock</button>
        <button class="btn" onclick="window.location.href='/rebate'">Rebate</button>
        <button class="btn" onclick="window.location.href='/price'">Price</button>
        <button class="btn" onclick="window.location.href='/meeting'">Meeting</button>
        <button class="btn" onclick="window.location.href='/claims'">Claims</button>
        <button class="btn" onclick="window.location.href='/order'">📝 Order</button>
      <button class="btn" onclick="window.location.href='/orders_list'">📋 Orders</button>
        <button class="btn" onclick="window.location.href='/highlights'">📊 Highlights</button>
      </div>
    </div>
  </div>

  </div><!-- end #filterPanel -->

  <div id="errbar" class="errbar" hidden></div>

  <!-- Floating "Loading…" badge.  setFiltersDisabled(true) toggles
       data-loading="1" on <body>; CSS slides the badge into view so
       the user sees that a filter click is being processed. -->
  <div id="loadingBadge" aria-hidden="true">
    <span class="lb-spin"></span>
    <span>Loading…</span>
  </div>

  <div id="stockLayout">
    <!-- Left: map -->
    <div id="stockMapWrapper">
      <div id="stockMap"></div>
      <!-- Floating overlay: Monthly + Yearly sales charts sit over the
           Indian-Ocean blank space of the map so the right column can
           give every pixel to the (about-to-be-wider) State table. -->
      <div id="stockChartsOverlay">
        <div class="stockChartPane">
          <h4>Monthly Sales</h4>
          <canvas id="salesMonthlyChart"></canvas>
        </div>
        <div class="stockChartPane">
          <h4>Yearly Sales</h4>
          <canvas id="salesYearlyChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Right: state table + sales charts -->
    <div id="stockSidePanel">

      <!-- Price box -->
      <div id="priceBox" style="display:flex; gap:16px; align-items:center; justify-content:center; background:#fff; border:1px solid #e5e7eb; border-radius:7px; padding:10px 20px; flex-shrink:0;">
        <div class="price-cell">
          <span class="price-lbl">List Price</span>
          <span class="price-val" id="priceList">—</span>
        </div>
      </div>

      <!-- Cascade table: drills Line → Product Group → Pattern → Size
           with the same metric set as the State table.  First column
           header carries the breadcrumb so the user always sees where
           they are in the cascade.  Row click drills one step deeper;
           the ← Back chip in the header steps out. -->
      <div id="cascadeTableWrap">
        <div class="cascade-header">
          <span id="cascadeCrumb">All › Line</span>
          <button id="cascadeBack" type="button" style="display:none;">← Back</button>
          <!-- Toggle: replaces the cascade body with just the s_code
               rows whose Stock.idx ≤ 1.5 mo — the "about to stock
               out" list.  Same interaction as a normal size row:
               click a row to drill the cascade to that size. -->
          <button id="lowStockBtn" type="button" title="Show only s_codes with Stock.idx ≤ 1.5 months">
            ⚠ Low stock warning
          </button>
          <!-- Full-reset chip: appears only while the user is in
               the low-stock workflow (list OR drilled from it).
               Click clears the warning context + any code filter
               and drops the user back on the normal full cascade. -->
          <button id="showAllStockBtn" type="button"
                  title="Exit low-stock workflow and show every s_code again"
                  hidden>
            ← Show all stock
          </button>
          <!-- State chip row (only visible while the low-stock body
               is on).  ALL rolls every state into one row per
               s_code; a specific state narrows AND still one row
               per s_code, only for that state. -->
          <div id="lowStockStateSeg" class="hist-state-seg" hidden>
            <button type="button" class="hist-st-btn active" data-st="ALL">All</button>
            <button type="button" class="hist-st-btn" data-st="NSW">NSW</button>
            <button type="button" class="hist-st-btn" data-st="QLD">QLD</button>
            <button type="button" class="hist-st-btn" data-st="VIC">VIC</button>
            <button type="button" class="hist-st-btn" data-st="WA">WA</button>
          </div>
          <span id="lowStockCount"></span>
        </div>
        <table id="cascadeTable">
          <thead>
            <tr>
              <th id="cascadeBucketTh">Line</th>
              <th>State</th>
              <th>3M</th>
              <th>6M</th>
              <th>12M</th>
              <th>Base Sales</th>
              <th class="st-qty-hdr">Stock</th>
              <th class="st-qty-hdr">Water</th>
              <th class="st-qty-hdr">CY</th>
              <th class="st-qty-hdr">Factory</th>
              <th>Stock.idx</th>
              <th>+Water.idx</th>
              <th>+Factory.idx</th>
            </tr>
          </thead>
          <tbody id="cascadeTableBody">
            <tr><td colspan="13" class="st-loading">Loading…</td></tr>
          </tbody>
          <tfoot id="cascadeTableFoot"></tfoot>
        </table>
      </div>

      <!-- Monthly history: month-start stock vs the same month's
           HK+LF sell-out. Backed by stock_history (populated by
           sapcrawling_history_26.py) + sales_2526.  Reacts to the
           same filter chips as the cascade above. -->
      <div id="stockHistoryWrap">
        <div class="stock-history-head">
          <h4>Monthly History — Stock (month start) vs Sales (that month)</h4>
          <button type="button" id="stockAgingToggle" class="ag-toggle" title="Add aging-bucket breakdown">
            ▸ Aging
          </button>
          <!-- Region chip: filter both the line chart and the aging
               bars to a single state's warehouse.  Each state maps to
               one 3PL plant (NSW=42R1, QLD=42R0, VIC=42R2, WA=42R4). -->
          <div id="stockHistoryStateSeg" class="hist-state-seg">
            <button type="button" class="hist-st-btn active" data-st="ALL">All</button>
            <button type="button" class="hist-st-btn" data-st="NSW">NSW</button>
            <button type="button" class="hist-st-btn" data-st="QLD">QLD</button>
            <button type="button" class="hist-st-btn" data-st="VIC">VIC</button>
            <button type="button" class="hist-st-btn" data-st="WA">WA</button>
          </div>
          <span id="stockHistoryHint"></span>
        </div>
        <div class="stock-history-canvasWrap">
          <canvas id="stockHistoryChart"></canvas>
        </div>
        <!-- Optional aging stacked-bar sibling — hidden until
             the ▸ Aging chip is clicked.  Shares the same x
             labels (months) as the line chart above so the two
             read together. -->
        <div id="stockAgingHistoryWrap" hidden>
          <div class="stock-history-subhead">
            Stock composition by DOT age (as of each month start)
          </div>
          <div class="stock-history-canvasWrap">
            <canvas id="stockAgingHistoryChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
  (function () {
    var btn = document.getElementById("filterToggleBtn");
    var panel = document.getElementById("filterPanel");
    if (btn && panel) {
      btn.addEventListener("click", function () {
        var open = panel.classList.toggle("open");
        btn.querySelector(".filter-toggle-arrow").textContent = open ? "\u25b2" : "\u25bc";
      });
    }
  })();
  </script>

  <script src="/static/stock.js?v=20260715e" defer></script>
</body>
</html>
